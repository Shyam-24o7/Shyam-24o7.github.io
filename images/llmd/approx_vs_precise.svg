<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Two ways to know where a prefix is cached</text>
<rect x="16" y="40" width="316" height="252" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><rect x="348" y="40" width="316" height="252" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="174" y="58" text-anchor="middle" class="h" style="fill: rgb(48,148,255);">approximate: remember where you sent it</text><text x="506" y="58" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">precise: listen to the pods</text><rect x="40" y="76" width="268" height="30" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="174" y="91" text-anchor="middle" class="mut">prompt text, cut into ~64-token chunks</text><rect x="52" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="70" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h0</text><rect x="94" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="112" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h1</text><rect x="136" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="154" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h2</text><rect x="178" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="196" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h3</text><rect x="220" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="238" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h4</text><rect x="262" y="114" width="36" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="280" y="123" text-anchor="middle" class="mut" style="font-size: 9px;">h5</text><text x="174" y="146" text-anchor="middle" class="mut">each hash chains the one before it</text><line x1="174" y1="156" x2="174.0" y2="164.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="174,172 178.5,164.0 169.5,164.0" fill="rgba(200,210,230,0.55)"/><rect x="56" y="174" width="236" height="44" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="174" y="190" text-anchor="middle" class="n">EPP’s own LRU index</text><text x="174" y="206" text-anchor="middle" class="mut">hash → pod it was sent to</text><text x="174" y="236" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">no tokenizer, no extra wiring</text><text x="174" y="252" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">but it only guesses: if a pod evicts</text><text x="174" y="266" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">a block, the index never finds out</text><rect x="368" y="76" width="84" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="410" y="91" text-anchor="middle" class="n">vLLM pod 0</text><rect x="466" y="76" width="84" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="508" y="91" text-anchor="middle" class="n">vLLM pod 1</text><rect x="564" y="76" width="84" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="606" y="91" text-anchor="middle" class="n">vLLM pod 2</text><path d="M410 107 L506 150" stroke="rgba(0,214,162,0.6)" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/><path d="M508 107 L506 150" stroke="rgba(0,214,162,0.6)" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/><path d="M606 107 L506 150" stroke="rgba(0,214,162,0.6)" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/><text x="366" y="128" text-anchor="start" class="mut" style="fill: rgb(0,214,162);">KV events</text><text x="366" y="140" text-anchor="start" class="mut">over ZMQ</text><rect x="392" y="152" width="228" height="52" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="506" y="168" text-anchor="middle" class="n">global block index</text><text x="506" y="184" text-anchor="middle" class="mut">block key → pods, per tier</text><text x="506" y="197" text-anchor="middle" class="mut" style="font-size: 9px;">BlockStored · BlockRemoved</text><text x="506" y="222" text-anchor="middle" class="mut">exact token IDs from vLLM’s render endpoint</text><text x="506" y="238" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">tracks eviction, CPU tiers, multimodal keys</text><text x="506" y="254" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">costs a tokenizer sidecar, ZMQ wiring</text><text x="506" y="268" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">and engine support for events</text><text x="340" y="312" text-anchor="middle" class="lbl">Both feed the same prefix-cache scorer. Precise wins when caches churn under pressure.</text>
</svg>
