<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Filter, score, pick: one request, three pods</text>
<text x="340" y="42" text-anchor="middle" class="mut">weighted sum of scorer outputs (each 0 to 1); illustrative values</text>
<text x="40" y="66" text-anchor="start" class="mut">pod</text><text x="190" y="66" text-anchor="middle" class="mut">prefix cache ×3</text><text x="320" y="66" text-anchor="middle" class="mut">KV headroom ×2</text><text x="450" y="66" text-anchor="middle" class="mut">short queue ×2</text><text x="580" y="66" text-anchor="middle" class="mut">total</text><rect x="20" y="78" width="640" height="32" rx="3" fill="rgba(0,214,162,0.10)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="40" y="89" text-anchor="start" class="h">pod A</text><text x="40" y="102" text-anchor="start" class="mut" style="font-size: 9px;">holds the prefix</text><rect x="145" y="87" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="145" y="87" width="81.0" height="6" fill="rgb(48,148,255)"/><text x="190" y="102" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.9 × 3 = 2.7</text><rect x="275" y="87" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="275" y="87" width="18.0" height="6" fill="rgb(48,148,255)"/><text x="320" y="102" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.2 × 2 = 0.4</text><rect x="405" y="87" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="405" y="87" width="36.0" height="6" fill="rgb(48,148,255)"/><text x="450" y="102" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.4 × 2 = 0.8</text><text x="580" y="94" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">3.9</text><text x="640" y="94" text-anchor="end" class="mut" style="fill: rgb(0,214,162);">picked</text><rect x="20" y="118" width="640" height="32" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="40" y="129" text-anchor="start" class="h">pod B</text><text x="40" y="142" text-anchor="start" class="mut" style="font-size: 9px;">cold, idle</text><rect x="145" y="127" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="145" y="127" width="0.0" height="6" fill="rgb(48,148,255)"/><text x="190" y="142" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.0 × 3 = 0.0</text><rect x="275" y="127" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="275" y="127" width="63.0" height="6" fill="rgb(48,148,255)"/><text x="320" y="142" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.7 × 2 = 1.4</text><rect x="405" y="127" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="405" y="127" width="81.0" height="6" fill="rgb(48,148,255)"/><text x="450" y="142" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.9 × 2 = 1.8</text><text x="580" y="134" text-anchor="middle" class="h">3.2</text><rect x="20" y="158" width="640" height="32" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="40" y="169" text-anchor="start" class="h">pod C</text><text x="40" y="182" text-anchor="start" class="mut" style="font-size: 9px;">partial match</text><rect x="145" y="167" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="145" y="167" width="36.0" height="6" fill="rgb(48,148,255)"/><text x="190" y="182" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.4 × 3 = 1.2</text><rect x="275" y="167" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="275" y="167" width="45.0" height="6" fill="rgb(48,148,255)"/><text x="320" y="182" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.5 × 2 = 1.0</text><rect x="405" y="167" width="90" height="6" fill="rgba(200,210,230,0.12)"/><rect x="405" y="167" width="63.0" height="6" fill="rgb(48,148,255)"/><text x="450" y="182" text-anchor="middle" class="mut" style="font-size: 9.5px;">0.7 × 2 = 1.4</text><text x="580" y="174" text-anchor="middle" class="h">3.6</text><text x="340" y="216" text-anchor="middle" class="lbl">Cache affinity wins: A already holds most of the prompt, so its prefill is nearly free.</text>
<rect x="20" y="232" width="640" height="56" rx="3" fill="rgba(255,162,0,0.06)" stroke="rgba(255,162,0,0.6)" stroke-width="1" /><text x="36" y="248" text-anchor="start" class="h" style="fill: rgb(255,162,0);">Now pod A’s queue fills up</text><text x="36" y="266" text-anchor="start" class="mut">A: 2.7 + 0.4 + 0.0 = 3.1</text><text x="200" y="266" text-anchor="start" class="mut">B: 0.0 + 1.4 + 1.8 = 3.2</text><text x="380" y="266" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">B is picked: load outweighs the cache hit</text><text x="36" y="280" text-anchor="start" class="mut" style="font-size: 9.5px;">This is the cache-versus-load tradeoff, settled by the weights.</text><text x="340" y="312" text-anchor="middle" class="mut">Tuning the weights decides how much cache locality you trade for balance.</text>
</svg>
