<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Why GPU utilisation is the wrong signal for autoscaling</text>
<text x="340" y="42" text-anchor="middle" class="mut">one decode pod at light load and at overload (illustrative)</text>
<text x="330" y="64" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">light load</text><text x="540" y="64" text-anchor="middle" class="h" style="fill: rgb(255,110,110);">overloaded</text><rect x="20" y="80" width="640" height="34" rx="3" fill="rgba(255,162,0,0.07)" stroke="rgba(255,162,0,0.5)" stroke-width="1" /><text x="36" y="97" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">GPU utilisation</text><rect x="250" y="93" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="250" y="93" width="124.8" height="8" fill="rgb(0,214,162)"/><text x="390" y="97" text-anchor="start" class="n">96%</text><rect x="460" y="93" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="460" y="93" width="128.7" height="8" fill="rgb(255,110,110)"/><text x="600" y="97" text-anchor="start" class="n">99%</text><rect x="20" y="122" width="640" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="36" y="139" text-anchor="start" class="lbl">requests waiting in queue</text><rect x="250" y="135" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="250" y="135" width="0.0" height="8" fill="rgb(0,214,162)"/><text x="390" y="139" text-anchor="start" class="n">0</text><rect x="460" y="135" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="460" y="135" width="117.0" height="8" fill="rgb(255,110,110)"/><text x="600" y="139" text-anchor="start" class="n">40+</text><rect x="20" y="164" width="640" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="36" y="181" text-anchor="start" class="lbl">KV cache in use</text><rect x="250" y="177" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="250" y="177" width="45.5" height="8" fill="rgb(0,214,162)"/><text x="390" y="181" text-anchor="start" class="n">35%</text><rect x="460" y="177" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="460" y="177" width="127.4" height="8" fill="rgb(255,110,110)"/><text x="600" y="181" text-anchor="start" class="n">98%</text><rect x="20" y="206" width="640" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="36" y="223" text-anchor="start" class="lbl">time to first token</text><rect x="250" y="219" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="250" y="219" width="10.4" height="8" fill="rgb(0,214,162)"/><text x="390" y="223" text-anchor="start" class="n">0.2 s</text><rect x="460" y="219" width="130" height="8" fill="rgba(200,210,230,0.12)"/><rect x="460" y="219" width="123.5" height="8" fill="rgb(255,110,110)"/><text x="600" y="223" text-anchor="start" class="n">4 s</text><text x="340" y="262" text-anchor="middle" class="lbl">Batching keeps the GPU busy either way, so utilisation cannot tell a calm pod from a drowning one.</text>
<text x="340" y="280" text-anchor="middle" class="mut">llm-d scales on what the router sees: queue depth, saturation, token backlog, predicted latency.</text>
</svg>
