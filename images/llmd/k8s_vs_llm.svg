<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What a Kubernetes Service assumes, and what an LLM pod really is</text>
<rect x="16" y="40" width="316" height="246" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><rect x="348" y="40" width="316" height="246" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="174" y="58" text-anchor="middle" class="h" style="fill: rgb(255,110,110);">the assumption</text><text x="506" y="58" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">the reality</text><rect x="124" y="72" width="100" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="174" y="85" text-anchor="middle" class="n">Service</text><line x1="174" y1="99" x2="81.7" y2="123.9" stroke="rgba(200,210,230,0.4)" stroke-width="1.2" /><polygon points="74,126 82.9,128.3 80.6,119.6" fill="rgba(200,210,230,0.4)"/><rect x="32" y="128" width="84" height="64" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="74" y="146" text-anchor="middle" class="n">pod 0</text><text x="74" y="164" text-anchor="middle" class="mut">identical</text><text x="74" y="178" text-anchor="middle" class="mut">stateless</text><line x1="174" y1="99" x2="172.6" y2="118.0" stroke="rgba(200,210,230,0.4)" stroke-width="1.2" /><polygon points="172,126 177.1,118.4 168.1,117.7" fill="rgba(200,210,230,0.4)"/><rect x="130" y="128" width="84" height="64" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="172" y="146" text-anchor="middle" class="n">pod 1</text><text x="172" y="164" text-anchor="middle" class="mut">identical</text><text x="172" y="178" text-anchor="middle" class="mut">stateless</text><line x1="174" y1="99" x2="262.3" y2="123.8" stroke="rgba(200,210,230,0.4)" stroke-width="1.2" /><polygon points="270,126 263.5,119.5 261.1,128.2" fill="rgba(200,210,230,0.4)"/><rect x="228" y="128" width="84" height="64" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="270" y="146" text-anchor="middle" class="n">pod 2</text><text x="270" y="164" text-anchor="middle" class="mut">identical</text><text x="270" y="178" text-anchor="middle" class="mut">stateless</text><text x="174" y="214" text-anchor="middle" class="mut">pick any pod: random or round robin</text><text x="174" y="230" text-anchor="middle" class="mut">every request costs about the same</text><text x="174" y="246" text-anchor="middle" class="mut">scale when CPU or GPU utilisation is high</text><text x="174" y="270" text-anchor="middle" class="lbl" style="fill: rgb(255,110,110);">right for a web API</text><rect x="364" y="72" width="84" height="140" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="406" y="86" text-anchor="middle" class="n">pod 0</text><text x="406" y="101" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">decode</text><text x="406" y="120" text-anchor="middle" class="mut" style="font-size: 9px;">chat #42 cached</text><text x="372" y="140" text-anchor="start" class="mut" style="font-size: 9px;">queue</text><rect x="372" y="146" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="372" y="146" width="20.4" height="6" fill="rgb(0,214,162)"/><text x="372" y="164" text-anchor="start" class="mut" style="font-size: 9px;">KV cache</text><rect x="372" y="170" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="372" y="170" width="57.8" height="6" fill="rgb(255,162,0)"/><text x="372" y="188" text-anchor="start" class="mut" style="font-size: 9px;">GPU util</text><rect x="372" y="194" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="372" y="194" width="66.0" height="6" fill="rgba(200,210,230,0.55)"/><rect x="462" y="72" width="84" height="140" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="504" y="86" text-anchor="middle" class="n">pod 1</text><text x="504" y="101" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">decode</text><text x="504" y="120" text-anchor="middle" class="mut" style="font-size: 9px;">system prompt X</text><text x="470" y="140" text-anchor="start" class="mut" style="font-size: 9px;">queue</text><rect x="470" y="146" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="470" y="146" width="61.2" height="6" fill="rgb(255,110,110)"/><text x="470" y="164" text-anchor="start" class="mut" style="font-size: 9px;">KV cache</text><rect x="470" y="170" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="470" y="170" width="64.6" height="6" fill="rgb(255,162,0)"/><text x="470" y="188" text-anchor="start" class="mut" style="font-size: 9px;">GPU util</text><rect x="470" y="194" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="470" y="194" width="66.0" height="6" fill="rgba(200,210,230,0.55)"/><rect x="560" y="72" width="84" height="140" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="602" y="86" text-anchor="middle" class="n">pod 2</text><text x="602" y="101" text-anchor="middle" class="mut" style="fill: rgb(170,130,255);">prefill</text><text x="602" y="120" text-anchor="middle" class="mut" style="font-size: 9px;">cold cache</text><text x="568" y="140" text-anchor="start" class="mut" style="font-size: 9px;">queue</text><rect x="568" y="146" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="568" y="146" width="6.8" height="6" fill="rgb(0,214,162)"/><text x="568" y="164" text-anchor="start" class="mut" style="font-size: 9px;">KV cache</text><rect x="568" y="170" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="568" y="170" width="27.2" height="6" fill="rgb(48,148,255)"/><text x="568" y="188" text-anchor="start" class="mut" style="font-size: 9px;">GPU util</text><rect x="568" y="194" width="68" height="6" fill="rgba(200,210,230,0.12)"/><rect x="568" y="194" width="66.0" height="6" fill="rgba(200,210,230,0.55)"/><text x="506" y="230" text-anchor="middle" class="mut">each pod holds a different KV cache,</text><text x="506" y="246" text-anchor="middle" class="mut">requests differ in cost by 1000×, and GPU</text><text x="506" y="262" text-anchor="middle" class="mut">utilisation reads ~100% whether busy or not</text><text x="340" y="306" text-anchor="middle" class="lbl">llm-d keeps Kubernetes for running pods, and replaces the part that picks one.</text>
</svg>
