<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">The KV cache hierarchy, and why loading beats recomputing</text>
<rect x="260" y="46" width="160" height="32" rx="4" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="340" y="56" text-anchor="middle" class="h">GPU HBM</text><text x="340" y="70" text-anchor="middle" class="mut" style="font-size: 9.5px;">80 GB per H100 · 3.35 TB/s</text><rect x="205" y="86" width="270" height="32" rx="4" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="340" y="96" text-anchor="middle" class="h">CPU DRAM</text><text x="340" y="110" text-anchor="middle" class="mut" style="font-size: 9.5px;">1 to 2 TB per server · ~55 GB/s per GPU (PCIe 5)</text><rect x="150" y="126" width="380" height="32" rx="4" fill="rgb(40,22,64)" stroke="rgb(170,130,255)"/><text x="340" y="136" text-anchor="middle" class="h">local NVMe</text><text x="340" y="150" text-anchor="middle" class="mut" style="font-size: 9.5px;">tens of TB per server · ~10 GB/s per server</text><rect x="90" y="166" width="500" height="32" rx="4" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/><text x="340" y="176" text-anchor="middle" class="h">shared storage</text><text x="340" y="190" text-anchor="middle" class="mut" style="font-size: 9.5px;">effectively unlimited · ~50 GB/s (400 Gb/s NIC)</text><text x="30" y="66" text-anchor="start" class="mut">faster,</text><text x="30" y="78" text-anchor="start" class="mut">smaller</text><text x="30" y="190" text-anchor="start" class="mut">slower,</text><text x="30" y="202" text-anchor="start" class="mut">bigger</text><line x1="46" y1="90" x2="46.0" y2="168.0" stroke="rgba(200,210,230,0.4)" stroke-width="1.2" /><polygon points="46,176 50.5,168.0 41.5,168.0" fill="rgba(200,210,230,0.4)"/><rect x="20" y="214" width="640" height="112" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="36" y="232" text-anchor="start" class="h">A returning user: 32K tokens of Llama 3 70B context, 10.7 GB of KV, on 4 H100s</text><text x="36" y="255" text-anchor="start" class="lbl">recompute the prefill</text><text x="210" y="255" text-anchor="start" class="mut" style="font-size: 9.5px;">≈ 6 PFLOPs at 60% of peak</text><rect x="380" y="248" width="220.0" height="14" rx="2" fill="rgb(255,110,110)" opacity="0.8"/><text x="608" y="255" text-anchor="start" class="n">2.5 s</text><text x="36" y="279" text-anchor="start" class="lbl">load from shared storage</text><text x="210" y="279" text-anchor="start" class="mut" style="font-size: 9.5px;">10.7 GB at 50 GB/s</text><rect x="380" y="272" width="18.5" height="14" rx="2" fill="rgb(255,162,0)" opacity="0.8"/><text x="406.48" y="279" text-anchor="start" class="n">0.21 s</text><text x="36" y="303" text-anchor="start" class="lbl">load from CPU DRAM</text><text x="210" y="303" text-anchor="start" class="mut" style="font-size: 9.5px;">2.7 GB per GPU at ~55 GB/s</text><rect x="380" y="296" width="4.4" height="14" rx="2" fill="rgb(0,214,162)" opacity="0.8"/><text x="392.4" y="303" text-anchor="start" class="n">0.05 s</text><text x="340" y="346" text-anchor="middle" class="lbl">Offloading turns an evicted prefix from “recompute it” into “copy it back”.</text>
<text x="340" y="362" text-anchor="middle" class="mut" style="font-size: 9.5px;">Back-of-the-envelope bandwidth and FLOP estimates; real numbers vary by hardware and connector.</text>
</svg>
