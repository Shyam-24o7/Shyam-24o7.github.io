(170,130,255)" stroke-width="1" /><circle cx="34" cy="234" r="10" fill="rgba(255,162,0,0.2)" stroke="rgb(255,162,0)"/><text x="34" y="234" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">1</text><text x="52" y="228" text-anchor="start" class="h">priority</text><text x="52" y="244" text-anchor="start" class="mut">pick the highest band with work</text><circle cx="250" cy="234" r="10" fill="rgba(255,162,0,0.2)" stroke="rgb(255,162,0)"/><text x="250" y="234" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">2</text><text x="268" y="228" text-anchor="start" class="h">fairness</text><text x="268" y="244" text-anchor="start" class="mut">round robin across tenants in it</text><circle cx="466" cy="234" r="10" fill="rgba(255,162,0,0.2)" stroke="rgb(255,162,0)"/><text x="466" y="234" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">3</text><text x="484" y="228" text-anchor="start" class="h">ordering</text><text x="484" y="244" text-anchor="start" class="mut">FIFO or SLO-aware inside a tenant</text><rect x="20" y="256" width="640" height="26" rx="3" fill="rgba(255,110,110,0.08)" stroke="rgba(255,110,110,0.6)" stroke-width="1" /><text x="340" y="269" text-anchor="middle" class="mut" style="fill: rgb(255,110,110);">saturation detector: dispatch only while the pool has room; otherwise hold the request here</text><text x="340" y="302" text-anchor="middle" class="lbl">A request held at the gateway can still go to the best pod later. One queued inside a pod cannot.</text>
