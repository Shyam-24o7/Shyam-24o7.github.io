<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">2:4 structured sparsity: two of every four weights are zero, by construction</text>
<text x="140" y="66" text-anchor="end" class="lbl">dense weights</text><rect x="150" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="176" y="66" text-anchor="middle" class="n">0.8</text><rect x="206" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="232" y="66" text-anchor="middle" class="n">−0.1</text><rect x="262" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="288" y="66" text-anchor="middle" class="n">0.3</text><rect x="318" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="344" y="66" text-anchor="middle" class="n">1.2</text><rect x="390" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="416" y="66" text-anchor="middle" class="n">−0.05</text><rect x="446" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="472" y="66" text-anchor="middle" class="n">0.9</text><rect x="502" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="528" y="66" text-anchor="middle" class="n">−0.7</text><rect x="558" y="52" width="52" height="28" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="584" y="66" text-anchor="middle" class="n">0.02</text>
<text x="140" y="112" text-anchor="end" class="lbl">after 2:4 pruning</text><rect x="150" y="98" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="176" y="112" text-anchor="middle" class="n">0.8</text><rect x="206" y="98" width="52" height="28" rx="2" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="0.9" /><text x="232" y="112" text-anchor="middle" class="mut">0</text><rect x="262" y="98" width="52" height="28" rx="2" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="0.9" /><text x="288" y="112" text-anchor="middle" class="mut">0</text><rect x="318" y="98" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="344" y="112" text-anchor="middle" class="n">1.2</text><rect x="390" y="98" width="52" height="28" rx="2" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="0.9" /><text x="416" y="112" text-anchor="middle" class="mut">0</text><rect x="446" y="98" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="472" y="112" text-anchor="middle" class="n">0.9</text><rect x="502" y="98" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="528" y="112" text-anchor="middle" class="n">−0.7</text><rect x="558" y="98" width="52" height="28" rx="2" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="0.9" /><text x="584" y="112" text-anchor="middle" class="mut">0</text>
<text x="260" y="140" text-anchor="middle" class="mut">group of 4: keep the 2 largest</text><text x="500" y="140" text-anchor="middle" class="mut">group of 4: keep the 2 largest</text>
<text x="140" y="176" text-anchor="end" class="lbl">stored values</text><rect x="150" y="162" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="176" y="176" text-anchor="middle" class="n">0.8</text><rect x="206" y="162" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="232" y="176" text-anchor="middle" class="n">1.2</text><rect x="262" y="162" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="288" y="176" text-anchor="middle" class="n">0.9</text><rect x="318" y="162" width="52" height="28" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="344" y="176" text-anchor="middle" class="n">−0.7</text>
<text x="140" y="212" text-anchor="end" class="lbl">metadata</text><rect x="150" y="198" width="52" height="28" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="176" y="212" text-anchor="middle" class="n">idx 0</text><rect x="206" y="198" width="52" height="28" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="232" y="212" text-anchor="middle" class="n">idx 3</text><rect x="262" y="198" width="52" height="28" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="288" y="212" text-anchor="middle" class="n">idx 1</text><rect x="318" y="198" width="52" height="28" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="344" y="212" text-anchor="middle" class="n">idx 2</text><text x="390" y="194" text-anchor="start" class="mut">half the values, plus 2 bits each</text><text x="390" y="208" text-anchor="start" class="mut">saying where they came from</text>
<text x="340" y="246" text-anchor="middle" class="mut">Sparse tensor cores (Ampere and newer) skip the zeros: up to 2× the math throughput for this exact pattern.</text>
</svg>
