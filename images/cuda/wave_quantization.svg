<!-- Right grid -->
<text x="402" y="100" text-anchor="end" class="mut">wave 1</text>
<text x="402" y="144" text-anchor="end" class="mut">wave 2</text>
<rect x="410" y="82" width="26" height="36" rx="3" class="busy"/><text x="423" y="100" text-anchor="middle" class="bn">B0</text>
<rect x="442" y="82" width="26" height="36" rx="3" class="busy"/><text x="455" y="100" text-anchor="middle" class="bn">B1</text>
<rect x="474" y="82" width="26" height="36" rx="3" class="busy"/><text x="487" y="100" text-anchor="middle" class="bn">B2</text>
<rect x="506" y="82" width="26" height="36" rx="3" class="busy"/><text x="519" y="100" text-anchor="middle" class="bn">B3</text>
<rect x="538" y="82" width="26" height="36" rx="3" class="busy"/><text x="551" y="100" text-anchor="middle" class="bn">B4</text>
<rect x="570" y="82" width="26" height="36" rx="3" class="busy"/><text x="583" y="100" text-anchor="middle" class="bn">B5</text>
<rect x="602" y="82" width="26" height="36" rx="3" class="busy"/><text x="615" y="100" text-anchor="middle" class="bn">B6</text>
<rect x="634" y="82" width="26" height="36" rx="3" class="busy"/><text x="647" y="100" text-anchor="middle" class="bn">B7</text>
<rect x="410" y="126" width="26" height="36" rx="3" class="busy"/><text x="423" y="144" text-anchor="middle" class="bn">B8</text>
<rect x="442" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="474" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="506" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="538" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="570" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="602" y="126" width="26" height="36" rx="3" class="idle"/>
<rect x="634" y="126" width="26" height="36" rx="3" class="idle"/>

<text x="195" y="182" text-anchor="middle" class="mut">every SM busy in both waves</text>
<text x="535" y="182" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 10px;">wave 2: one SM busy, seven idle</text>

<text x="340" y="216" text-anchor="middle" class="lbl">Both take two waves of time, so 9 blocks cost as much as 16. The GPU is only 56% busy.</text>
<text x="340" y="236" text-anchor="middle" class="mut">It matters when blocks are few and heavy (GEMM, attention). Fixes: tile sizes chosen for the SM count, Stream-K.</text>
</svg>
