<svg width="100%" viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .sm { fill: #97a6bd; font-size: 9px; }
  .busy { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.9; }
  .idle { fill: rgb(30,12,15); stroke: rgb(255,110,110); stroke-width: 0.9; stroke-dasharray: 3 3; }
  .bn { fill: rgb(112,244,200); font-size: 9px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Wave quantization on a GPU with 8 SMs (one block per SM at a time)</text>

<text x="195" y="48" text-anchor="middle" style="fill: rgb(0,214,162); font-size: 12px; font-weight: 600;">16 blocks: 2 full waves</text>
<text x="535" y="48" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 12px; font-weight: 600;">9 blocks: still 2 waves</text>

<!-- SM headers -->
<text x="83" y="70" text-anchor="middle" class="sm">SM0</text><text x="115" y="70" text-anchor="middle" class="sm">SM1</text>
<text x="147" y="70" text-anchor="middle" class="sm">SM2</text><text x="179" y="70" text-anchor="middle" class="sm">SM3</text>
<text x="211" y="70" text-anchor="middle" class="sm">SM4</text><text x="243" y="70" text-anchor="middle" class="sm">SM5</text>
<text x="275" y="70" text-anchor="middle" class="sm">SM6</text><text x="307" y="70" text-anchor="middle" class="sm">SM7</text>
<text x="423" y="70" text-anchor="middle" class="sm">SM0</text><text x="455" y="70" text-anchor="middle" class="sm">SM1</text>
<text x="487" y="70" text-anchor="middle" class="sm">SM2</text><text x="519" y="70" text-anchor="middle" class="sm">SM3</text>
<text x="551" y="70" text-anchor="middle" class="sm">SM4</text><text x="583" y="70" text-anchor="middle" class="sm">SM5</text>
<text x="615" y="70" text-anchor="middle" class="sm">SM6</text><text x="647" y="70" text-anchor="middle" class="sm">SM7</text>

<!-- Left grid -->
<text x="62" y="100" text-anchor="end" class="mut">wave 1</text>
<text x="62" y="144" text-anchor="end" class="mut">wave 2</text>
<rect x="70" y="82" width="26" height="36" rx="3" class="busy"/><text x="83" y="100" text-anchor="middle" class="bn">B0</text>
