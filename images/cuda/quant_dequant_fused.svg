<svg width="100%" viewBox="0 0 680 256" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Weight-only INT4: dequantise in registers, never at full width in memory</text>
<rect x="30" y="70" width="150" height="62" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="105" y="88" text-anchor="middle" class="h">HBM</text><text x="105" y="106" text-anchor="middle" class="n">packed INT4 weights</text><text x="105" y="120" text-anchor="middle" class="mut">plus scales</text><line x1="180" y1="101" x2="218.0" y2="101.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="226,101 218.0,96.5 218.0,105.5" fill="rgba(200,210,230,0.55)"/><rect x="230" y="70" width="190" height="62" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="325" y="88" text-anchor="middle" class="h">registers</text><text x="325" y="106" text-anchor="middle" class="n">unpack 4-bit → FP16,</text><text x="325" y="120" text-anchor="middle" class="n">multiply by the scale</text><line x1="420" y1="101" x2="458.0" y2="101.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="466,101 458.0,96.5 458.0,105.5" fill="rgba(200,210,230,0.55)"/><rect x="470" y="70" width="180" height="62" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="560" y="88" text-anchor="middle" class="h">tensor core</text><text x="560" y="106" text-anchor="middle" class="n">FP16 × FP16 mma,</text><text x="560" y="120" text-anchor="middle" class="n">FP32 accumulate</text>
<rect x="470" y="160" width="180" height="34" rx="3" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="1" /><text x="560" y="177" text-anchor="middle" class="n">FP16 activations</text><line x1="560" y1="160" x2="560.0" y2="144.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="560,136 555.5,144.0 564.5,144.0" fill="rgba(200,210,230,0.55)"/>
<path d="M300 132 Q 300 186 105 186 L105 140" stroke="rgba(255,110,110,0.7)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><line x1="196" y1="178" x2="212" y2="194" stroke="rgb(255,110,110)" stroke-width="2"/><line x1="212" y1="178" x2="196" y2="194" stroke="rgb(255,110,110)" stroke-width="2"/><text x="204" y="208" text-anchor="middle" class="mut" style="fill: rgb(255,110,110);">never written back at FP16</text>
<text x="340" y="236" text-anchor="middle" class="mut">Each weight costs 0.5 bytes of memory traffic instead of 2. Kernels like Marlin turn that into close to 4× at small batch.</text>
</svg>
