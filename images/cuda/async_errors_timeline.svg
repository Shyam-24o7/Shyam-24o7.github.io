<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .t { fill: #e8f0ff; font-size: 10px; }
  .arrow { stroke: rgba(255,110,110,0.7); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Asynchronous launches: the error happens here, gets reported there</text>

<text x="70" y="70" text-anchor="end" class="lbl">CPU</text>
<rect x="80" y="56" width="70" height="28" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="115" y="70" text-anchor="middle" class="t">launch</text>
<rect x="150" y="56" width="210" height="28" rx="3" fill="#161826" stroke="rgba(200,210,230,0.35)"/><text x="255" y="70" text-anchor="middle" class="t">other host code (unaware)</text>
<rect x="360" y="56" width="150" height="28" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)"/><text x="435" y="70" text-anchor="middle" class="t">cudaMemcpy: error!</text>
<text x="590" y="70" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 10px;">reported here</text>

<text x="70" y="140" text-anchor="end" class="lbl">GPU</text>
<rect x="160" y="126" width="200" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="220" y="140" text-anchor="middle" class="t">kernel running</text>
<line x1="280" y1="128" x2="296" y2="152" stroke="rgb(255,110,110)" stroke-width="2"/><line x1="296" y1="128" x2="280" y2="152" stroke="rgb(255,110,110)" stroke-width="2"/>
<text x="288" y="168" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 10px;">illegal address happens here</text>

<path d="M115 84 L115 104 L170 104 L170 122" stroke="rgba(48,148,255,0.6)" stroke-width="1.1" fill="none"/>
<polygon points="165,120 170,126 175,120" fill="rgba(48,148,255,0.6)"/>
<path d="M298 132 Q 380 110 420 88" class="arrow"/><polygon points="414,88 423,85 420,94" fill="rgba(255,110,110,0.7)"/>

<line x1="80" y1="190" x2="640" y2="190" stroke="rgba(222,220,209,0.45)" stroke-width="1"/>
<polygon points="636,185 644,190 636,195" fill="rgba(222,220,209,0.45)"/>
<text x="640" y="202" text-anchor="end" class="mut">time</text>
<text x="340" y="220" text-anchor="middle" class="mut">Launch errors appear immediately in cudaGetLastError(). Execution errors wait for the next call that synchronises.</text>
</svg>
