<svg width="100%" viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .h2d { fill: rgb(58,38,5); stroke: rgb(255,162,0); stroke-width: 0.9; }
  .k { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.9; }
  .d2h { fill: rgb(40,22,64); stroke: rgb(170,130,255); stroke-width: 0.9; }
  .t { fill: #e8f0ff; font-size: 9.5px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Streams: split the work into chunks and overlap copies with compute</text>

<text x="20" y="48" class="lbl" style="fill: rgb(255,110,110); font-weight: 600;">One stream: everything in order</text>
<text x="92" y="72" text-anchor="end" class="mut">stream 0</text>
<rect x="100" y="60" width="160" height="24" rx="2" class="h2d"/><text x="180" y="72" text-anchor="middle" class="t">copy in (all)</text>
<rect x="260" y="60" width="120" height="24" rx="2" class="k"/><text x="320" y="72" text-anchor="middle" class="t">kernel (all)</text>
<rect x="380" y="60" width="160" height="24" rx="2" class="d2h"/><text x="460" y="72" text-anchor="middle" class="t">copy out (all)</text>
<line x1="540" y1="54" x2="540" y2="198" stroke="rgba(255,110,110,0.6)" stroke-width="1" stroke-dasharray="4 3"/>

<text x="20" y="108" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">Three streams, three chunks</text>
<text x="92" y="132" text-anchor="end" class="mut">stream 1</text>
<rect x="100" y="120" width="53" height="22" rx="2" class="h2d"/><rect x="153" y="120" width="40" height="22" rx="2" class="k"/><rect x="193" y="120" width="53" height="22" rx="2" class="d2h"/>
<text x="92" y="160" text-anchor="end" class="mut">stream 2</text>
<rect x="153" y="148" width="53" height="22" rx="2" class="h2d"/><rect x="206" y="148" width="40" height="22" rx="2" class="k"/><rect x="246" y="148" width="53" height="22" rx="2" class="d2h"/>
<text x="92" y="188" text-anchor="end" class="mut">stream 3</text>
<rect x="206" y="176" width="53" height="22" rx="2" class="h2d"/><rect x="259" y="176" width="40" height="22" rx="2" class="k"/><rect x="299" y="176" width="53" height="22" rx="2" class="d2h"/>
<line x1="352" y1="114" x2="352" y2="198" stroke="rgba(0,214,162,0.7)" stroke-width="1" stroke-dasharray="4 3"/>

<line x1="100" y1="206" x2="640" y2="206" stroke="rgba(222,220,209,0.45)" stroke-width="1"/>
<polygon points="636,201 644,206 636,211" fill="rgba(222,220,209,0.45)"/>
<text x="640" y="218" text-anchor="end" class="mut">time</text>

<rect x="140" y="230" width="10" height="10" class="h2d"/><text x="156" y="235" class="mut">copy host → device</text>
<rect x="290" y="230" width="10" height="10" class="k"/><text x="306" y="235" class="mut">kernel</text>
<rect x="370" y="230" width="10" height="10" class="d2h"/><text x="386" y="235" class="mut">copy device → host</text>
<text x="340" y="252" text-anchor="middle" class="mut">Needs pinned host memory. Copies in the same direction still take turns on their copy engine.</text>
</svg>
