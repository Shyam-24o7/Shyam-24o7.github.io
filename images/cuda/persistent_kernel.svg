<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Persistent kernels: launch one block per SM and let it loop over the work</text>
<text x="20" y="46" text-anchor="start" class="lbl" style="fill: rgb(255,110,110); font-weight: 600;">Ordinary launch: 12 tiles, 12 blocks, 3 waves on 4 SMs</text>
<text x="100" y="67" text-anchor="end" class="mut">SM0</text><rect x="110" y="58" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="58" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="67" text-anchor="middle" class="n" style="font-size: 9px;">T0</text><rect x="174" y="58" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="186" y="58" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="209" y="67" text-anchor="middle" class="n" style="font-size: 9px;">T4</text><rect x="238" y="58" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="250" y="58" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="273" y="67" text-anchor="middle" class="n" style="font-size: 9px;">T8</text><text x="100" y="91" text-anchor="end" class="mut">SM1</text><rect x="110" y="82" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="82" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="91" text-anchor="middle" class="n" style="font-size: 9px;">T1</text><rect x="174" y="82" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="186" y="82" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="209" y="91" text-anchor="middle" class="n" style="font-size: 9px;">T5</text><rect x="238" y="82" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="250" y="82" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="273" y="91" text-anchor="middle" class="n" style="font-size: 9px;">T9</text><text x="100" y="115" text-anchor="end" class="mut">SM2</text><rect x="110" y="106" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="106" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="115" text-anchor="middle" class="n" style="font-size: 9px;">T2</text><rect x="174" y="106" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="186" y="106" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="209" y="115" text-anchor="middle" class="n" style="font-size: 9px;">T6</text><rect x="238" y="106" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="250" y="106" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="273" y="115" text-anchor="middle" class="n" style="font-size: 9px;">T10</text><text x="100" y="139" text-anchor="end" class="mut">SM3</text><rect x="110" y="130" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="130" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="139" text-anchor="middle" class="n" style="font-size: 9px;">T3</text><rect x="174" y="130" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="186" y="130" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="209" y="139" text-anchor="middle" class="n" style="font-size: 9px;">T7</text><rect x="238" y="130" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="250" y="130" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="273" y="139" text-anchor="middle" class="n" style="font-size: 9px;">T11</text><text x="318" y="92" text-anchor="start" class="mut">every block pays its own setup</text><text x="318" y="106" text-anchor="start" class="mut">(grey) and ends with a cold start</text>
<text x="20" y="170" text-anchor="start" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">Persistent: 4 blocks, each pulls the next tile from a queue</text>
<text x="100" y="191" text-anchor="end" class="mut">SM0</text><rect x="110" y="182" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="182" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="191" text-anchor="middle" class="n" style="font-size: 9px;">T0</text><rect x="170" y="182" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="193" y="191" text-anchor="middle" class="n" style="font-size: 9px;">T4</text><rect x="218" y="182" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="241" y="191" text-anchor="middle" class="n" style="font-size: 9px;">T8</text><text x="100" y="215" text-anchor="end" class="mut">SM1</text><rect x="110" y="206" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="206" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="215" text-anchor="middle" class="n" style="font-size: 9px;">T1</text><rect x="170" y="206" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="193" y="215" text-anchor="middle" class="n" style="font-size: 9px;">T5</text><rect x="218" y="206" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="241" y="215" text-anchor="middle" class="n" style="font-size: 9px;">T9</text><text x="100" y="239" text-anchor="end" class="mut">SM2</text><rect x="110" y="230" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="230" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="239" text-anchor="middle" class="n" style="font-size: 9px;">T2</text><rect x="170" y="230" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="193" y="239" text-anchor="middle" class="n" style="font-size: 9px;">T6</text><rect x="218" y="230" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="241" y="239" text-anchor="middle" class="n" style="font-size: 9px;">T10</text><text x="100" y="263" text-anchor="end" class="mut">SM3</text><rect x="110" y="254" width="10" height="18" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="122" y="254" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="145" y="263" text-anchor="middle" class="n" style="font-size: 9px;">T3</text><rect x="170" y="254" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="193" y="263" text-anchor="middle" class="n" style="font-size: 9px;">T7</text><rect x="218" y="254" width="46" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="241" y="263" text-anchor="middle" class="n" style="font-size: 9px;">T11</text><text x="290" y="208" text-anchor="start" class="mut">setup once, then tile after tile;</text><text x="290" y="222" text-anchor="start" class="mut">the next tile's loads can overlap</text><text x="290" y="236" text-anchor="start" class="mut">the current tile's epilogue</text>
<text x="340" y="290" text-anchor="middle" class="mut">No wave quantization either: blocks keep taking work until the queue is empty.</text>
</svg>
