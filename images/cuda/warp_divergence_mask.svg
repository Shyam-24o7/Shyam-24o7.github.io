<svg width="100%" viewBox="0 0 680 278" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .all { fill: rgb(10,34,64); stroke: rgb(48,148,255); stroke-width: 0.9; }
  .a { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.9; }
  .b { fill: rgb(58,38,5); stroke: rgb(255,162,0); stroke-width: 0.9; }
  .off { fill: #12131c; stroke: rgba(112,130,158,0.6); stroke-width: 0.8; stroke-dasharray: 3 2; }
  .cell { font-size: 9px; fill: #e8f0ff; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Divergence: a warp can only issue one path at a time</text>

<text x="198" y="48" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 12px; font-weight: 600;">if (lane % 2 == 0): every warp splits</text>
<text x="520" y="48" text-anchor="middle" style="fill: rgb(0,214,162); font-size: 12px; font-weight: 600;">if (warp % 2 == 0): warps agree</text>

<!-- left panel: 8 lanes standing for 32 -->
<text x="72" y="83" text-anchor="end" class="mut">branch</text>
<rect x="80" y="70" width="26" height="26" rx="3" class="all"/><rect x="110" y="70" width="26" height="26" rx="3" class="all"/>
<rect x="140" y="70" width="26" height="26" rx="3" class="all"/><rect x="170" y="70" width="26" height="26" rx="3" class="all"/>
<rect x="200" y="70" width="26" height="26" rx="3" class="all"/><rect x="230" y="70" width="26" height="26" rx="3" class="all"/>
<rect x="260" y="70" width="26" height="26" rx="3" class="all"/><rect x="290" y="70" width="26" height="26" rx="3" class="all"/>

<text x="72" y="119" text-anchor="end" class="mut">path A</text>
<rect x="80" y="106" width="26" height="26" rx="3" class="a"/><text x="93" y="119" text-anchor="middle" class="cell">A</text>
<rect x="110" y="106" width="26" height="26" rx="3" class="off"/>
<rect x="140" y="106" width="26" height="26" rx="3" class="a"/><text x="153" y="119" text-anchor="middle" class="cell">A</text>
<rect x="170" y="106" width="26" height="26" rx="3" class="off"/>
<rect x="200" y="106" width="26" height="26" rx="3" class="a"/><text x="213" y="119" text-anchor="middle" class="cell">A</text>
<rect x="230" y="106" width="26" height="26" rx="3" class="off"/>
<rect x="260" y="106" width="26" height="26" rx="3" class="a"/><text x="273" y="119" text-anchor="middle" class="cell">A</text>
<rect x="290" y="106" width="26" height="26" rx="3" class="off"/>

<text x="72" y="155" text-anchor="end" class="mut">path B</text>
<rect x="80" y="142" width="26" height="26" rx="3" class="off"/>
<rect x="110" y="142" width="26" height="26" rx="3" class="b"/><text x="123" y="155" text-anchor="middle" class="cell">B</text>
<rect x="140" y="142" width="26" height="26" rx="3" class="off"/>
<rect x="170" y="142" width="26" height="26" rx="3" class="b"/><text x="183" y="155" text-anchor="middle" class="cell">B</text>
<rect x="200" y="142" width="26" height="26" rx="3" class="off"/>
<rect x="230" y="142" width="26" height="26" rx="3" class="b"/><text x="243" y="155" text-anchor="middle" class="cell">B</text>
<rect x="260" y="142" width="26" height="26" rx="3" class="off"/>
<rect x="290" y="142" width="26" height="26" rx="3" class="b"/><text x="303" y="155" text-anchor="middle" class="cell">B</text>

<text x="72" y="191" text-anchor="end" class="mut">after</text>
<rect x="80" y="178" width="26" height="26" rx="3" class="all"/><rect x="110" y="178" width="26" height="26" rx="3" class="all"/>
<rect x="140" y="178" width="26" height="26" rx="3" class="all"/><rect x="170" y="178" width="26" height="26" rx="3" class="all"/>
<rect x="200" y="178" width="26" height="26" rx="3" class="all"/><rect x="230" y="178" width="26" height="26" rx="3" class="all"/>
<rect x="260" y="178" width="26" height="26" rx="3" class="all"/><rect x="290" y="178" width="26" height="26" rx="3" class="all"/>
<text x="198" y="218" text-anchor="middle" class="mut">time = A + B, and half the lanes idle in each</text>

<line x1="350" y1="44" x2="350" y2="226" stroke="rgba(222,220,209,0.2)" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- right panel -->
<text x="410" y="101" text-anchor="end" class="mut">warp 0</text>
<rect x="418" y="88" width="26" height="26" rx="3" class="a"/><rect x="448" y="88" width="26" height="26" rx="3" class="a"/>
<rect x="478" y="88" width="26" height="26" rx="3" class="a"/><rect x="508" y="88" width="26" height="26" rx="3" class="a"/>
<rect x="538" y="88" width="26" height="26" rx="3" class="a"/><rect x="568" y="88" width="26" height="26" rx="3" class="a"/>
<rect x="598" y="88" width="26" height="26" rx="3" class="a"/><rect x="628" y="88" width="26" height="26" rx="3" class="a"/>
<text x="536" y="126" text-anchor="middle" class="mut">runs only path A</text>
<text x="410" y="165" text-anchor="end" class="mut">warp 1</text>
<rect x="418" y="152" width="26" height="26" rx="3" class="b"/><rect x="448" y="152" width="26" height="26" rx="3" class="b"/>
<rect x="478" y="152" width="26" height="26" rx="3" class="b"/><rect x="508" y="152" width="26" height="26" rx="3" class="b"/>
<rect x="538" y="152" width="26" height="26" rx="3" class="b"/><rect x="568" y="152" width="26" height="26" rx="3" class="b"/>
<rect x="598" y="152" width="26" height="26" rx="3" class="b"/><rect x="628" y="152" width="26" height="26" rx="3" class="b"/>
<text x="536" y="190" text-anchor="middle" class="mut">runs only path B</text>
<text x="520" y="218" text-anchor="middle" class="mut">same work, no idle lanes, no extra cost</text>

<text x="340" y="246" text-anchor="middle" class="lbl">Both conditions send half the threads each way. Only alignment with warps differs.</text>
<text x="340" y="263" text-anchor="middle" class="mut">Eight lanes shown for 32. Dashed cells are masked off: present, but doing nothing.</text>
</svg>
