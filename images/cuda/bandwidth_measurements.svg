<svg width="100%" viewBox="0 0 680 312" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .val { fill: #c8d2e6; font-size: 10.5px; }
  .grid { stroke: rgba(222,220,209,0.12); stroke-width: 0.5; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One kernel, one GPU, five different answers</text>
<text x="340" y="40" text-anchor="middle" class="mut">Vector add on an RTX 4060 Laptop GPU: reported bandwidth, depending on how it was measured</text>

<!-- grid -->
<line x1="244" y1="60" x2="244" y2="256" class="grid"/>
<line x1="340" y1="60" x2="340" y2="256" class="grid"/>
<line x1="436" y1="60" x2="436" y2="256" class="grid"/>
<line x1="532" y1="60" x2="532" y2="256" class="grid"/>
<line x1="628" y1="60" x2="628" y2="256" class="grid"/>
<line x1="244" y1="256" x2="628" y2="256" stroke="rgba(222,220,209,0.45)" stroke-width="1"/>
<text x="244" y="268" text-anchor="middle" class="mut">0</text>
<text x="340" y="268" text-anchor="middle" class="mut">200</text>
<text x="436" y="268" text-anchor="middle" class="mut">400</text>
<text x="532" y="268" text-anchor="middle" class="mut">600</text>
<text x="628" y="268" text-anchor="middle" class="mut">800 GB/s</text>

<!-- rows -->
<text x="236" y="78" text-anchor="end" class="lbl">4 MB arrays, L2 still warm</text>
<rect x="244" y="66" width="379.7" height="24" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9"/>
<text x="616" y="78" text-anchor="end" style="fill: rgb(255,200,110); font-size: 10.5px;">658 to 791 GB/s (impossible for DRAM)</text>

<text x="236" y="118" text-anchor="end" class="lbl">4 MB arrays, first timed launch</text>
<rect x="244" y="106" width="71" height="24" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9"/>
<text x="380" y="118" text-anchor="start" class="val">132 to 148 GB/s</text>

<text x="236" y="158" text-anchor="end" class="lbl">4 MB arrays, L2 flushed first</text>
<rect x="244" y="146" width="79.7" height="24" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9"/>
<text x="380" y="158" text-anchor="start" class="val">166 GB/s</text>

<text x="236" y="198" text-anchor="end" class="lbl">256 MB arrays (honest DRAM)</text>
<rect x="244" y="186" width="111.8" height="24" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9"/>
<text x="380" y="198" text-anchor="start" style="fill: rgb(0,214,162); font-size: 10.5px; font-weight: 600;">230 to 234 GB/s (91% of peak)</text>

<text x="236" y="238" text-anchor="end" class="lbl">cudaMemcpy, device to device</text>
<rect x="244" y="226" width="104.6" height="24" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9"/>
<text x="380" y="238" text-anchor="start" class="val">218 GB/s</text>

<!-- peak line -->
<line x1="366.9" y1="58" x2="366.9" y2="256" stroke="rgb(255,110,110)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="372" y="56" text-anchor="start" style="fill: rgb(255,110,110); font-size: 10.5px;">DRAM peak: 256 GB/s</text>

<text x="340" y="294" text-anchor="middle" class="mut">Only the 256 MB run measures DRAM. The warm-L2 number is three times faster than the memory can physically go.</text>
</svg>
