<svg width="100%" viewBox="0 0 680 312" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #161826; stroke: rgba(200,210,230,0.5); stroke-width: 1; }
  .n4 { fill: rgb(10,34,64); stroke: rgb(48,148,255); stroke-width: 1; }
  .n2 { fill: rgb(58,38,5); stroke: rgb(255,162,0); stroke-width: 1; }
  .n1 { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 1.2; }
  .v { fill: #e8f0ff; font-size: 11px; }
  .x4 { stroke: rgba(48,148,255,0.55); stroke-width: 1; }
  .x2 { stroke: rgba(255,162,0,0.55); stroke-width: 1; }
  .x1 { stroke: rgba(0,214,162,0.6); stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Warp reduction with __shfl_xor_sync: every lane ends with the sum</text>

<text x="140" y="46" text-anchor="middle" class="mut">lane 0</text><text x="204" y="46" text-anchor="middle" class="mut">lane 1</text>
<text x="268" y="46" text-anchor="middle" class="mut">lane 2</text><text x="332" y="46" text-anchor="middle" class="mut">lane 3</text>
<text x="396" y="46" text-anchor="middle" class="mut">lane 4</text><text x="460" y="46" text-anchor="middle" class="mut">lane 5</text>
<text x="524" y="46" text-anchor="middle" class="mut">lane 6</text><text x="588" y="46" text-anchor="middle" class="mut">lane 7</text>

<!-- xor 4 crossings (row 74 -> 134) -->
<g class="x4">
<line x1="140" y1="88" x2="396" y2="120"/><line x1="396" y1="88" x2="140" y2="120"/>
<line x1="204" y1="88" x2="460" y2="120"/><line x1="460" y1="88" x2="204" y2="120"/>
<line x1="268" y1="88" x2="524" y2="120"/><line x1="524" y1="88" x2="268" y2="120"/>
<line x1="332" y1="88" x2="588" y2="120"/><line x1="588" y1="88" x2="332" y2="120"/>
</g>
<!-- xor 2 crossings (134 -> 194) -->
<g class="x2">
<line x1="140" y1="148" x2="268" y2="180"/><line x1="268" y1="148" x2="140" y2="180"/>
<line x1="204" y1="148" x2="332" y2="180"/><line x1="332" y1="148" x2="204" y2="180"/>
<line x1="396" y1="148" x2="524" y2="180"/><line x1="524" y1="148" x2="396" y2="180"/>
<line x1="460" y1="148" x2="588" y2="180"/><line x1="588" y1="148" x2="460" y2="180"/>
</g>
<!-- xor 1 crossings (194 -> 254) -->
<g class="x1">
<line x1="140" y1="208" x2="204" y2="240"/><line x1="204" y1="208" x2="140" y2="240"/>
<line x1="268" y1="208" x2="332" y2="240"/><line x1="332" y1="208" x2="268" y2="240"/>
<line x1="396" y1="208" x2="460" y2="240"/><line x1="460" y1="208" x2="396" y2="240"/>
<line x1="524" y1="208" x2="588" y2="240"/><line x1="588" y1="208" x2="524" y2="240"/>
</g>

<text x="92" y="74" text-anchor="end" class="lbl">values</text>
<circle cx="140" cy="74" r="14" class="n"/><text x="140" y="74" text-anchor="middle" class="v">3</text>
<circle cx="204" cy="74" r="14" class="n"/><text x="204" y="74" text-anchor="middle" class="v">1</text>
<circle cx="268" cy="74" r="14" class="n"/><text x="268" y="74" text-anchor="middle" class="v">4</text>
<circle cx="332" cy="74" r="14" class="n"/><text x="332" y="74" text-anchor="middle" class="v">1</text>
<circle cx="396" cy="74" r="14" class="n"/><text x="396" y="74" text-anchor="middle" class="v">5</text>
<circle cx="460" cy="74" r="14" class="n"/><text x="460" y="74" text-anchor="middle" class="v">9</text>
<circle cx="524" cy="74" r="14" class="n"/><text x="524" y="74" text-anchor="middle" class="v">2</text>
<circle cx="588" cy="74" r="14" class="n"/><text x="588" y="74" text-anchor="middle" class="v">6</text>

<text x="92" y="134" text-anchor="end" style="fill: rgb(48,148,255); font-size: 11px;">xor 4</text>
<circle cx="140" cy="134" r="14" class="n4"/><text x="140" y="134" text-anchor="middle" class="v">8</text>
<circle cx="204" cy="134" r="14" class="n4"/><text x="204" y="134" text-anchor="middle" class="v">10</text>
<circle cx="268" cy="134" r="14" class="n4"/><text x="268" y="134" text-anchor="middle" class="v">6</text>
<circle cx="332" cy="134" r="14" class="n4"/><text x="332" y="134" text-anchor="middle" class="v">7</text>
<circle cx="396" cy="134" r="14" class="n4"/><text x="396" y="134" text-anchor="middle" class="v">8</text>
<circle cx="460" cy="134" r="14" class="n4"/><text x="460" y="134" text-anchor="middle" class="v">10</text>
<circle cx="524" cy="134" r="14" class="n4"/><text x="524" y="134" text-anchor="middle" class="v">6</text>
<circle cx="588" cy="134" r="14" class="n4"/><text x="588" y="134" text-anchor="middle" class="v">7</text>

<text x="92" y="194" text-anchor="end" style="fill: rgb(255,162,0); font-size: 11px;">xor 2</text>
<circle cx="140" cy="194" r="14" class="n2"/><text x="140" y="194" text-anchor="middle" class="v">14</text>
<circle cx="204" cy="194" r="14" class="n2"/><text x="204" y="194" text-anchor="middle" class="v">17</text>
<circle cx="268" cy="194" r="14" class="n2"/><text x="268" y="194" text-anchor="middle" class="v">14</text>
<circle cx="332" cy="194" r="14" class="n2"/><text x="332" y="194" text-anchor="middle" class="v">17</text>
<circle cx="396" cy="194" r="14" class="n2"/><text x="396" y="194" text-anchor="middle" class="v">14</text>
<circle cx="460" cy="194" r="14" class="n2"/><text x="460" y="194" text-anchor="middle" class="v">17</text>
<circle cx="524" cy="194" r="14" class="n2"/><text x="524" y="194" text-anchor="middle" class="v">14</text>
<circle cx="588" cy="194" r="14" class="n2"/><text x="588" y="194" text-anchor="middle" class="v">17</text>

<text x="92" y="254" text-anchor="end" style="fill: rgb(0,214,162); font-size: 11px;">xor 1</text>
<circle cx="140" cy="254" r="14" class="n1"/><text x="140" y="254" text-anchor="middle" class="v">31</text>
<circle cx="204" cy="254" r="14" class="n1"/><text x="204" y="254" text-anchor="middle" class="v">31</text>
<circle cx="268" cy="254" r="14" class="n1"/><text x="268" y="254" text-anchor="middle" class="v">31</text>
<circle cx="332" cy="254" r="14" class="n1"/><text x="332" y="254" text-anchor="middle" class="v">31</text>
<circle cx="396" cy="254" r="14" class="n1"/><text x="396" y="254" text-anchor="middle" class="v">31</text>
<circle cx="460" cy="254" r="14" class="n1"/><text x="460" y="254" text-anchor="middle" class="v">31</text>
<circle cx="524" cy="254" r="14" class="n1"/><text x="524" y="254" text-anchor="middle" class="v">31</text>
<circle cx="588" cy="254" r="14" class="n1"/><text x="588" y="254" text-anchor="middle" class="v">31</text>

<text x="340" y="292" text-anchor="middle" class="mut">Each step, every lane adds the value from lane (its id XOR m). Eight lanes need 3 steps; a real warp of 32 needs 5. No shared memory, no barrier.</text>
</svg>
