<svg width="100%" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #70829e; font-size: 10.5px; }
  .box { stroke-width: 1.2; }
  .pipe { fill: none; stroke: rgba(200,210,230,0.35); stroke-width: 1.2; }
  .ok { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.9; }
  .few { fill: rgb(60,18,22); stroke: rgb(255,110,110); stroke-width: 0.9; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="24" text-anchor="middle" class="title">Little's law: memory is only busy if enough bytes are in flight</text>

<!-- Row 1: full pipe -->
<text x="20" y="52" text-anchor="start" style="fill: rgb(0,214,162); font-size: 12px; font-weight: 600;">Enough requests in flight: the full bandwidth gets used</text>
<rect x="20" y="64" width="80" height="56" rx="4" class="box" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/>
<text x="60" y="92" text-anchor="middle" class="lbl">SM</text>
<rect x="580" y="64" width="80" height="56" rx="4" class="box" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/>
<text x="620" y="92" text-anchor="middle" class="lbl">DRAM</text>
<rect x="110" y="72" width="460" height="40" rx="20" class="pipe"/>
<rect x="122" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="156" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="190" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="224" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="258" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="292" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="326" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="360" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="394" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="428" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="462" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="496" y="84" width="24" height="16" rx="2" class="ok"/>
<rect x="530" y="84" width="24" height="16" rx="2" class="ok"/>
<text x="340" y="130" text-anchor="middle" class="mut">each request takes ~500 ns to come back, so the pipe must always hold bandwidth × latency bytes</text>

<!-- Row 2: starved pipe -->
<text x="20" y="162" text-anchor="start" style="fill: rgb(255,110,110); font-size: 12px; font-weight: 600;">Too few requests in flight: same latency, most of the bandwidth idle</text>
<rect x="20" y="174" width="80" height="56" rx="4" class="box" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/>
<text x="60" y="202" text-anchor="middle" class="lbl">SM</text>
<rect x="580" y="174" width="80" height="56" rx="4" class="box" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/>
<text x="620" y="202" text-anchor="middle" class="lbl">DRAM</text>
<rect x="110" y="182" width="460" height="40" rx="20" class="pipe"/>
<rect x="122" y="194" width="24" height="16" rx="2" class="few"/>
<rect x="292" y="194" width="24" height="16" rx="2" class="few"/>
<rect x="462" y="194" width="24" height="16" rx="2" class="few"/>
<text x="340" y="240" text-anchor="middle" class="mut">nothing is wrong with the access pattern; there just isn't enough work outstanding</text>

<!-- formula -->
<rect x="70" y="256" width="540" height="24" rx="4" fill="rgba(48,148,255,0.08)" stroke="rgba(48,148,255,0.35)" stroke-width="0.8"/>
<text x="340" y="268" text-anchor="middle" style="fill: #e8f0ff; font-size: 12px;">bytes in flight = bandwidth × latency → A100: 2 TB/s × 500 ns ≈ 1 MB (≈ 9 KB per SM)</text>
</svg>
