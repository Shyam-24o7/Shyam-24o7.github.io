<svg width="100%" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Blackwell moves the accumulators out of the register file</text>
<text x="170" y="48" text-anchor="middle" class="h" style="fill: rgb(170,130,255);">Hopper: wgmma</text><text x="510" y="48" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">Blackwell: tcgen05.mma</text>
<text x="170" y="68" text-anchor="middle" class="mut">128 threads of a warpgroup issue it</text><text x="510" y="68" text-anchor="middle" class="mut">a single thread issues it</text>
<text x="40" y="98" text-anchor="start" class="mut">register file</text><rect x="40" y="108" width="260" height="30" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="40" y="108" width="182" height="30" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="131" y="123" text-anchor="middle" class="n">accumulators</text><text x="261" y="123" text-anchor="middle" class="mut">rest</text><text x="380" y="98" text-anchor="start" class="mut">register file</text><rect x="380" y="108" width="260" height="30" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="510" y="123" text-anchor="middle" class="mut">free for everything else</text>
<rect x="380" y="150" width="260" height="40" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="510" y="164" text-anchor="middle" class="h">Tensor Memory: 256 KB per SM</text><text x="510" y="180" text-anchor="middle" class="n">holds the accumulators</text>
<line x1="340" y1="84" x2="340" y2="200" stroke="rgba(222,220,209,0.2)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="340" y="216" text-anchor="middle" class="lbl">CTA pairs: two SMs cooperate on one larger MMA</text>
<rect x="150" y="228" width="160" height="34" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="230" y="245" text-anchor="middle" class="n">SM A: loads half of B</text><rect x="370" y="228" width="160" height="34" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="450" y="245" text-anchor="middle" class="n">SM B: loads the other half</text><line x1="310" y1="245" x2="370" y2="245" stroke="rgba(0,214,162,0.8)" stroke-width="2" stroke-dasharray="5 3"/><text x="340" y="278" text-anchor="middle" class="mut">Data-centre Blackwell (sm_100). Consumer Blackwell GPUs keep the older mma.sync model.</text>
</svg>
