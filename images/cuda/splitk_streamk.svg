<svg width="100%" viewBox="0 0 680 318" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Stream-K: share out the total work evenly, not whole tiles</text>
<text x="20" y="48" text-anchor="start" class="lbl" style="fill: rgb(255,110,110); font-weight: 600;">Data-parallel: 9 output tiles, one block each, 4 SMs</text>
<text x="102" y="73" text-anchor="end" class="mut">SM0</text><rect x="110" y="62" width="62" height="22" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="141" y="73" text-anchor="middle" class="n">T0</text><rect x="174" y="62" width="62" height="22" rx="2" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="0.9" /><text x="205" y="73" text-anchor="middle" class="n">T4</text><rect x="238" y="62" width="62" height="22" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="269" y="73" text-anchor="middle" class="n">T8</text>
<text x="102" y="99" text-anchor="end" class="mut">SM1</text><rect x="110" y="88" width="62" height="22" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="141" y="99" text-anchor="middle" class="n">T1</text><rect x="174" y="88" width="62" height="22" rx="2" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="0.9" /><text x="205" y="99" text-anchor="middle" class="n">T5</text><rect x="238" y="88" width="62" height="22" rx="2" fill="#1a0e12" stroke="rgba(255,110,110,0.6)" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="102" y="125" text-anchor="end" class="mut">SM2</text><rect x="110" y="114" width="62" height="22" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="141" y="125" text-anchor="middle" class="n">T2</text><rect x="174" y="114" width="62" height="22" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="205" y="125" text-anchor="middle" class="n">T6</text><rect x="238" y="114" width="62" height="22" rx="2" fill="#1a0e12" stroke="rgba(255,110,110,0.6)" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="102" y="151" text-anchor="end" class="mut">SM3</text><rect x="110" y="140" width="62" height="22" rx="2" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="0.9" /><text x="141" y="151" text-anchor="middle" class="n">T3</text><rect x="174" y="140" width="62" height="22" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="205" y="151" text-anchor="middle" class="n">T7</text><rect x="238" y="140" width="62" height="22" rx="2" fill="#1a0e12" stroke="rgba(255,110,110,0.6)" stroke-width="0.9" stroke-dasharray="3 2"/>
<line x1="302" y1="56" x2="302" y2="168" stroke="rgba(255,110,110,0.7)" stroke-dasharray="4 3"/>
<text x="314" y="98" text-anchor="start" class="mut">3 waves; in the last one</text><text x="314" y="112" text-anchor="start" class="mut">three of four SMs sit idle</text>
<text x="20" y="190" text-anchor="start" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">Stream-K: 36 units of work (9 tiles × 4 K-chunks), 9 units per SM</text>
<text x="102" y="215" text-anchor="end" class="mut">SM0</text><rect x="110" y="204" width="62" height="22" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="141" y="215" text-anchor="middle" class="n">T0</text><rect x="174" y="204" width="62" height="22" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="205" y="215" text-anchor="middle" class="n">T1</text><rect x="238" y="204" width="14" height="22" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" />
<text x="102" y="241" text-anchor="end" class="mut">SM1</text><rect x="110" y="230" width="46" height="22" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="133" y="241" text-anchor="middle" class="n">T2</text><rect x="158" y="230" width="62" height="22" rx="2" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="0.9" /><text x="189" y="241" text-anchor="middle" class="n">T3</text><rect x="222" y="230" width="30" height="22" rx="2" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="0.9" /><text x="237" y="241" text-anchor="middle" class="n">T4</text>
<text x="102" y="267" text-anchor="end" class="mut">SM2</text><rect x="110" y="256" width="30" height="22" rx="2" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="0.9" /><text x="125" y="267" text-anchor="middle" class="n">T4</text><rect x="142" y="256" width="62" height="22" rx="2" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="0.9" /><text x="173" y="267" text-anchor="middle" class="n">T5</text><rect x="206" y="256" width="46" height="22" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="229" y="267" text-anchor="middle" class="n">T6</text>
<text x="102" y="293" text-anchor="end" class="mut">SM3</text><rect x="110" y="282" width="14" height="22" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><rect x="126" y="282" width="62" height="22" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="157" y="293" text-anchor="middle" class="n">T7</text><rect x="190" y="282" width="62" height="22" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="221" y="293" text-anchor="middle" class="n">T8</text>
<line x1="254" y1="198" x2="254" y2="310" stroke="rgba(0,214,162,0.8)" stroke-dasharray="4 3"/>
<text x="266" y="236" text-anchor="start" class="mut">every SM finishes at the same moment,</text><text x="266" y="250" text-anchor="start" class="mut">a quarter sooner than above</text>
<text x="266" y="278" text-anchor="start" class="mut">tiles split across SMs (T2, T4, T6) are</text><text x="266" y="292" text-anchor="start" class="mut">finished by adding their partial sums</text>
</svg>
