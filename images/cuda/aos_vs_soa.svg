<svg width="100%" viewBox="0 0 680 252" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .x { fill: rgb(58,38,5); stroke: rgb(255,162,0); stroke-width: 1.1; }
  .o { fill: #161826; stroke: rgba(200,210,230,0.3); stroke-width: 0.7; }
  .xs { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 1.1; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .d { fill: #70829e; font-size: 10px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">The same particles, two layouts: a warp reading only x</text>

<text x="20" y="52" class="lbl" style="fill: rgb(255,162,0); font-weight: 600;">Array of structures: struct { float x, y, z; } p[N]</text>
<g>
<rect x="20" y="64" width="34" height="28" class="x"/><text x="37" y="78" text-anchor="middle" class="n">x0</text>
<rect x="54" y="64" width="34" height="28" class="o"/><text x="71" y="78" text-anchor="middle" class="d">y0</text>
<rect x="88" y="64" width="34" height="28" class="o"/><text x="105" y="78" text-anchor="middle" class="d">z0</text>
<rect x="122" y="64" width="34" height="28" class="x"/><text x="139" y="78" text-anchor="middle" class="n">x1</text>
<rect x="156" y="64" width="34" height="28" class="o"/><text x="173" y="78" text-anchor="middle" class="d">y1</text>
<rect x="190" y="64" width="34" height="28" class="o"/><text x="207" y="78" text-anchor="middle" class="d">z1</text>
<rect x="224" y="64" width="34" height="28" class="x"/><text x="241" y="78" text-anchor="middle" class="n">x2</text>
<rect x="258" y="64" width="34" height="28" class="o"/><text x="275" y="78" text-anchor="middle" class="d">y2</text>
<rect x="292" y="64" width="34" height="28" class="o"/><text x="309" y="78" text-anchor="middle" class="d">z2</text>
<rect x="326" y="64" width="34" height="28" class="x"/><text x="343" y="78" text-anchor="middle" class="n">x3</text>
<rect x="360" y="64" width="34" height="28" class="o"/><text x="377" y="78" text-anchor="middle" class="d">y3</text>
<rect x="394" y="64" width="34" height="28" class="o"/><text x="411" y="78" text-anchor="middle" class="d">z3</text>
<rect x="428" y="64" width="34" height="28" class="x"/><text x="445" y="78" text-anchor="middle" class="n">x4</text>
<rect x="462" y="64" width="34" height="28" class="o"/><text x="479" y="78" text-anchor="middle" class="d">y4</text>
<rect x="496" y="64" width="34" height="28" class="o"/><text x="513" y="78" text-anchor="middle" class="d">z4</text>
<rect x="530" y="64" width="34" height="28" class="x"/><text x="547" y="78" text-anchor="middle" class="n">x5</text>
<rect x="564" y="64" width="34" height="28" class="o"/><text x="581" y="78" text-anchor="middle" class="d">y5</text>
<rect x="598" y="64" width="34" height="28" class="o"/><text x="615" y="78" text-anchor="middle" class="d">z5</text>
<text x="646" y="78" class="d">...</text>
</g>
<text x="20" y="108" class="mut">The x values sit 12 bytes apart. A warp's 32 reads spread over 384 bytes: 12 sectors moved for 4 sectors of data.</text>

<text x="20" y="146" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">Structure of arrays: float x[N], y[N], z[N]</text>
<g>
<rect x="20" y="158" width="34" height="28" class="xs"/><text x="37" y="172" text-anchor="middle" class="n">x0</text>
<rect x="54" y="158" width="34" height="28" class="xs"/><text x="71" y="172" text-anchor="middle" class="n">x1</text>
<rect x="88" y="158" width="34" height="28" class="xs"/><text x="105" y="172" text-anchor="middle" class="n">x2</text>
<rect x="122" y="158" width="34" height="28" class="xs"/><text x="139" y="172" text-anchor="middle" class="n">x3</text>
<rect x="156" y="158" width="34" height="28" class="xs"/><text x="173" y="172" text-anchor="middle" class="n">x4</text>
<rect x="190" y="158" width="34" height="28" class="xs"/><text x="207" y="172" text-anchor="middle" class="n">x5</text>
<rect x="224" y="158" width="34" height="28" class="xs"/><text x="241" y="172" text-anchor="middle" class="n">x6</text>
<rect x="258" y="158" width="34" height="28" class="xs"/><text x="275" y="172" text-anchor="middle" class="n">x7</text>
<text x="300" y="172" class="d">...</text>
<rect x="326" y="158" width="34" height="28" class="o"/><text x="343" y="172" text-anchor="middle" class="d">y0</text>
<rect x="360" y="158" width="34" height="28" class="o"/><text x="377" y="172" text-anchor="middle" class="d">y1</text>
<rect x="394" y="158" width="34" height="28" class="o"/><text x="411" y="172" text-anchor="middle" class="d">y2</text>
<text x="436" y="172" class="d">...</text>
<rect x="462" y="158" width="34" height="28" class="o"/><text x="479" y="172" text-anchor="middle" class="d">z0</text>
<rect x="496" y="158" width="34" height="28" class="o"/><text x="513" y="172" text-anchor="middle" class="d">z1</text>
<rect x="530" y="158" width="34" height="28" class="o"/><text x="547" y="172" text-anchor="middle" class="d">z2</text>
<text x="572" y="172" class="d">...</text>
</g>
<text x="20" y="202" class="mut">The x values are contiguous. The same warp read is 4 sectors, every byte used.</text>

<text x="340" y="234" text-anchor="middle" class="lbl">Same data, same arithmetic. Only the layout changed, and with it a 3× difference in traffic.</text>
</svg>
