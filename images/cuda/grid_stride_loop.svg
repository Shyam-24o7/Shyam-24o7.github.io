<text x="327" y="156" text-anchor="middle" class="lbl">thread 3 handles elements 3, 11 and 19</text>

<text x="340" y="186" text-anchor="middle" class="lbl">for (i = global index; i &lt; n; i += blockDim.x × gridDim.x)</text>
<text x="340" y="207" text-anchor="middle" class="mut">In every pass neighbouring threads touch neighbouring elements, so each pass stays coalesced.</text>
