<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .h { font-size: 12.5px; font-weight: 600; }
  .ch { fill: #70829e; font-size: 9.5px; }
  .t { fill: #c8d2e6; font-size: 10px; }
  .arrow { stroke: rgba(200,210,230,0.5); stroke-width: 1.2; fill: none; }
  .head { fill: rgba(200,210,230,0.5); }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">The route through this post: six parts, twenty-five chapters</text>

<rect x="20" y="44" width="200" height="120" rx="6" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/>
<text x="120" y="62" text-anchor="middle" class="h" style="fill: rgb(48,148,255);">Part 1: Foundations</text>
<text x="120" y="78" text-anchor="middle" class="ch">chapters 1 to 5</text>
<text x="120" y="100" text-anchor="middle" class="t">toolchain and errors, launching,</text>
<text x="120" y="116" text-anchor="middle" class="t">measuring, how a warp runs,</text>
<text x="120" y="132" text-anchor="middle" class="t">the performance model</text>

<rect x="240" y="44" width="200" height="120" rx="6" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/>
<text x="340" y="62" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">Part 2: The Memory System</text>
<text x="340" y="78" text-anchor="middle" class="ch">chapters 6 to 9</text>
<text x="340" y="100" text-anchor="middle" class="t">coalescing, shared memory,</text>
<text x="340" y="116" text-anchor="middle" class="t">bank conflicts, registers,</text>
<text x="340" y="132" text-anchor="middle" class="t">the other memory paths</text>

<rect x="460" y="44" width="200" height="120" rx="6" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/>
<text x="560" y="62" text-anchor="middle" class="h" style="fill: rgb(255,162,0);">Part 3: Cooperation</text>
<text x="560" y="78" text-anchor="middle" class="ch">chapters 10 to 12</text>
<text x="560" y="100" text-anchor="middle" class="t">barriers, atomics, the memory</text>
<text x="560" y="116" text-anchor="middle" class="t">model, warp primitives,</text>
<text x="560" y="132" text-anchor="middle" class="t">the classic parallel patterns</text>

<rect x="20" y="186" width="200" height="120" rx="6" fill="rgb(40,22,64)" stroke="rgb(170,130,255)"/>
<text x="120" y="204" text-anchor="middle" class="h" style="fill: rgb(170,130,255);">Part 4: Arithmetic</text>
<text x="120" y="220" text-anchor="middle" class="ch">chapters 13 to 15</text>
<text x="120" y="242" text-anchor="middle" class="t">instructions and precision,</text>
<text x="120" y="258" text-anchor="middle" class="t">tensor cores and GEMM,</text>
<text x="120" y="274" text-anchor="middle" class="t">async copies and pipelining</text>

<rect x="240" y="186" width="200" height="120" rx="6" fill="rgb(60,18,22)" stroke="rgb(255,110,110)"/>
<text x="340" y="204" text-anchor="middle" class="h" style="fill: rgb(255,110,110);">Part 5: Beyond One Kernel</text>
<text x="340" y="220" text-anchor="middle" class="ch">chapters 16 to 18</text>
<text x="340" y="242" text-anchor="middle" class="t">streams, graphs, many GPUs,</text>
<text x="340" y="258" text-anchor="middle" class="t">profiling and debugging,</text>
<text x="340" y="274" text-anchor="middle" class="t">libraries and abstractions</text>

<rect x="460" y="186" width="200" height="120" rx="6" fill="rgb(6,48,58)" stroke="rgb(80,210,230)"/>
<text x="560" y="204" text-anchor="middle" class="h" style="fill: rgb(80,210,230);">Part 6: ML Kernels, New GPUs</text>
<text x="560" y="220" text-anchor="middle" class="ch">chapters 19 to 25</text>
<text x="560" y="242" text-anchor="middle" class="t">LLM kernels, quantisation,</text>
<text x="560" y="258" text-anchor="middle" class="t">FlashAttention, PyTorch,</text>
<text x="560" y="274" text-anchor="middle" class="t">Hopper and Blackwell</text>

<line x1="220" y1="104" x2="234" y2="104" class="arrow"/><polygon points="232,99 240,104 232,109" class="head"/>
<line x1="440" y1="104" x2="454" y2="104" class="arrow"/><polygon points="452,99 460,104 452,109" class="head"/>
<path d="M560 164 L560 175 L120 175 L120 180" class="arrow"/><polygon points="115,178 120,186 125,178" class="head"/>
<line x1="220" y1="246" x2="234" y2="246" class="arrow"/><polygon points="232,241 240,246 232,251" class="head"/>
<line x1="440" y1="246" x2="454" y2="246" class="arrow"/><polygon points="452,241 460,246 452,251" class="head"/>

<text x="340" y="326" text-anchor="middle" style="fill: #70829e; font-size: 10.5px;">Each part builds on the one before it. Part 6 is where every earlier idea gets used at once.</text>
</svg>
