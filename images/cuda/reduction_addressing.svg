<text x="539" y="202" text-anchor="middle" class="mut">active threads packed at the front</text>
<text x="340" y="236" text-anchor="middle" class="lbl">With 32 lanes per warp, packing the active threads means whole warps retire early,</text>
<text x="340" y="254" text-anchor="middle" class="mut">instead of every warp running half empty. It also gives conflict-free shared-memory addressing.</text>
