<svg width="100%" viewBox="0 0 680 316" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">The CUDA software stack: start at the top, drop down only when you must</text>
<rect x="130" y="42" width="420" height="30" rx="3" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="1" /><text x="146" y="57" text-anchor="start" class="h">PyTorch and torch.compile</text><text x="534" y="57" text-anchor="end" class="mut">the model code most people write</text>
<rect x="130" y="78" width="420" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="146" y="93" text-anchor="start" class="h">cuBLAS, cuDNN, CUB, Thrust</text><text x="534" y="93" text-anchor="end" class="mut">tuned libraries: call these first</text>
<rect x="130" y="114" width="420" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="146" y="129" text-anchor="start" class="h">CUTLASS and CuTe</text><text x="534" y="129" text-anchor="end" class="mut">build a custom or fused GEMM from parts</text>
<rect x="130" y="150" width="420" height="30" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="146" y="165" text-anchor="start" class="h">Triton, Gluon, cuTile</text><text x="534" y="165" text-anchor="end" class="mut">tile-level kernel languages</text>
<rect x="130" y="186" width="420" height="30" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="146" y="201" text-anchor="start" class="h">CUDA C++</text><text x="534" y="201" text-anchor="end" class="mut">threads, warps, shared memory: this post</text>
<rect x="130" y="222" width="420" height="30" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="1" /><text x="146" y="237" text-anchor="start" class="h">inline PTX</text><text x="534" y="237" text-anchor="end" class="mut">one instruction no API exposes yet</text>
<rect x="130" y="258" width="420" height="30" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="146" y="273" text-anchor="start" class="h">SASS</text><text x="534" y="273" text-anchor="end" class="mut">what actually runs on the SM</text>
<line x1="100" y1="288" x2="100.0" y2="58.0" stroke="rgba(0,214,162,0.6)" stroke-width="1.2" /><polygon points="100,50 95.5,58.0 104.5,58.0" fill="rgba(0,214,162,0.6)"/><text transform="rotate(-90 88 170)" x="88" y="170" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">more productivity</text><line x1="580" y1="50" x2="580.0" y2="280.0" stroke="rgba(255,162,0,0.6)" stroke-width="1.2" /><polygon points="580,288 584.5,280.0 575.5,280.0" fill="rgba(255,162,0,0.6)"/><text transform="rotate(90 594 170)" x="594" y="170" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">more control</text>
</svg>
