<svg width="100%" viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">CUDA Graphs: pay the launch cost once for a whole sequence of kernels</text>
<text x="20" y="46" text-anchor="start" class="lbl" style="fill: rgb(255,110,110); font-weight: 600;">Six small kernels, launched one by one</text>
<text x="100" y="68" text-anchor="end" class="mut">CPU</text><text x="100" y="98" text-anchor="end" class="mut">GPU</text><rect x="110" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="131" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="158" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="154" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="175" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="202" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="198" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="219" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="246" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="242" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="263" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="290" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="286" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="307" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="334" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="330" y="58" width="42" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="351" y="68" text-anchor="middle" class="n" style="font-size: 8.5px;">launch</text><rect x="378" y="88" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="428" y="98" text-anchor="start" class="mut">the GPU idles between kernels</text>
<text x="20" y="140" text-anchor="start" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">The same six kernels captured as one graph</text>
<text x="100" y="162" text-anchor="end" class="mut">CPU</text><text x="100" y="192" text-anchor="end" class="mut">GPU</text><rect x="110" y="152" width="70" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="145" y="162" text-anchor="middle" class="n" style="font-size: 8.5px;">graph launch</text><rect x="186" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="210" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="234" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="258" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="282" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="306" y="182" width="22" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="340" y="192" text-anchor="start" class="mut">back to back, dependencies resolved up front</text>
<line x1="110" y1="222" x2="640" y2="222" stroke="rgba(222,220,209,0.45)"/><polygon points="636,217 644,222 636,227" fill="rgba(222,220,209,0.45)"/><text x="640" y="234" text-anchor="end" class="mut">time</text><text x="340" y="246" text-anchor="middle" class="mut">The catch: a graph is frozen (same kernels, shapes, addresses), so engines capture one per batch size.</text>
</svg>
