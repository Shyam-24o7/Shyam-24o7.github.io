<svg width="100%" viewBox="0 0 680 244" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What each GPU generation added for kernel writers</text>
<line x1="60" y1="84" x2="620" y2="84" stroke="rgba(222,220,209,0.4)" stroke-width="1.5"/>
<circle cx="80" cy="84" r="9" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="2"/><text x="80" y="52" text-anchor="middle" class="h" style="fill: rgb(48,148,255);">Volta</text><text x="80" y="66" text-anchor="middle" class="mut">2017</text><rect x="20" y="104" width="120" height="76" rx="3" fill="#12131c" stroke="rgb(48,148,255)" stroke-width="1" /><text x="80" y="122" text-anchor="middle" class="lbl" style="font-size: 10px;">tensor cores (1st gen)</text><text x="80" y="140" text-anchor="middle" class="lbl" style="font-size: 10px;">independent thread</text><text x="80" y="158" text-anchor="middle" class="lbl" style="font-size: 10px;">scheduling</text>
<circle cx="210" cy="84" r="9" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="2"/><text x="210" y="52" text-anchor="middle" class="h" style="fill: rgb(80,210,230);">Turing</text><text x="210" y="66" text-anchor="middle" class="mut">2018</text><rect x="150" y="104" width="120" height="58" rx="3" fill="#12131c" stroke="rgb(80,210,230)" stroke-width="1" /><text x="210" y="122" text-anchor="middle" class="lbl" style="font-size: 10px;">INT8 / INT4</text><text x="210" y="140" text-anchor="middle" class="lbl" style="font-size: 10px;">tensor cores</text>
<circle cx="340" cy="84" r="9" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="2"/><text x="340" y="52" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">Ampere</text><text x="340" y="66" text-anchor="middle" class="mut">2020</text><rect x="280" y="104" width="120" height="94" rx="3" fill="#12131c" stroke="rgb(0,214,162)" stroke-width="1" /><text x="340" y="122" text-anchor="middle" class="lbl" style="font-size: 10px;">cp.async</text><text x="340" y="140" text-anchor="middle" class="lbl" style="font-size: 10px;">BF16 and TF32</text><text x="340" y="158" text-anchor="middle" class="lbl" style="font-size: 10px;">2:4 sparsity</text><text x="340" y="176" text-anchor="middle" class="lbl" style="font-size: 10px;">L2 persistence, MIG</text>
<circle cx="470" cy="84" r="9" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="2"/><text x="470" y="52" text-anchor="middle" class="h" style="fill: rgb(170,130,255);">Hopper</text><text x="470" y="66" text-anchor="middle" class="mut">2022</text><rect x="410" y="104" width="120" height="94" rx="3" fill="#12131c" stroke="rgb(170,130,255)" stroke-width="1" /><text x="470" y="122" text-anchor="middle" class="lbl" style="font-size: 10px;">TMA and mbarrier</text><text x="470" y="140" text-anchor="middle" class="lbl" style="font-size: 10px;">wgmma</text><text x="470" y="158" text-anchor="middle" class="lbl" style="font-size: 10px;">clusters, DSMEM</text><text x="470" y="176" text-anchor="middle" class="lbl" style="font-size: 10px;">FP8, PDL</text>
<circle cx="600" cy="84" r="9" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="2"/><text x="600" y="52" text-anchor="middle" class="h" style="fill: rgb(255,162,0);">Blackwell</text><text x="600" y="66" text-anchor="middle" class="mut">2024</text><rect x="540" y="104" width="120" height="94" rx="3" fill="#12131c" stroke="rgb(255,162,0)" stroke-width="1" /><text x="600" y="122" text-anchor="middle" class="lbl" style="font-size: 10px;">tcgen05 and</text><text x="600" y="140" text-anchor="middle" class="lbl" style="font-size: 10px;">Tensor Memory</text><text x="600" y="158" text-anchor="middle" class="lbl" style="font-size: 10px;">CTA pairs</text><text x="600" y="176" text-anchor="middle" class="lbl" style="font-size: 10px;">FP6 / FP4 block-scaled</text>
<text x="340" y="226" text-anchor="middle" class="mut">Each generation moves more of the orchestration (copies, synchronisation, accumulation) into hardware.</text>
</svg>
