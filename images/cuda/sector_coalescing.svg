<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #e8f0ff; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .idle { fill: #12131c; stroke: rgba(112,130,158,0.35); stroke-width: 0.6; }
  .mv { fill: #1a1c28; stroke-width: 0.9; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What one warp's float load really moves: 32-byte sectors</text>
<text x="400" y="44" text-anchor="middle" class="mut">each cell is one 32-byte sector of memory</text>

<!-- row 1: stride 1 -->
<text x="150" y="70" text-anchor="end" class="lbl">stride 1: A[i]</text>
<text x="150" y="86" text-anchor="end" style="fill: rgb(0,214,162); font-size: 10px;">4 sectors, 100% useful</text>
<g id="r1">
<rect x="160" y="62" width="15" height="32" class="mv" stroke="rgb(0,214,162)"/><rect x="160" y="62" width="15" height="32" fill="rgb(0,214,162)" opacity="0.75"/>
<rect x="175" y="62" width="15" height="32" class="mv" stroke="rgb(0,214,162)"/><rect x="175" y="62" width="15" height="32" fill="rgb(0,214,162)" opacity="0.75"/>
<rect x="190" y="62" width="15" height="32" class="mv" stroke="rgb(0,214,162)"/><rect x="190" y="62" width="15" height="32" fill="rgb(0,214,162)" opacity="0.75"/>
<rect x="205" y="62" width="15" height="32" class="mv" stroke="rgb(0,214,162)"/><rect x="205" y="62" width="15" height="32" fill="rgb(0,214,162)" opacity="0.75"/>
</g>
<rect x="220" y="62" width="420" height="32" class="idle"/>

<!-- row 2: stride 2 -->
<text x="150" y="132" text-anchor="end" class="lbl">stride 2: A[2*i]</text>
<text x="150" y="148" text-anchor="end" style="fill: rgb(255,162,0); font-size: 10px;">8 sectors, 50% useful</text>
<rect x="160" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="160" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="175" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="175" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="190" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="190" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="205" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="205" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="220" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="220" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="235" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="235" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="250" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="250" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="265" y="124" width="15" height="32" class="mv" stroke="rgb(255,162,0)"/><rect x="265" y="124" width="7.5" height="32" fill="rgb(255,162,0)" opacity="0.75"/>
<rect x="280" y="124" width="360" height="32" class="idle"/>

<!-- row 3: stride 32 -->
<text x="150" y="194" text-anchor="end" class="lbl">stride 32: A[32*i]</text>
<text x="150" y="210" text-anchor="end" style="fill: rgb(255,110,110); font-size: 10px;">32 sectors, 12.5% useful</text>
<g stroke="rgb(255,110,110)">
<rect x="160" y="186" width="15" height="32" class="mv"/><rect x="175" y="186" width="15" height="32" class="mv"/><rect x="190" y="186" width="15" height="32" class="mv"/><rect x="205" y="186" width="15" height="32" class="mv"/>
<rect x="220" y="186" width="15" height="32" class="mv"/><rect x="235" y="186" width="15" height="32" class="mv"/><rect x="250" y="186" width="15" height="32" class="mv"/><rect x="265" y="186" width="15" height="32" class="mv"/>
<rect x="280" y="186" width="15" height="32" class="mv"/><rect x="295" y="186" width="15" height="32" class="mv"/><rect x="310" y="186" width="15" height="32" class="mv"/><rect x="325" y="186" width="15" height="32" class="mv"/>
<rect x="340" y="186" width="15" height="32" class="mv"/><rect x="355" y="186" width="15" height="32" class="mv"/><rect x="370" y="186" width="15" height="32" class="mv"/><rect x="385" y="186" width="15" height="32" class="mv"/>
<rect x="400" y="186" width="15" height="32" class="mv"/><rect x="415" y="186" width="15" height="32" class="mv"/><rect x="430" y="186" width="15" height="32" class="mv"/><rect x="445" y="186" width="15" height="32" class="mv"/>
<rect x="460" y="186" width="15" height="32" class="mv"/><rect x="475" y="186" width="15" height="32" class="mv"/><rect x="490" y="186" width="15" height="32" class="mv"/><rect x="505" y="186" width="15" height="32" class="mv"/>
<rect x="520" y="186" width="15" height="32" class="mv"/><rect x="535" y="186" width="15" height="32" class="mv"/><rect x="550" y="186" width="15" height="32" class="mv"/><rect x="565" y="186" width="15" height="32" class="mv"/>
<rect x="580" y="186" width="15" height="32" class="mv"/><rect x="595" y="186" width="15" height="32" class="mv"/><rect x="610" y="186" width="15" height="32" class="mv"/><rect x="625" y="186" width="15" height="32" class="mv"/>
</g>
<g fill="rgb(255,110,110)" opacity="1">
<rect x="160" y="186" width="3" height="32"/><rect x="175" y="186" width="3" height="32"/><rect x="190" y="186" width="3" height="32"/><rect x="205" y="186" width="3" height="32"/>
<rect x="220" y="186" width="3" height="32"/><rect x="235" y="186" width="3" height="32"/><rect x="250" y="186" width="3" height="32"/><rect x="265" y="186" width="3" height="32"/>
<rect x="280" y="186" width="3" height="32"/><rect x="295" y="186" width="3" height="32"/><rect x="310" y="186" width="3" height="32"/><rect x="325" y="186" width="3" height="32"/>
<rect x="340" y="186" width="3" height="32"/><rect x="355" y="186" width="3" height="32"/><rect x="370" y="186" width="3" height="32"/><rect x="385" y="186" width="3" height="32"/>
<rect x="400" y="186" width="3" height="32"/><rect x="415" y="186" width="3" height="32"/><rect x="430" y="186" width="3" height="32"/><rect x="445" y="186" width="3" height="32"/>
<rect x="460" y="186" width="3" height="32"/><rect x="475" y="186" width="3" height="32"/><rect x="490" y="186" width="3" height="32"/><rect x="505" y="186" width="3" height="32"/>
<rect x="520" y="186" width="3" height="32"/><rect x="535" y="186" width="3" height="32"/><rect x="550" y="186" width="3" height="32"/><rect x="565" y="186" width="3" height="32"/>
<rect x="580" y="186" width="3" height="32"/><rect x="595" y="186" width="3" height="32"/><rect x="610" y="186" width="3" height="32"/><rect x="625" y="186" width="3" height="32"/>
</g>

<text x="340" y="242" text-anchor="middle" style="fill: #c8d2e6; font-size: 11px;">Filled part: bytes the 32 threads asked for. Outlined: the whole sector moves anyway.</text>
<text x="340" y="258" text-anchor="middle" class="mut">The order of threads inside the warp doesn't matter. Only the number of distinct sectors does.</text>
</svg>
