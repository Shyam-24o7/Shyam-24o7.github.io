<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .v { fill: #161826; stroke: rgba(200,210,230,0.4); stroke-width: 0.9; }
  .k { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 1; }
  .d { fill: #1a0e12; stroke: rgba(255,110,110,0.6); stroke-width: 0.9; stroke-dasharray: 3 2; }
  .s { fill: rgb(10,34,64); stroke: rgb(48,148,255); stroke-width: 1; }
  .n { fill: #e8f0ff; font-size: 11px; }
  .nd { fill: #6b5560; font-size: 11px; }
  .arrow { stroke: rgba(0,214,162,0.55); stroke-width: 1; fill: none; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Warp compaction with a ballot: keep the positive values, packed</text>

<text x="120" y="48" text-anchor="end" class="mut">lane</text>
<text x="157" y="48" text-anchor="middle" class="mut">0</text><text x="217" y="48" text-anchor="middle" class="mut">1</text><text x="277" y="48" text-anchor="middle" class="mut">2</text><text x="337" y="48" text-anchor="middle" class="mut">3</text>
<text x="397" y="48" text-anchor="middle" class="mut">4</text><text x="457" y="48" text-anchor="middle" class="mut">5</text><text x="517" y="48" text-anchor="middle" class="mut">6</text><text x="577" y="48" text-anchor="middle" class="mut">7</text>

<text x="120" y="74" text-anchor="end" class="lbl">value</text>
<rect x="135" y="61" width="44" height="26" rx="3" class="k"/><text x="157" y="74" text-anchor="middle" class="n">3</text>
<rect x="195" y="61" width="44" height="26" rx="3" class="d"/><text x="217" y="74" text-anchor="middle" class="nd">−1</text>
<rect x="255" y="61" width="44" height="26" rx="3" class="k"/><text x="277" y="74" text-anchor="middle" class="n">4</text>
<rect x="315" y="61" width="44" height="26" rx="3" class="d"/><text x="337" y="74" text-anchor="middle" class="nd">−1</text>
<rect x="375" y="61" width="44" height="26" rx="3" class="k"/><text x="397" y="74" text-anchor="middle" class="n">5</text>
<rect x="435" y="61" width="44" height="26" rx="3" class="d"/><text x="457" y="74" text-anchor="middle" class="nd">−9</text>
<rect x="495" y="61" width="44" height="26" rx="3" class="k"/><text x="517" y="74" text-anchor="middle" class="n">2</text>
<rect x="555" y="61" width="44" height="26" rx="3" class="k"/><text x="577" y="74" text-anchor="middle" class="n">6</text>

<text x="120" y="108" text-anchor="end" class="lbl">ballot bit</text>
<text x="157" y="108" text-anchor="middle" class="n">1</text><text x="217" y="108" text-anchor="middle" class="nd">0</text><text x="277" y="108" text-anchor="middle" class="n">1</text><text x="337" y="108" text-anchor="middle" class="nd">0</text>
<text x="397" y="108" text-anchor="middle" class="n">1</text><text x="457" y="108" text-anchor="middle" class="nd">0</text><text x="517" y="108" text-anchor="middle" class="n">1</text><text x="577" y="108" text-anchor="middle" class="n">1</text>

<text x="120" y="138" text-anchor="end" class="lbl">kept lanes below</text>
<text x="157" y="138" text-anchor="middle" style="fill: rgb(48,148,255); font-size: 11px;">0</text>
<text x="277" y="138" text-anchor="middle" style="fill: rgb(48,148,255); font-size: 11px;">1</text>
<text x="397" y="138" text-anchor="middle" style="fill: rgb(48,148,255); font-size: 11px;">2</text>
<text x="517" y="138" text-anchor="middle" style="fill: rgb(48,148,255); font-size: 11px;">3</text>
<text x="577" y="138" text-anchor="middle" style="fill: rgb(48,148,255); font-size: 11px;">4</text>

<path d="M157 150 L157 186" class="arrow"/>
<path d="M277 150 Q 277 170 217 186" class="arrow"/>
<path d="M397 150 Q 397 172 277 186" class="arrow"/>
<path d="M517 150 Q 517 174 337 186" class="arrow"/>
<path d="M577 150 Q 577 176 397 186" class="arrow"/>

<text x="120" y="201" text-anchor="end" class="lbl">packed output</text>
<rect x="135" y="188" width="44" height="26" rx="3" class="s"/><text x="157" y="201" text-anchor="middle" class="n">3</text>
<rect x="195" y="188" width="44" height="26" rx="3" class="s"/><text x="217" y="201" text-anchor="middle" class="n">4</text>
<rect x="255" y="188" width="44" height="26" rx="3" class="s"/><text x="277" y="201" text-anchor="middle" class="n">5</text>
<rect x="315" y="188" width="44" height="26" rx="3" class="s"/><text x="337" y="201" text-anchor="middle" class="n">2</text>
<rect x="375" y="188" width="44" height="26" rx="3" class="s"/><text x="397" y="201" text-anchor="middle" class="n">6</text>

<text x="340" y="236" text-anchor="middle" class="lbl">slot = __popc(ballot &amp; lanes_below_me): two instructions, no shared memory</text>
<text x="340" y="254" text-anchor="middle" class="mut">The same bitmask gives the warp's total (__popc(ballot)) for a single warp-aggregated atomic.</text>
</svg>
