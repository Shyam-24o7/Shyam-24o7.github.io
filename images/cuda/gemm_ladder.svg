<svg width="100%" viewBox="0 0 680 364" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .bar { fill: rgb(10,34,64); stroke: rgb(48,148,255); stroke-width: 0.9; }
  .top { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.9; }
  .vo { fill: #c8d2e6; font-size: 10.5px; }
  .vi { fill: #e8f0ff; font-size: 10.5px; }
  .grid { stroke: rgba(222,220,209,0.12); stroke-width: 0.5; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">FP32 SGEMM, one optimisation at a time (4096 × 4096, RTX A6000)</text>
<text x="420" y="42" text-anchor="middle" class="mut">GFLOP/s, with % of cuBLAS in brackets</text>

<line x1="313.3" y1="52" x2="313.3" y2="322" class="grid"/>
<line x1="396.7" y1="52" x2="396.7" y2="322" class="grid"/>
<line x1="480" y1="52" x2="480" y2="322" class="grid"/>
<line x1="563.3" y1="52" x2="563.3" y2="322" class="grid"/>
<line x1="230" y1="322" x2="630" y2="322" stroke="rgba(222,220,209,0.45)" stroke-width="1"/>
<text x="230" y="334" text-anchor="middle" class="mut">0</text>
<text x="313.3" y="334" text-anchor="middle" class="mut">5k</text>
<text x="396.7" y="334" text-anchor="middle" class="mut">10k</text>
<text x="480" y="334" text-anchor="middle" class="mut">15k</text>
<text x="563.3" y="334" text-anchor="middle" class="mut">20k</text>

<text x="222" y="69" text-anchor="end" class="lbl">naive, one thread per output</text>
<rect x="230" y="58" width="5.2" height="22" rx="1" class="bar"/>
<text x="241" y="69" class="vo">309 (1.3%)</text>

<text x="222" y="99" text-anchor="end" class="lbl">coalesced global access</text>
<rect x="230" y="88" width="33.1" height="22" rx="1" class="bar"/>
<text x="269" y="99" class="vo">1,987 (8.5%)</text>

<text x="222" y="129" text-anchor="end" class="lbl">shared-memory tiling</text>
<rect x="230" y="118" width="49.7" height="22" rx="1" class="bar"/>
<text x="286" y="129" class="vo">2,980 (12.8%)</text>

<text x="222" y="159" text-anchor="end" class="lbl">1D register blocking</text>
<rect x="230" y="148" width="141.3" height="22" rx="1" class="bar"/>
<text x="377" y="159" class="vo">8,475 (36.5%)</text>

<text x="222" y="189" text-anchor="end" class="lbl">2D register blocking</text>
<rect x="230" y="178" width="266.2" height="22" rx="1" class="bar"/>
<text x="490" y="189" text-anchor="end" class="vi">15,972 (68.7%)</text>

<text x="222" y="219" text-anchor="end" class="lbl">vectorised loads</text>
<rect x="230" y="208" width="304" height="22" rx="1" class="bar"/>
<text x="528" y="219" text-anchor="end" class="vi">18,237 (78.4%)</text>

<text x="222" y="249" text-anchor="end" class="lbl">autotuned tile sizes</text>
<rect x="230" y="238" width="328.7" height="22" rx="1" class="bar"/>
<text x="552" y="249" text-anchor="end" class="vi">19,721 (84.8%)</text>

<text x="222" y="279" text-anchor="end" class="lbl">warp tiling</text>
<rect x="230" y="268" width="363" height="22" rx="1" class="bar"/>
<text x="587" y="279" text-anchor="end" class="vi">21,779 (93.7%)</text>

<text x="222" y="309" text-anchor="end" style="fill: rgb(0,214,162); font-size: 11px; font-weight: 600;">cuBLAS</text>
<rect x="230" y="298" width="387.5" height="22" rx="1" class="top"/>
<text x="611" y="309" text-anchor="end" class="vi">23,250 (100%)</text>

<text x="340" y="352" text-anchor="middle" class="mut">Data: Simon Boehm, "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance" (2022)</text>
</svg>
