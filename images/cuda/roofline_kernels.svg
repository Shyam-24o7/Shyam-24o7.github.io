<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .grid { stroke: rgba(222,220,209,0.12); stroke-width: 0.5; }
  .axis { stroke: rgba(222,220,209,0.45); stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="24" text-anchor="middle" class="title">The roofline for an A100 (FP32 CUDA cores): where common kernels land</text>

<!-- grid -->
<line x1="130.9" y1="50" x2="130.9" y2="320" class="grid"/>
<line x1="300.6" y1="50" x2="300.6" y2="320" class="grid"/>
<line x1="470.3" y1="50" x2="470.3" y2="320" class="grid"/>
<line x1="640" y1="50" x2="640" y2="320" class="grid"/>
<line x1="80" y1="216.2" x2="640" y2="216.2" class="grid"/>
<line x1="80" y1="112.3" x2="640" y2="112.3" class="grid"/>

<!-- axes -->
<line x1="80" y1="50" x2="80" y2="320" class="axis"/>
<line x1="80" y1="320" x2="640" y2="320" class="axis"/>
<text x="130.9" y="336" text-anchor="middle" class="mut">0.1</text>
<text x="300.6" y="336" text-anchor="middle" class="mut">1</text>
<text x="470.3" y="336" text-anchor="middle" class="mut">10</text>
<text x="640" y="336" text-anchor="middle" class="mut">100</text>
<text x="72" y="320" text-anchor="end" class="mut">0.1</text>
<text x="72" y="216.2" text-anchor="end" class="mut">1</text>
<text x="72" y="112.3" text-anchor="end" class="mut">10</text>
<text x="360" y="358" text-anchor="middle" class="lbl">Arithmetic intensity (FLOPs per byte of DRAM traffic, log scale)</text>
<text x="24" y="185" text-anchor="middle" class="lbl" transform="rotate(-90 24 185)">Attainable TFLOP/s (log scale)</text>

<!-- roof -->
<line x1="80" y1="319.1" x2="466.9" y2="82.2" stroke="rgb(48,148,255)" stroke-width="2.5" stroke-linecap="round"/>
<line x1="466.9" y1="82.2" x2="640" y2="82.2" stroke="rgb(0,214,162)" stroke-width="2.5" stroke-linecap="round"/>
<line x1="466.9" y1="82.2" x2="466.9" y2="320" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="5 4"/>
<text x="474" y="304" text-anchor="start" class="mut">ridge point ≈ 9.6 FLOPs/byte</text>
<text x="636" y="66" text-anchor="end" style="fill: rgb(0,214,162); font-size: 11px;">compute ceiling: 19.5 TFLOP/s</text>
<text x="240" y="205" text-anchor="middle" transform="rotate(-31.5 240 205)" style="fill: rgb(48,148,255); font-size: 11px;">bandwidth roof: 2.04 TB/s × intensity</text>

<!-- region labels -->
<text x="170" y="100" text-anchor="middle" class="mut">memory-bound</text>
<text x="560" y="190" text-anchor="middle" class="mut">compute-bound</text>

<!-- kernels on the bandwidth roof -->
<circle cx="117.2" cy="296.1" r="5" fill="rgb(255,162,0)"/>
<text x="127" y="308" text-anchor="start" class="lbl">vector add (0.08)</text>
<circle cx="168.6" cy="264.8" r="5" fill="rgb(255,162,0)"/>
<text x="178" y="278" text-anchor="start" class="lbl">SAXPY (0.17)</text>
<circle cx="198.5" cy="246.5" r="5" fill="rgb(255,162,0)"/>
<text x="208" y="258" text-anchor="start" class="lbl">naive matmul (0.25)</text>

<!-- a measured kernel far below its roof -->
<line x1="351.7" y1="210" x2="351.7" y2="158" stroke="rgb(255,110,110)" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="351.7" cy="216.2" r="5" fill="rgb(255,110,110)"/>
<text x="360" y="232" text-anchor="start" style="fill: rgb(255,110,110); font-size: 11px;">latency-bound:</text>
<text x="360" y="246" text-anchor="start" style="fill: rgb(255,110,110); font-size: 11px;">far below its roof</text>

<!-- compute-bound kernel -->
<circle cx="551.3" cy="94" r="5" fill="rgb(0,214,162)"/>
<text x="551" y="112" text-anchor="middle" class="lbl">register-blocked GEMM (~30)</text>
</svg>
