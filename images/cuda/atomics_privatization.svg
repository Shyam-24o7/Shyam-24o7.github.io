<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .t { fill: rgb(48,148,255); }
  .bin { fill: rgb(60,18,22); stroke: rgb(255,110,110); stroke-width: 1; }
  .gbin { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 1; }
