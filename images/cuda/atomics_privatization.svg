<rect x="466" y="62" width="88" height="52" rx="4" fill="rgba(48,148,255,0.06)" stroke="rgba(48,148,255,0.5)"/>
<rect x="568" y="62" width="88" height="52" rx="4" fill="rgba(48,148,255,0.06)" stroke="rgba(48,148,255,0.5)"/>
