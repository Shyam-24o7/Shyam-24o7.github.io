</g>
<rect x="410" y="160" width="50" height="34" rx="3" class="gbin"/><rect x="460" y="160" width="50" height="34" rx="3" class="gbin"/>
<rect x="510" y="160" width="50" height="34" rx="3" class="gbin"/><rect x="560" y="160" width="50" height="34" rx="3" class="gbin"/>
<text x="435" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 0</text><text x="485" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 1</text>
<text x="535" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 2</text><text x="585" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 3</text>
<text x="510" y="212" text-anchor="middle" style="fill: rgb(0,214,162); font-size: 10.5px;">one global atomic per bin per block</text>

<text x="340" y="250" text-anchor="middle" class="mut">Shared-memory atomics run on the SM itself, and each block only contends with its own threads.</text>
