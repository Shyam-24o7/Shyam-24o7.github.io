</g>
<rect x="70" y="160" width="50" height="34" rx="3" class="bin"/><rect x="120" y="160" width="50" height="34" rx="3" class="bin"/>
<rect x="170" y="160" width="50" height="34" rx="3" class="bin"/><rect x="220" y="160" width="50" height="34" rx="3" class="bin"/>
<text x="95" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 0</text><text x="145" y="177" text-anchor="middle" style="fill: #e8f0ff; font-size: 10px;">bin 1</text>
