<text x="170" y="212" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 10.5px;">updates to one bin queue up at L2</text>

<line x1="340" y1="44" x2="340" y2="224" stroke="rgba(222,220,209,0.2)" stroke-width="0.5" stroke-dasharray="4 4"/>

<text x="510" y="48" text-anchor="middle" style="fill: rgb(0,214,162); font-size: 12px; font-weight: 600;">per-block histograms, then merge</text>
