</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Histogram atomics: contention, and how privatisation removes it</text>

<text x="170" y="48" text-anchor="middle" style="fill: rgb(255,110,110); font-size: 12px; font-weight: 600;">every thread → global bins</text>
<g>
