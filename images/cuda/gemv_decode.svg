<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Decode is a GEMV: every weight is read once and used once</text>
<rect x="40" y="56" width="220" height="150" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="150" y="46" text-anchor="middle" class="mut">weights W</text><rect x="40" y="104" width="220" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="150" y="113" text-anchor="middle" class="n" style="font-size: 9.5px;">warp k reads row k, coalesced</text><rect x="274" y="56" width="20" height="150" rx="3" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="1" /><text x="284" y="46" text-anchor="middle" class="mut">x</text><text x="310" y="131" text-anchor="middle" class="lbl">=</text><rect x="326" y="56" width="20" height="150" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><rect x="326" y="104" width="20" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="336" y="46" text-anchor="middle" class="mut">y</text>
<text x="150" y="222" text-anchor="middle" class="mut">then a shuffle reduction gives y[k]</text>
<text x="380" y="66" text-anchor="start" class="lbl">Batch-1 decode multiplies each matrix by one vector.</text><text x="380" y="84" text-anchor="start" class="lbl">FP16: 2 FLOPs per 2-byte weight ≈ 1 FLOP/byte,</text><text x="380" y="102" text-anchor="start" class="lbl">far left on the roofline: pure bandwidth.</text><text x="380" y="124" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">time ≈ weight bytes ÷ memory bandwidth</text>
<text x="380" y="156" text-anchor="start" class="mut">bytes per weight</text><rect x="380" y="166" width="240" height="18" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="388" y="175" text-anchor="start" class="n">FP16: 2 bytes</text><rect x="380" y="190" width="60" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="448" y="199" text-anchor="start" class="n">INT4: 0.5 bytes, up to 4× faster</text>
<text x="340" y="250" text-anchor="middle" class="mut">Shrinking the weights speeds decoding up almost directly: the reason weight quantisation matters.</text>
</svg>
