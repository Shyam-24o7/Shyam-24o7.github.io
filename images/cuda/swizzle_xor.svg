<text x="400" y="86" class="lbl">Each cell shows which logical column</text>
<text x="400" y="102" class="lbl">is stored in that physical slot.</text>
<rect x="400" y="128" width="12" height="12" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="420" y="134" class="lbl">logical column 0: one cell per bank</text>
<rect x="400" y="152" width="12" height="12" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/><text x="420" y="158" class="lbl">logical column 3: also one per bank</text>
<text x="400" y="192" class="mut">Reading any logical column hits all eight</text>
<text x="400" y="208" class="mut">banks once: conflict-free, like padding.</text>
<text x="400" y="236" class="mut">Unlike padding, no memory is wasted and</text>
<text x="400" y="252" class="mut">every row stays aligned, so vector loads,</text>
<text x="400" y="268" class="mut">async copies and tensor core loads still work.</text>
<text x="340" y="324" text-anchor="middle" class="mut">Shown with 8 banks for clarity. Real kernels XOR with a few bits of the row index across 32 banks.</text>
</svg>
