<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 10.5px; }
  .is { fill: rgb(0,214,162); }
  .w { fill: #161826; stroke: rgba(112,130,158,0.35); stroke-width: 0.6; }
  .slot { fill: rgb(5,54,42); stroke: rgb(0,214,162); stroke-width: 0.8; }
  .idle { fill: #1a0e12; stroke: rgb(255,110,110); stroke-width: 0.9; stroke-dasharray: 3 2; }
  .n { fill: #e8f0ff; font-size: 9px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Latency hiding: a scheduler issues from whichever warp is ready</text>

<text x="20" y="48" style="fill: rgb(0,214,162); font-size: 11.5px; font-weight: 600;">4 warps, each waiting 3 cycles after every instruction</text>
<!-- cycles 0..11, col x = 130 + c*36, width 34 -->
<text x="120" y="68" text-anchor="end" class="mut">warp 0</text><text x="120" y="88" text-anchor="end" class="mut">warp 1</text>
<text x="120" y="108" text-anchor="end" class="mut">warp 2</text><text x="120" y="128" text-anchor="end" class="mut">warp 3</text>
<g>
<rect x="130" y="60" width="430" height="16" class="w"/><rect x="130" y="80" width="430" height="16" class="w"/>
<rect x="130" y="100" width="430" height="16" class="w"/><rect x="130" y="120" width="430" height="16" class="w"/>
</g>
<rect x="130" y="60" width="34" height="16" class="is"/><rect x="274" y="60" width="34" height="16" class="is"/><rect x="418" y="60" width="34" height="16" class="is"/>
<rect x="166" y="80" width="34" height="16" class="is"/><rect x="310" y="80" width="34" height="16" class="is"/><rect x="454" y="80" width="34" height="16" class="is"/>
<rect x="202" y="100" width="34" height="16" class="is"/><rect x="346" y="100" width="34" height="16" class="is"/><rect x="490" y="100" width="34" height="16" class="is"/>
<rect x="238" y="120" width="34" height="16" class="is"/><rect x="382" y="120" width="34" height="16" class="is"/><rect x="526" y="120" width="34" height="16" class="is"/>
<text x="120" y="152" text-anchor="end" class="lbl">issued</text>
<rect x="130" y="144" width="34" height="16" class="slot"/><text x="147" y="152" text-anchor="middle" class="n">W0</text>
<rect x="166" y="144" width="34" height="16" class="slot"/><text x="183" y="152" text-anchor="middle" class="n">W1</text>
<rect x="202" y="144" width="34" height="16" class="slot"/><text x="219" y="152" text-anchor="middle" class="n">W2</text>
<rect x="238" y="144" width="34" height="16" class="slot"/><text x="255" y="152" text-anchor="middle" class="n">W3</text>
