<rect x="310" y="144" width="34" height="16" class="slot"/><text x="327" y="152" text-anchor="middle" class="n">W1</text>
<rect x="346" y="144" width="34" height="16" class="slot"/><text x="363" y="152" text-anchor="middle" class="n">W2</text>
<rect x="382" y="144" width="34" height="16" class="slot"/><text x="399" y="152" text-anchor="middle" class="n">W3</text>
<rect x="418" y="144" width="34" height="16" class="slot"/><text x="435" y="152" text-anchor="middle" class="n">W0</text>
<rect x="454" y="144" width="34" height="16" class="slot"/><text x="471" y="152" text-anchor="middle" class="n">W1</text>
<rect x="490" y="144" width="34" height="16" class="slot"/><text x="507" y="152" text-anchor="middle" class="n">W2</text>
<rect x="526" y="144" width="34" height="16" class="slot"/><text x="543" y="152" text-anchor="middle" class="n">W3</text>
<text x="600" y="152" class="lbl" style="fill: rgb(0,214,162);">100% busy</text>

<text x="20" y="186" style="fill: rgb(255,110,110); font-size: 11.5px; font-weight: 600;">2 warps with the same latency: half the issue slots go empty</text>
<text x="120" y="206" text-anchor="end" class="mut">warp 0</text><text x="120" y="226" text-anchor="end" class="mut">warp 1</text>
<rect x="130" y="198" width="430" height="16" class="w"/><rect x="130" y="218" width="430" height="16" class="w"/>
<rect x="130" y="198" width="34" height="16" class="is"/><rect x="274" y="198" width="34" height="16" class="is"/><rect x="418" y="198" width="34" height="16" class="is"/>
<rect x="166" y="218" width="34" height="16" class="is"/><rect x="310" y="218" width="34" height="16" class="is"/><rect x="454" y="218" width="34" height="16" class="is"/>
<text x="120" y="250" text-anchor="end" class="lbl">issued</text>
<rect x="130" y="242" width="34" height="16" class="slot"/><text x="147" y="250" text-anchor="middle" class="n">W0</text>
<rect x="166" y="242" width="34" height="16" class="slot"/><text x="183" y="250" text-anchor="middle" class="n">W1</text>
<rect x="202" y="242" width="34" height="16" class="idle"/><rect x="238" y="242" width="34" height="16" class="idle"/>
<rect x="274" y="242" width="34" height="16" class="slot"/><text x="291" y="250" text-anchor="middle" class="n">W0</text>
<rect x="310" y="242" width="34" height="16" class="slot"/><text x="327" y="250" text-anchor="middle" class="n">W1</text>
<rect x="346" y="242" width="34" height="16" class="idle"/><rect x="382" y="242" width="34" height="16" class="idle"/>
<rect x="418" y="242" width="34" height="16" class="slot"/><text x="435" y="250" text-anchor="middle" class="n">W0</text>
<rect x="454" y="242" width="34" height="16" class="slot"/><text x="471" y="250" text-anchor="middle" class="n">W1</text>
<rect x="490" y="242" width="34" height="16" class="idle"/><rect x="526" y="242" width="34" height="16" class="idle"/>
<text x="600" y="250" class="lbl" style="fill: rgb(255,110,110);">50% busy</text>

<text x="340" y="284" text-anchor="middle" class="mut">Green: the cycle a warp's instruction issues. No single warp got faster; there just weren't enough of them.</text>
</svg>
