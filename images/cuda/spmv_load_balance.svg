<svg width="100%" viewBox="0 0 680 304" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Sparse rows are uneven: balance the non-zeros, not the rows</text>
<text x="20" y="48" text-anchor="start" class="lbl" style="fill: rgb(255,110,110); font-weight: 600;">One thread per row</text>
<text x="82" y="66" text-anchor="end" class="mut">t0</text><rect x="90" y="60" width="28" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="82" text-anchor="end" class="mut">t1</text><rect x="90" y="76" width="196" height="12" rx="2" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="0.9" />
<text x="82" y="98" text-anchor="end" class="mut">t2</text><rect x="90" y="92" width="42" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="114" text-anchor="end" class="mut">t3</text><rect x="90" y="108" width="14" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="130" text-anchor="end" class="mut">t4</text><rect x="90" y="124" width="126" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="146" text-anchor="end" class="mut">t5</text><rect x="90" y="140" width="28" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="162" text-anchor="end" class="mut">t6</text><rect x="90" y="156" width="14" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<text x="82" y="178" text-anchor="end" class="mut">t7</text><rect x="90" y="172" width="56" height="12" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" />
<line x1="286" y1="56" x2="286" y2="190" stroke="rgba(255,110,110,0.7)" stroke-dasharray="4 3"/>
<text x="296" y="112" text-anchor="start" class="mut">the whole warp waits for the</text>
<text x="296" y="126" text-anchor="start" class="mut">longest row (and reads scattered memory)</text>
<text x="20" y="214" text-anchor="start" class="lbl" style="fill: rgb(0,214,162); font-weight: 600;">Merge-path: 36 non-zeros split into 4 equal shares, ignoring row boundaries</text>
<rect x="90" y="228" width="28" height="24" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><text x="104" y="240" text-anchor="middle" class="n" style="font-size: 9px;">r0</text><rect x="118" y="228" width="196" height="24" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="242" y="240" text-anchor="middle" class="n" style="font-size: 9px;">row 1</text><rect x="314" y="228" width="42" height="24" rx="2" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="0.9" /><text x="320" y="240" text-anchor="middle" class="n" style="font-size: 9px;">row 2</text><rect x="356" y="228" width="14" height="24" rx="2" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="0.9" /><rect x="370" y="228" width="126" height="24" rx="2" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="0.9" /><text x="433" y="240" text-anchor="middle" class="n" style="font-size: 9px;">row 4</text><rect x="496" y="228" width="28" height="24" rx="2" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="0.9" /><text x="510" y="240" text-anchor="middle" class="n" style="font-size: 9px;">r5</text><rect x="524" y="228" width="14" height="24" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="0.9" /><rect x="538" y="228" width="56" height="24" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="0.9" /><text x="566" y="240" text-anchor="middle" class="n" style="font-size: 9px;">row 7</text>
<line x1="216" y1="222" x2="216" y2="258" stroke="#e8f0ff" stroke-width="2"/><line x1="342" y1="222" x2="342" y2="258" stroke="#e8f0ff" stroke-width="2"/><line x1="468" y1="222" x2="468" y2="258" stroke="#e8f0ff" stroke-width="2"/><text x="153" y="268" text-anchor="middle" class="mut">t0: 9 non-zeros</text><text x="279" y="268" text-anchor="middle" class="mut">t1: 9 non-zeros</text><text x="405" y="268" text-anchor="middle" class="mut">t2: 9 non-zeros</text><text x="531" y="268" text-anchor="middle" class="mut">t3: 9 non-zeros</text>
<text x="340" y="290" text-anchor="middle" class="lbl">Every thread does the same work; rows that straddle a boundary get a small fix-up at the end.</text>
</svg>
