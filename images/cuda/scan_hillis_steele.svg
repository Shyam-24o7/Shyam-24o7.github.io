<line x1="150" y1="200" x2="150" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="214" y1="200" x2="214" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="278" y1="200" x2="278" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="342" y1="200" x2="342" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="406" y1="200" x2="406" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="150" y1="200" x2="406" y2="232" stroke="rgb(0,214,162)" stroke-opacity="0.6" stroke-width="1"/><line x1="470" y1="200" x2="470" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="214" y1="200" x2="470" y2="232" stroke="rgb(0,214,162)" stroke-opacity="0.6" stroke-width="1"/><line x1="534" y1="200" x2="534" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="278" y1="200" x2="534" y2="232" stroke="rgb(0,214,162)" stroke-opacity="0.6" stroke-width="1"/><line x1="598" y1="200" x2="598" y2="232" stroke="rgba(200,210,230,0.18)" stroke-width="1"/><line x1="342" y1="200" x2="598" y2="232" stroke="rgb(0,214,162)" stroke-opacity="0.6" stroke-width="1"/>
<text x="100" y="66" text-anchor="end" class="lbl">input</text>
<circle cx="150" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="150" y="66" text-anchor="middle" class="n" style="font-size: 11px;">3</text><circle cx="214" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="214" y="66" text-anchor="middle" class="n" style="font-size: 11px;">1</text><circle cx="278" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="278" y="66" text-anchor="middle" class="n" style="font-size: 11px;">4</text><circle cx="342" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="342" y="66" text-anchor="middle" class="n" style="font-size: 11px;">1</text><circle cx="406" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="406" y="66" text-anchor="middle" class="n" style="font-size: 11px;">5</text><circle cx="470" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="470" y="66" text-anchor="middle" class="n" style="font-size: 11px;">9</text><circle cx="534" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="534" y="66" text-anchor="middle" class="n" style="font-size: 11px;">2</text><circle cx="598" cy="66" r="14" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1"/><text x="598" y="66" text-anchor="middle" class="n" style="font-size: 11px;">6</text>
<text x="100" y="126" text-anchor="end" class="lbl" style="fill: rgb(48,148,255);">add d = 1</text>
<circle cx="150" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="150" y="126" text-anchor="middle" class="n" style="font-size: 11px;">3</text><circle cx="214" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="214" y="126" text-anchor="middle" class="n" style="font-size: 11px;">4</text><circle cx="278" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="278" y="126" text-anchor="middle" class="n" style="font-size: 11px;">5</text><circle cx="342" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="342" y="126" text-anchor="middle" class="n" style="font-size: 11px;">5</text><circle cx="406" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="406" y="126" text-anchor="middle" class="n" style="font-size: 11px;">6</text><circle cx="470" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="470" y="126" text-anchor="middle" class="n" style="font-size: 11px;">14</text><circle cx="534" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="534" y="126" text-anchor="middle" class="n" style="font-size: 11px;">11</text><circle cx="598" cy="126" r="14" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1"/><text x="598" y="126" text-anchor="middle" class="n" style="font-size: 11px;">8</text>
<text x="100" y="186" text-anchor="end" class="lbl" style="fill: rgb(255,162,0);">add d = 2</text>
<circle cx="150" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="150" y="186" text-anchor="middle" class="n" style="font-size: 11px;">3</text><circle cx="214" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="214" y="186" text-anchor="middle" class="n" style="font-size: 11px;">4</text><circle cx="278" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="278" y="186" text-anchor="middle" class="n" style="font-size: 11px;">8</text><circle cx="342" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="342" y="186" text-anchor="middle" class="n" style="font-size: 11px;">9</text><circle cx="406" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="406" y="186" text-anchor="middle" class="n" style="font-size: 11px;">11</text><circle cx="470" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="470" y="186" text-anchor="middle" class="n" style="font-size: 11px;">19</text><circle cx="534" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="534" y="186" text-anchor="middle" class="n" style="font-size: 11px;">17</text><circle cx="598" cy="186" r="14" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1"/><text x="598" y="186" text-anchor="middle" class="n" style="font-size: 11px;">22</text>
<text x="100" y="246" text-anchor="end" class="lbl" style="fill: rgb(0,214,162);">add d = 4</text>
<circle cx="150" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="150" y="246" text-anchor="middle" class="n" style="font-size: 11px;">3</text><circle cx="214" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="214" y="246" text-anchor="middle" class="n" style="font-size: 11px;">4</text><circle cx="278" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="278" y="246" text-anchor="middle" class="n" style="font-size: 11px;">8</text><circle cx="342" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="342" y="246" text-anchor="middle" class="n" style="font-size: 11px;">9</text><circle cx="406" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="406" y="246" text-anchor="middle" class="n" style="font-size: 11px;">14</text><circle cx="470" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="470" y="246" text-anchor="middle" class="n" style="font-size: 11px;">23</text><circle cx="534" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="534" y="246" text-anchor="middle" class="n" style="font-size: 11px;">25</text><circle cx="598" cy="246" r="14" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1"/><text x="598" y="246" text-anchor="middle" class="n" style="font-size: 11px;">31</text>
<text x="340" y="296" text-anchor="middle" class="mut">Each step, element i adds the value d places to its left. 3 steps for 8 elements, but O(n log n) total work;</text>
<text x="340" y="310" text-anchor="middle" class="mut">work-efficient (Blelloch) and single-pass decoupled look-back scans do O(n).</text>
</svg>
