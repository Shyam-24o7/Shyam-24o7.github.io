<svg width="100%" viewBox="0 0 680 272" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Online softmax: one pass, rescaling the running sum whenever the max grows</text>
<text x="340" y="48" text-anchor="middle" class="lbl" style="fill: rgb(0,214,162); font-size: 12.5px;">l ← l × exp(m_old − m_new) + Σ exp(x − m_new)</text>
<text x="40" y="76" text-anchor="start" class="mut">chunk</text><text x="100" y="76" text-anchor="start" class="mut">values</text><text x="190" y="76" text-anchor="start" class="mut">max m</text><text x="260" y="76" text-anchor="start" class="mut">running sum l</text><text x="470" y="76" text-anchor="start" class="mut">what happened</text><rect x="30" y="88" width="620" height="32" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><rect x="30" y="88" width="5" height="32" fill="rgb(48,148,255)"/><text x="44" y="104" text-anchor="start" class="lbl">1</text><text x="100" y="104" text-anchor="start" class="lbl">1, 3</text><text x="190" y="104" text-anchor="start" class="lbl">3</text><text x="260" y="104" text-anchor="start" class="lbl">e⁻² + e⁰ = 1.135</text><text x="470" y="104" text-anchor="start" class="mut" style="fill: rgb(48,148,255);">first chunk</text>
<rect x="30" y="128" width="620" height="32" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><rect x="30" y="128" width="5" height="32" fill="rgb(255,162,0)"/><text x="44" y="144" text-anchor="start" class="lbl">2</text><text x="100" y="144" text-anchor="start" class="lbl">5</text><text x="190" y="144" text-anchor="start" class="lbl">5</text><text x="260" y="144" text-anchor="start" class="lbl">1.135 × e⁻² + e⁰ = 1.154</text><text x="470" y="144" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">max grew: old sum rescaled</text>
<rect x="30" y="168" width="620" height="32" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><rect x="30" y="168" width="5" height="32" fill="rgb(0,214,162)"/><text x="44" y="184" text-anchor="start" class="lbl">3</text><text x="100" y="184" text-anchor="start" class="lbl">2, 4</text><text x="190" y="184" text-anchor="start" class="lbl">5</text><text x="260" y="184" text-anchor="start" class="lbl">1.154 + e⁻³ + e⁻¹ = 1.571</text><text x="470" y="184" text-anchor="start" class="mut" style="fill: rgb(0,214,162);">max unchanged: just add</text>
<text x="340" y="228" text-anchor="middle" class="lbl">softmax(xᵢ) = exp(xᵢ − 5) / 1.571: exactly what three separate passes would give.</text>
<text x="340" y="250" text-anchor="middle" class="mut">FlashAttention applies the same rescaling to a whole block of attention outputs, tile by tile.</text>
</svg>
