<svg width="100%" viewBox="0 0 680 266" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Hopper thread block clusters: blocks that can reach each other’s shared memory</text>
<rect x="30" y="76" width="620" height="138" rx="3" fill="rgba(48,148,255,0.05)" stroke="rgba(48,148,255,0.45)" stroke-width="1" /><text x="46" y="207" text-anchor="start" class="mut">one GPC: the cluster is guaranteed to be co-scheduled here</text>
<rect x="50" y="104" width="130" height="96" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="115" y="118" text-anchor="middle" class="h">SM 0: block 0</text><rect x="65" y="136" width="100" height="46" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="115" y="152" text-anchor="middle" class="n">shared memory</text><text x="115" y="168" text-anchor="middle" class="mut">(DSMEM visible)</text><rect x="200" y="104" width="130" height="96" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="265" y="118" text-anchor="middle" class="h">SM 1: block 1</text><rect x="215" y="136" width="100" height="46" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="265" y="152" text-anchor="middle" class="n">shared memory</text><text x="265" y="168" text-anchor="middle" class="mut">(DSMEM visible)</text><rect x="350" y="104" width="130" height="96" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="415" y="118" text-anchor="middle" class="h">SM 2: block 2</text><rect x="365" y="136" width="100" height="46" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="415" y="152" text-anchor="middle" class="n">shared memory</text><text x="415" y="168" text-anchor="middle" class="mut">(DSMEM visible)</text><rect x="500" y="104" width="130" height="96" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="565" y="118" text-anchor="middle" class="h">SM 3: block 3</text><rect x="515" y="136" width="100" height="46" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="565" y="152" text-anchor="middle" class="n">shared memory</text><text x="565" y="168" text-anchor="middle" class="mut">(DSMEM visible)</text><line x1="165" y1="159" x2="215" y2="159" stroke="rgba(0,214,162,0.8)" stroke-width="2" stroke-dasharray="5 3"/><line x1="315" y1="159" x2="365" y2="159" stroke="rgba(0,214,162,0.8)" stroke-width="2" stroke-dasharray="5 3"/><line x1="465" y1="159" x2="515" y2="159" stroke="rgba(0,214,162,0.8)" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="250" y="36" width="180" height="28" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="340" y="50" text-anchor="middle" class="n">one TMA load (multicast)</text><line x1="340" y1="64" x2="122.6" y2="131.6" stroke="rgba(255,162,0,0.65)" stroke-width="1.2" /><polygon points="115,134 124.0,135.9 121.3,127.3" fill="rgba(255,162,0,0.65)"/><line x1="340" y1="64" x2="270.8" y2="128.5" stroke="rgba(255,162,0,0.65)" stroke-width="1.2" /><polygon points="265,134 273.9,131.8 267.8,125.3" fill="rgba(255,162,0,0.65)"/><line x1="340" y1="64" x2="409.2" y2="128.5" stroke="rgba(255,162,0,0.65)" stroke-width="1.2" /><polygon points="415,134 412.2,125.3 406.1,131.8" fill="rgba(255,162,0,0.65)"/><line x1="340" y1="64" x2="557.4" y2="131.6" stroke="rgba(255,162,0,0.65)" stroke-width="1.2" /><polygon points="565,134 558.7,127.3 556.0,135.9" fill="rgba(255,162,0,0.65)"/>
<text x="340" y="236" text-anchor="middle" class="lbl">Dashed links: a block can read and write its neighbours’ shared memory directly.</text>
<text x="340" y="254" text-anchor="middle" class="mut">Multicast: one tile fetched from memory once, delivered to every block in the cluster.</text>
</svg>
