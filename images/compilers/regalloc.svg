<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Register allocation for the scalar loop: SSA values become x86 registers</text>
<text x="190" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">test n</text><text x="230" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">jle</text><text x="270" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">movl n</text><text x="310" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">xor i</text><text x="350" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">xor s</text><text x="390" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">load a[i]</text><text x="430" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">imul</text><text x="470" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">add s</text><text x="510" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">inc i</text><text x="550" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">cmp</text><text x="590" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">jne</text><text x="630" y="46" text-anchor="middle" class="mut" style="font-size: 8.5px;">ret</text><text x="30" y="72" text-anchor="start" class="lbl">a (pointer)</text><rect x="172" y="60" width="436" height="24" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="180" y="72" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">rcx</text><text x="30" y="106" text-anchor="start" class="lbl">n</text><rect x="172" y="94" width="396" height="24" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="180" y="106" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">edx / rdx</text><text x="30" y="140" text-anchor="start" class="lbl">i</text><rect x="292" y="128" width="316" height="24" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)"/><text x="300" y="140" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">r8</text><text x="30" y="174" text-anchor="start" class="lbl">s</text><rect x="332" y="162" width="316" height="24" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="340" y="174" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">eax</text><text x="30" y="208" text-anchor="start" class="lbl">a[i], then a[i]²</text><rect x="372" y="196" width="116" height="24" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)"/><text x="380" y="208" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">r9d</text><rect x="370" y="54" width="240" height="176" rx="4" fill="none" stroke="rgba(255,162,0,0.5)" stroke-dasharray="4 3"/><text x="490" y="242" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">the loop body</text><text x="340" y="270" text-anchor="middle" class="lbl">Each bar is a live range: from where a value is defined to its last use.</text>
<text x="340" y="288" text-anchor="middle" class="mut">Overlapping bars must get different registers. Here five values fit easily into x86’s sixteen,</text>
<text x="340" y="306" text-anchor="middle" class="mut">so nothing spills to memory; a[i] even reuses one register for its square.</text>
</svg>
