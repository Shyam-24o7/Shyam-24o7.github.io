<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">y = relu(x · a + b) on 100 million floats, on an H100</text>
<text x="30" y="52" text-anchor="start" class="h" style="fill: rgb(255,110,110);">eager: three kernels</text><text x="150" y="75" text-anchor="end" class="mut">kernel 1: x · a</text><rect x="160" y="64" width="72.33333333333334" height="22" rx="2" fill="rgba(48,148,255,0.5)"/><text x="196.66666666666669" y="75" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">read 0.4</text><rect x="233.33333333333334" y="64" width="72.33333333333334" height="22" rx="2" fill="rgba(255,162,0,0.5)"/><text x="270" y="75" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">write 0.4</text><text x="150" y="105" text-anchor="end" class="mut">kernel 2: + b</text><rect x="306.6666666666667" y="94" width="72.33333333333337" height="22" rx="2" fill="rgba(48,148,255,0.5)"/><text x="343.33333333333337" y="105" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">read 0.4</text><rect x="380.00000000000006" y="94" width="72.33333333333331" height="22" rx="2" fill="rgba(255,162,0,0.5)"/><text x="416.66666666666674" y="105" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">write 0.4</text><text x="150" y="135" text-anchor="end" class="mut">kernel 3: relu</text><rect x="453.33333333333337" y="124" width="72.33333333333337" height="22" rx="2" fill="rgba(48,148,255,0.5)"/><text x="490.00000000000006" y="135" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">read 0.4</text><rect x="526.6666666666667" y="124" width="72.33333333333337" height="22" rx="2" fill="rgba(255,162,0,0.5)"/><text x="563.3333333333335" y="135" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">write 0.4</text><text x="606" y="105" text-anchor="start" class="h">2.4 GB</text><text x="30" y="172" text-anchor="start" class="h" style="fill: rgb(0,214,162);">compiled: one fused kernel</text><text x="150" y="195" text-anchor="end" class="mut">fused kernel</text><rect x="160" y="184" width="72.33333333333334" height="22" rx="2" fill="rgba(48,148,255,0.5)"/><text x="196.66666666666669" y="195" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">read 0.4</text><rect x="233.33333333333334" y="184" width="72.33333333333334" height="22" rx="2" fill="rgba(255,162,0,0.5)"/><text x="270" y="195" text-anchor="middle" class="mut" style="font-size: 9px; fill: #e8f0ff;">write 0.4</text><text x="312.6666666666667" y="195" text-anchor="start" class="h">0.8 GB</text><line x1="160" y1="222" x2="600" y2="222" stroke="rgba(222,220,209,0.45)" stroke-width="1" /><text x="160" y="234" text-anchor="middle" class="mut">0 GB</text><text x="306.6666666666667" y="234" text-anchor="middle" class="mut">0.8 GB</text><text x="453.33333333333337" y="234" text-anchor="middle" class="mut">1.6 GB</text><text x="600" y="234" text-anchor="middle" class="mut">2.4 GB</text><text x="30" y="256" text-anchor="start" class="mut"></text><text x="150" y="256" text-anchor="start" class="mut">bytes moved</text><text x="270" y="256" text-anchor="start" class="mut">time at 3.35 TB/s</text><text x="400" y="256" text-anchor="start" class="mut">extra memory</text><text x="560" y="256" text-anchor="start" class="mut">kernel launches</text><text x="30" y="278" text-anchor="start" class="h">eager</text><text x="150" y="278" text-anchor="start" class="lbl">2.4 GB</text><text x="270" y="278" text-anchor="start" class="lbl">0.72 ms</text><text x="400" y="278" text-anchor="start" class="lbl">0.8 GB of temporaries</text><text x="560" y="278" text-anchor="start" class="lbl">3</text><text x="30" y="300" text-anchor="start" class="h">fused</text><text x="150" y="300" text-anchor="start" class="lbl" style="fill: rgb(0,214,162);">0.8 GB</text><text x="270" y="300" text-anchor="start" class="lbl" style="fill: rgb(0,214,162);">0.24 ms</text><text x="400" y="300" text-anchor="start" class="lbl" style="fill: rgb(0,214,162);">none</text><text x="560" y="300" text-anchor="start" class="lbl" style="fill: rgb(0,214,162);">1</text><text x="340" y="336" text-anchor="middle" class="mut">The maths is identical: 3 FLOPs per element either way. Only the memory traffic changed, and it sets the time.</text>
</svg>
