<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What the optimiser did to square_sum (clang 21)</text>
<rect x="16" y="44" width="208" height="200" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="1" /><text x="120" y="62" text-anchor="middle" class="h">-O0</text><text x="120" y="80" text-anchor="middle" class="mut" style="fill: rgb(255,110,110);">straight translation</text><text x="120" y="110" text-anchor="middle" class="mut" style="font-size: 10px;">every variable is a memory slot</text><text x="120" y="140" text-anchor="middle" class="mut" style="font-size: 10px;">(alloca, load, store)</text><text x="120" y="170" text-anchor="middle" class="mut" style="font-size: 10px;">a[i] loaded twice per iteration</text><text x="120" y="200" text-anchor="middle" class="mut" style="font-size: 10px;">~25 instructions per loop trip</text><line x1="225" y1="144" x2="227.0" y2="144.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="235,144 227.0,139.5 227.0,148.5" fill="rgba(200,210,230,0.55)"/><rect x="236" y="44" width="208" height="200" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="340" y="62" text-anchor="middle" class="h">-O1</text><text x="340" y="80" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">into SSA, then tidy</text><text x="340" y="110" text-anchor="middle" class="mut" style="font-size: 10px;">variables become registers (phi)</text><text x="340" y="140" text-anchor="middle" class="mut" style="font-size: 10px;">a[i] loaded once (CSE)</text><text x="340" y="170" text-anchor="middle" class="mut" style="font-size: 10px;">loop counter widened to 64-bit</text><text x="340" y="200" text-anchor="middle" class="mut" style="font-size: 10px;">7 instructions per loop trip</text><line x1="445" y1="144" x2="447.0" y2="144.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="455,144 447.0,139.5 447.0,148.5" fill="rgba(200,210,230,0.55)"/><rect x="456" y="44" width="208" height="200" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="560" y="62" text-anchor="middle" class="h">-O3 (AVX2)</text><text x="560" y="80" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">vectorised</text><text x="560" y="110" text-anchor="middle" class="mut" style="font-size: 10px;">&lt;8 x i32&gt;: 8 integers per op</text><text x="560" y="140" text-anchor="middle" class="mut" style="font-size: 10px;">4 independent accumulators</text><text x="560" y="170" text-anchor="middle" class="mut" style="font-size: 10px;">32 elements per loop trip</text><text x="560" y="200" text-anchor="middle" class="mut" style="font-size: 10px;">vpmulld / vpaddd on ymm registers</text><text x="340" y="268" text-anchor="middle" class="lbl">Same meaning at every stage. Every change is one of a few dozen passes, each one small and checkable.</text>
<text x="340" y="286" text-anchor="middle" class="mut">The four accumulators are the ILP trick from the CUDA post, applied automatically.</text>
</svg>
