<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Progressive lowering: lose high-level meaning as late as possible</text>
<rect x="20" y="44" width="640" height="46" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="34" y="59" text-anchor="start" class="h">tensor / linalg</text><text x="34" y="77" text-anchor="start" class="mut" style="font-size: 9.5px;">knows it is a matmul: can tile it, fuse it, pick tensor cores</text><text x="646" y="59" text-anchor="end" class="mut" style="font-family: monospace; font-size: 9.5px;">linalg.matmul(A, B) → C</text><rect x="40" y="102" width="600" height="46" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="54" y="117" text-anchor="start" class="h">loops on buffers (scf, memref)</text><text x="54" y="135" text-anchor="start" class="mut" style="font-size: 9.5px;">knows loop structure and memory, not "matmul"</text><text x="626" y="117" text-anchor="end" class="mut" style="font-family: monospace; font-size: 9.5px;">for i, j, k: C[i,j] += A[i,k] · B[k,j]</text><rect x="60" y="160" width="560" height="46" rx="3" fill="rgb(6,48,58)" stroke="rgb(80,210,230)" stroke-width="1" /><text x="74" y="175" text-anchor="start" class="h">vector</text><text x="74" y="193" text-anchor="start" class="mut" style="font-size: 9.5px;">knows SIMD shapes, not loops</text><text x="606" y="175" text-anchor="end" class="mut" style="font-family: monospace; font-size: 9.5px;">vector.contract on 8×8 tiles</text><rect x="80" y="218" width="520" height="46" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="94" y="233" text-anchor="start" class="h">LLVM IR</text><text x="94" y="251" text-anchor="start" class="mut" style="font-size: 9.5px;">knows scalars and vectors only</text><text x="586" y="233" text-anchor="end" class="mut" style="font-family: monospace; font-size: 9.5px;">fmul, fadd, load &lt;8 x float&gt;</text><rect x="100" y="276" width="480" height="46" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="114" y="291" text-anchor="start" class="h">machine code</text><text x="114" y="309" text-anchor="start" class="mut" style="font-size: 9.5px;">knows registers and instructions</text><text x="566" y="291" text-anchor="end" class="mut" style="font-family: monospace; font-size: 9.5px;">PTX → SASS, or x86</text><text x="340" y="344" text-anchor="middle" class="lbl">Each MLIR dialect is one level. A matmul stays a matmul until every optimisation that needs to know that has run.</text>
<text x="340" y="362" text-anchor="middle" class="mut">Plain LLVM starts at the fourth level, which is why it cannot fuse or tile a matmul on its own.</text>
</svg>
