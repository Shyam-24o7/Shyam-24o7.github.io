<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One atomic store, four memory scopes: what the backend emits on MI300 vs NVIDIA</text>
<text x="30" y="48" text-anchor="start" class="mut">scope</text><text x="170" y="48" text-anchor="start" class="mut">who must see the write</text><text x="370" y="48" text-anchor="start" class="mut">AMD gfx942 (MI300)</text><text x="560" y="48" text-anchor="start" class="mut">NVIDIA PTX</text><rect x="20" y="60" width="640" height="38" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="30" y="79" text-anchor="start" class="h">workgroup</text><text x="170" y="79" text-anchor="start" class="mut">same CU, shared L1</text><text x="370" y="79" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">store, wait</text><text x="560" y="79" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">st.release.cta</text><rect x="20" y="106" width="640" height="38" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="30" y="125" text-anchor="start" class="h">agent (device)</text><text x="170" y="125" text-anchor="start" class="mut">other CUs, other L2s on the chip</text><text x="370" y="125" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">buffer_wbl2 sc1 + store sc1</text><text x="560" y="125" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">st.release.gpu</text><rect x="20" y="152" width="640" height="38" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="30" y="171" text-anchor="start" class="h">system</text><text x="170" y="171" text-anchor="start" class="mut">other GPUs and the CPU</text><text x="370" y="171" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">buffer_wbl2 sc0 sc1 + store</text><text x="560" y="171" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">st.release.sys</text><rect x="20" y="198" width="640" height="38" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="30" y="217" text-anchor="start" class="h">acquire, agent</text><text x="170" y="217" text-anchor="start" class="mut">reader on another CU</text><text x="370" y="217" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">load sc1 + buffer_inv sc1</text><text x="560" y="217" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">ld.acquire.gpu</text><text x="340" y="262" text-anchor="middle" class="lbl">MI300X splits its compute across chiplets, each with its own L2. A wider scope means flushing more caches,</text>
<text x="340" y="280" text-anchor="middle" class="lbl">so the backend picks the cheapest instructions that are still correct for exactly that scope.</text>
<text x="340" y="304" text-anchor="middle" class="mut">PTX names the scope in the instruction and leaves the cache work to ptxas and the hardware.</text>
<text x="340" y="322" text-anchor="middle" class="mut" style="fill: rgb(255,110,110);">Get this wrong and the program works on one chip and silently corrupts data on another.</text>
<text x="340" y="350" text-anchor="middle" class="mut" style="font-size: 9.5px;">Real output from clang 21: the same LLVM IR compiled for gfx942 and for sm_89.</text>
</svg>
