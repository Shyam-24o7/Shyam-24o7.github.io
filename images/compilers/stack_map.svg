<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">The whole map: from a PyTorch model to SASS</text>
<rect x="10" y="38" width="660" height="210" rx="6" fill="rgba(170,130,255,0.06)"/><text x="660" y="50" text-anchor="end" class="mut" style="letter-spacing: 1.5px; font-weight: 600; font-size: 9.5px;">THE AI COMPILER (TENSOR LEVEL)</text><rect x="10" y="256" width="660" height="150" rx="6" fill="rgba(48,148,255,0.06)"/><text x="660" y="268" text-anchor="end" class="mut" style="letter-spacing: 1.5px; font-weight: 600; font-size: 9.5px;">KERNEL COMPILERS (TILE LEVEL)</text><rect x="10" y="414" width="660" height="136" rx="6" fill="rgba(0,214,162,0.06)"/><text x="660" y="426" text-anchor="end" class="mut" style="letter-spacing: 1.5px; font-weight: 600; font-size: 9.5px;">THE CLASSIC COMPILER AND THE VENDOR TOOLCHAIN</text><rect x="140" y="58" width="220" height="30" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="250" y="73" text-anchor="middle" class="n">your PyTorch model</text><line x1="250" y1="89" x2="250.0" y2="93.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="250,101 254.5,93.0 245.5,93.0" fill="rgba(200,210,230,0.55)"/><rect x="140" y="102" width="220" height="36" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="250" y="113" text-anchor="middle" class="n">TorchDynamo</text><text x="250" y="128" text-anchor="middle" class="mut" style="font-size: 9.5px;">captures an FX graph from Python bytecode</text><line x1="250" y1="139" x2="250.0" y2="143.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="250,151 254.5,143.0 245.5,143.0" fill="rgba(200,210,230,0.55)"/><rect x="140" y="152" width="220" height="36" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="250" y="163" text-anchor="middle" class="n">AOTAutograd</text><text x="250" y="178" text-anchor="middle" class="mut" style="font-size: 9.5px;">adds the backward graph, decomposes ops</text><line x1="250" y1="189" x2="250.0" y2="193.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="250,201 254.5,193.0 245.5,193.0" fill="rgba(200,210,230,0.55)"/><rect x="140" y="202" width="220" height="36" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="250" y="213" text-anchor="middle" class="n">TorchInductor</text><text x="250" y="228" text-anchor="middle" class="mut" style="font-size: 9.5px;">fusion, memory planning, scheduling</text><line x1="190" y1="239" x2="146.7" y2="267.6" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="140,272 149.2,271.3 144.2,263.8" fill="rgba(200,210,230,0.55)"/><line x1="310" y1="239" x2="432.3" y2="271.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="440,273 433.4,266.6 431.1,275.3" fill="rgba(200,210,230,0.55)"/><rect x="70" y="274" width="200" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="170" y="285" text-anchor="middle" class="n">generated Triton kernels</text><text x="170" y="300" text-anchor="middle" class="mut" style="font-size: 9.5px;">the fused elementwise work</text><rect x="420" y="274" width="200" height="36" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="520" y="285" text-anchor="middle" class="n">library calls</text><text x="520" y="300" text-anchor="middle" class="mut" style="font-size: 9.5px;">cuBLAS, cuDNN, CUTLASS</text><line x1="170" y1="311" x2="170.0" y2="315.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="170,323 174.5,315.0 165.5,315.0" fill="rgba(200,210,230,0.55)"/><rect x="70" y="324" width="200" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="170" y="335" text-anchor="middle" class="n">Triton compiler (MLIR)</text><text x="170" y="350" text-anchor="middle" class="mut" style="font-size: 9.5px;">TTIR → TTGIR: layouts, pipelining</text><rect x="420" y="324" width="200" height="36" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="520" y="335" text-anchor="middle" class="n">hand-written CUDA</text><text x="520" y="350" text-anchor="middle" class="mut" style="font-size: 9.5px;">FlashAttention, custom ops</text><line x1="170" y1="361" x2="170.0" y2="365.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="170,373 174.5,365.0 165.5,365.0" fill="rgba(200,210,230,0.55)"/><line x1="520" y1="361" x2="520.0" y2="365.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="520,373 524.5,365.0 515.5,365.0" fill="rgba(200,210,230,0.55)"/><rect x="70" y="374" width="200" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="170" y="387" text-anchor="middle" class="n">LLVM IR</text><rect x="420" y="374" width="200" height="26" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="520" y="387" text-anchor="middle" class="n">nvcc front end</text><line x1="170" y1="401" x2="282.3" y2="431.9" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="290,434 283.5,427.5 281.1,436.2" fill="rgba(200,210,230,0.55)"/><line x1="520" y1="401" x2="407.7" y2="431.9" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="400,434 408.9,436.2 406.5,427.5" fill="rgba(200,210,230,0.55)"/><rect x="250" y="436" width="190" height="36" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="345" y="447" text-anchor="middle" class="n">LLVM NVPTX / NVVM</text><text x="345" y="462" text-anchor="middle" class="mut" style="font-size: 9.5px;">LLVM IR → PTX</text><line x1="345" y1="473" x2="345.0" y2="477.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="345,485 349.5,477.0 340.5,477.0" fill="rgba(200,210,230,0.55)"/><rect x="250" y="486" width="190" height="26" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="345" y="499" text-anchor="middle" class="n">ptxas: PTX → SASS</text><line x1="345" y1="513" x2="345.0" y2="517.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="345,525 349.5,517.0 340.5,517.0" fill="rgba(200,210,230,0.55)"/><rect x="250" y="526" width="190" height="20" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="345" y="536" text-anchor="middle" class="n">runs on the SMs</text><text x="470" y="120" text-anchor="start" class="mut">the graph and the shapes</text><text x="470" y="134" text-anchor="start" class="mut">are known here: this is</text><text x="470" y="148" text-anchor="start" class="mut">where fusion happens</text><text x="470" y="200" text-anchor="start" class="mut">on CPU, Inductor writes</text><text x="470" y="214" text-anchor="start" class="mut">C++ and OpenMP instead</text></svg>
