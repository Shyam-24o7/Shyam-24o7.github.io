<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Why release and acquire exist: passing a message through caches</text>
<rect x="16" y="40" width="316" height="230" rx="3" fill="#12131c" stroke="rgba(255,110,110,0.5)" stroke-width="1" /><rect x="348" y="40" width="316" height="230" rx="3" fill="#12131c" stroke="rgba(0,214,162,0.5)" stroke-width="1" /><text x="174" y="58" text-anchor="middle" class="h" style="fill: rgb(255,110,110);">plain stores: can go wrong</text><text x="506" y="58" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">release + acquire: correct</text><rect x="28" y="72" width="130" height="92" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="93" y="86" text-anchor="middle" class="h" style="font-size: 10.5px;">chiplet A (writer)</text><text x="38" y="106" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">1. data = 42</text><text x="38" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(0,214,162);"></text><text x="38" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">2. flag = 1</text><rect x="180" y="72" width="130" height="92" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="245" y="86" text-anchor="middle" class="h" style="font-size: 10.5px;">chiplet B (reader)</text><text x="190" y="106" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">1. see flag == 1</text><text x="190" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(0,214,162);"></text><text x="190" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(255,110,110);">2. read data → 0 ?</text><rect x="28" y="180" width="130" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="93" y="193" text-anchor="middle" class="mut">A’s L2 cache</text><rect x="180" y="180" width="130" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="245" y="193" text-anchor="middle" class="mut">B’s L2 cache</text><rect x="28" y="222" width="282" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="169" y="235" text-anchor="middle" class="mut">HBM (shared by both)</text><rect x="360" y="72" width="130" height="92" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="425" y="86" text-anchor="middle" class="h" style="font-size: 10.5px;">chiplet A (writer)</text><text x="370" y="106" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">1. data = 42</text><text x="370" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(0,214,162);">2. write back L2</text><text x="370" y="142" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">3. flag = 1 (release)</text><rect x="512" y="72" width="130" height="92" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="577" y="86" text-anchor="middle" class="h" style="font-size: 10.5px;">chiplet B (reader)</text><text x="522" y="106" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">1. see flag (acquire)</text><text x="522" y="124" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(0,214,162);">2. invalidate L2</text><text x="522" y="142" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">3. read data → 42</text><rect x="360" y="180" width="130" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="425" y="193" text-anchor="middle" class="mut">A’s L2 cache</text><rect x="512" y="180" width="130" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="577" y="193" text-anchor="middle" class="mut">B’s L2 cache</text><rect x="360" y="222" width="282" height="26" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="501" y="235" text-anchor="middle" class="mut">HBM (shared by both)</text><text x="174" y="260" text-anchor="middle" class="mut" style="fill: rgb(255,110,110); font-size: 9.5px;">the flag reached B, the data is still in A’s L2</text><text x="506" y="260" text-anchor="middle" class="mut" style="fill: rgb(0,214,162); font-size: 9.5px;">the data is visible before the flag can be</text><text x="340" y="296" text-anchor="middle" class="lbl">Release: everything I wrote before this store is visible before the store itself.</text>
<text x="340" y="314" text-anchor="middle" class="lbl">Acquire: nothing I read after this load can see older values than the load saw.</text>
<text x="340" y="340" text-anchor="middle" class="mut">The scope says who “everyone” is. On MI300, a wider scope means more caches to write back and invalidate.</text>
</svg>
