<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">square_sum at -O1 as a control-flow graph in SSA form</text>
<rect x="40" y="46" width="250" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="52" y="60" text-anchor="start" class="h">entry</text><text x="52" y="78" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">%3 = icmp sgt i32 %n, 0</text><text x="52" y="94" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">br %3, loop.pre, exit</text><rect x="40" y="140" width="250" height="50" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="52" y="154" text-anchor="start" class="h">loop.pre (runs once)</text><text x="52" y="174" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">%5 = zext %n to i64</text><rect x="40" y="222" width="300" height="120" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="52" y="236" text-anchor="start" class="h">loop (runs n times)</text><text x="52" y="256" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(255,162,0);">%i = phi [0, loop.pre], [%i.next, loop]</text><text x="52" y="270" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(255,162,0);">%s = phi [0, loop.pre], [%s.next, loop]</text><text x="52" y="284" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">%v = load a[%i]</text><text x="52" y="298" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">%s.next = %s + %v * %v</text><text x="52" y="312" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">%i.next = %i + 1</text><text x="52" y="326" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">br (%i.next == %5), exit, loop</text><rect x="420" y="222" width="230" height="70" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="432" y="236" text-anchor="start" class="h">exit</text><text x="432" y="256" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(255,162,0);">%r = phi [0, entry],</text><text x="432" y="270" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px; fill: rgb(255,162,0);">         [%s.next, loop]</text><text x="432" y="284" text-anchor="start" class="n" style="font-family: monospace; font-size: 9.5px;">ret %r</text><line x1="165" y1="109" x2="165.0" y2="130.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="165,138 169.5,130.0 160.5,130.0" fill="rgba(200,210,230,0.55)"/><line x1="165" y1="191" x2="165.0" y2="212.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="165,220 169.5,212.0 160.5,212.0" fill="rgba(200,210,230,0.55)"/><path d="M290 77 L520 77 L520 220" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" fill="none"/><polygon points="515,212 520,221 525,212" fill="rgba(200,210,230,0.55)"/><text x="530" y="120" text-anchor="start" class="mut">n ≤ 0: skip the loop</text><path d="M340 300 L375 300 L375 222 L340 240" stroke="rgba(255,162,0,0.7)" stroke-width="1.2" fill="none"/><polygon points="348,232 339,241 350,244" fill="rgba(255,162,0,0.7)"/><text x="380" y="205" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">back edge</text><line x1="340" y1="320" x2="411.3" y2="274.3" stroke="rgba(0,214,162,0.7)" stroke-width="1.2" /><polygon points="418,270 408.8,270.5 413.7,278.1" fill="rgba(0,214,162,0.7)"/><text x="340" y="366" text-anchor="middle" class="lbl">Every value is defined exactly once. A phi picks its value according to which edge control arrived on,</text>
<text x="340" y="384" text-anchor="middle" class="mut">which is how a variable that changes every iteration fits a single-assignment rule.</text>
</svg>
