<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What an AI compiler can see that LLVM cannot</text>
<text x="150" y="48" text-anchor="middle" class="h" style="fill: rgb(170,130,255);">AI compiler sees</text><text x="310" y="48" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">LLVM sees</text><text x="520" y="48" text-anchor="middle" class="h">so it can</text><rect x="20" y="62" width="640" height="36" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="150" y="80" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">the whole graph</text><text x="310" y="80" text-anchor="middle" class="mut">one function at a time</text><text x="520" y="80" text-anchor="middle" class="mut" style="font-size: 9.5px;">delete intermediate tensors between ops (fusion)</text><rect x="20" y="106" width="640" height="36" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="150" y="124" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">what each op means</text><text x="310" y="124" text-anchor="middle" class="mut">loads, multiplies, adds</text><text x="520" y="124" text-anchor="middle" class="mut" style="font-size: 9.5px;">map matmul to tensor cores; rewrite softmax stably</text><rect x="20" y="150" width="640" height="36" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="150" y="168" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">tensor shapes</text><text x="310" y="168" text-anchor="middle" class="mut">pointers and loop bounds</text><text x="520" y="168" text-anchor="middle" class="mut" style="font-size: 9.5px;">plan memory, pick tiles and layouts up front</text><rect x="20" y="194" width="640" height="36" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="150" y="212" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">numeric freedom</text><text x="310" y="212" text-anchor="middle" class="mut">strict IEEE by default</text><text x="520" y="212" text-anchor="middle" class="mut" style="font-size: 9.5px;">use BF16/FP8, reorder reductions</text><rect x="20" y="238" width="640" height="36" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="150" y="256" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">the real hardware</text><text x="310" y="256" text-anchor="middle" class="mut">a fixed cost model</text><text x="520" y="256" text-anchor="middle" class="mut" style="font-size: 9.5px;">autotune: run variants, keep the fastest</text><text x="340" y="300" text-anchor="middle" class="lbl">AI compilers sit on top of LLVM, not instead of it: their output still goes through LLVM to reach the GPU.</text>
</svg>
