<text x="340" y="22" text-anchor="middle" class="title">Four ways to spread a model over GPUs</text>
<rect x="16" y="40" width="316" height="124" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="28" y="56" text-anchor="start" class="h">Tensor parallel: split inside every layer</text><text x="28" y="150" text-anchor="start" class="mut">cost: two all-reduces per layer; needs NVLink</text><rect x="40" y="72" width="62" height="10" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="106" y="72" width="62" height="10" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="172" y="72" width="62" height="10" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><rect x="238" y="72" width="62" height="10" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><rect x="40" y="85" width="62" height="10" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="106" y="85" width="62" height="10" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="172" y="85" width="62" height="10" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><rect x="238" y="85" width="62" height="10" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><rect x="40" y="98" width="62" height="10" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="106" y="98" width="62" height="10" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="172" y="98" width="62" height="10" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><rect x="238" y="98" width="62" height="10" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="71" y="120" text-anchor="middle" class="mut">GPU 0</text><text x="137" y="120" text-anchor="middle" class="mut">GPU 1</text><text x="203" y="120" text-anchor="middle" class="mut">GPU 2</text><text x="269" y="120" text-anchor="middle" class="mut">GPU 3</text><rect x="348" y="40" width="316" height="124" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="360" y="56" text-anchor="start" class="h">Pipeline parallel: split the stack of layers</text><text x="360" y="150" text-anchor="start" class="mut">cost: bubbles; no faster for one request</text><rect x="372" y="70" width="26" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="402" y="70" width="26" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="432" y="70" width="26" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="462" y="70" width="26" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="512" y="70" width="26" height="36" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="542" y="70" width="26" height="36" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="572" y="70" width="26" height="36" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="602" y="70" width="26" height="36" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="431" y="120" text-anchor="middle" class="mut">GPU 0: layers 1 to 40</text><text x="571" y="120" text-anchor="middle" class="mut">GPU 1: layers 41 to 80</text><line x1="494" y1="88" x2="502.0" y2="88.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="510,88 502.0,83.5 502.0,92.5" fill="rgba(200,210,230,0.55)"/><rect x="16" y="176" width="316" height="124" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="28" y="192" text-anchor="start" class="h">Data parallel: full copies, split the requests</text><text x="28" y="286" text-anchor="start" class="mut">cost: every copy holds all the weights</text><rect x="40" y="208" width="80" height="40" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="80" y="221" text-anchor="middle" class="n">replica 0</text><text x="80" y="236" text-anchor="middle" class="mut">whole model</text><rect x="132" y="208" width="80" height="40" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="172" y="221" text-anchor="middle" class="n">replica 1</text><text x="172" y="236" text-anchor="middle" class="mut">whole model</text><rect x="224" y="208" width="80" height="40" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="264" y="221" text-anchor="middle" class="n">replica 2</text><text x="264" y="236" text-anchor="middle" class="mut">whole model</text><text x="40" y="264" text-anchor="start" class="mut">each request goes to exactly one replica</text><rect x="348" y="176" width="316" height="124" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="360" y="192" text-anchor="start" class="h">Expert parallel: spread the MoE experts</text><text x="360" y="286" text-anchor="start" class="mut">cost: all-to-all traffic; hot experts</text><rect x="368" y="214" width="56" height="36" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="396" y="226" text-anchor="middle" class="n">router</text><text x="396" y="240" text-anchor="middle" class="mut">top-2</text><rect x="452" y="206" width="46" height="52" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="475" y="217" text-anchor="middle" class="mut">GPU 0</text><text x="475" y="232" text-anchor="middle" class="n">E0</text><text x="475" y="246" text-anchor="middle" class="n">E1</text><rect x="504" y="206" width="46" height="52" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="527" y="217" text-anchor="middle" class="mut">GPU 1</text><text x="527" y="232" text-anchor="middle" class="n">E2</text><text x="527" y="246" text-anchor="middle" class="n">E3</text><rect x="556" y="206" width="46" height="52" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="579" y="217" text-anchor="middle" class="mut">GPU 2</text><text x="579" y="232" text-anchor="middle" class="n">E4</text><text x="579" y="246" text-anchor="middle" class="n">E5</text><rect x="608" y="206" width="46" height="52" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="631" y="217" text-anchor="middle" class="mut">GPU 3</text><text x="631" y="232" text-anchor="middle" class="n">E6</text><text x="631" y="246" text-anchor="middle" class="n">E7</text><line x1="425" y1="226" x2="443.0" y2="226.0" stroke="rgba(255,162,0,0.85)" stroke-width="1.2" /><polygon points="451,226 443.0,221.5 443.0,230.5" fill="rgba(255,162,0,0.85)"/><path d="M396 251 L396 272 L579 272 L579 266" stroke="rgba(255,162,0,0.85)" stroke-width="1.2" fill="none"/><polygon points="574,267 579,259 584,267" fill="rgba(255,162,0,0.85)"/></svg>
