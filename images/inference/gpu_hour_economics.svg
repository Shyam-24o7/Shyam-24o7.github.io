<svg width="100%" viewBox="0 0 680 268" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Same GPU-hour, very different bills</text>
<text x="340" y="42" text-anchor="middle" class="mut">Llama 3 8B decode on one H100 at $3 per GPU-hour, 2K-token contexts</text>
<text x="30" y="64" text-anchor="start" class="mut"></text><text x="150" y="64" text-anchor="start" class="mut">tokens per second</text><text x="320" y="64" text-anchor="start" class="mut">cost per million output tokens</text>
<text x="30" y="89" text-anchor="start" class="h">batch 1</text><text x="150" y="89" text-anchor="start" class="lbl">205</text><rect x="320" y="79" width="260" height="20" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="1" /><text x="588" y="89" text-anchor="start" class="n">$4.07</text>
<text x="30" y="125" text-anchor="start" class="h">batch 8</text><text x="150" y="125" text-anchor="start" class="lbl">1,472</text><rect x="320" y="115" width="36.4127764127764" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="364.4127764127764" y="125" text-anchor="start" class="n">$0.57</text>
<text x="30" y="161" text-anchor="start" class="h">batch 64</text><text x="150" y="161" text-anchor="start" class="lbl">6,450</text><rect x="320" y="151" width="8.304668304668304" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="336.3046683046683" y="161" text-anchor="start" class="n">$0.13</text>
<text x="30" y="197" text-anchor="start" class="h">batch 240</text><text x="150" y="197" text-anchor="start" class="lbl">10,000</text><rect x="320" y="187" width="5.302211302211302" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="333.3022113022113" y="197" text-anchor="start" class="n">$0.083</text>
<text x="340" y="236" text-anchor="middle" class="lbl">The hourly price never changes. Only how many tokens you get out of each hour does.</text>
<text x="340" y="254" text-anchor="middle" class="mut">Bandwidth-only estimates. Real systems land lower, but the shape is the same.</text>
</svg>
