<svg width="100%" viewBox="0 0 680 286" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">KV cache size per token, and per 8K-token sequence (FP16)</text>
<text x="340" y="44" text-anchor="middle" class="lbl" style="fill: rgb(0,214,162);">bytes per token = 2 (K and V) × layers × KV heads × head dim × 2 bytes</text>
<text x="30" y="76" text-anchor="start" class="h">Llama 2 7B</text><text x="30" y="93" text-anchor="start" class="mut">32 layers, 32 KV heads (MHA)</text><rect x="230" y="70" width="250" height="26" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="1" /><text x="488" y="83" text-anchor="start" class="n">512 KiB per token</text><text x="650" y="83" text-anchor="end" class="h" style="fill: rgb(255,110,110);">4 GiB</text><text x="30" y="132" text-anchor="start" class="h">Llama 3 8B</text><text x="30" y="149" text-anchor="start" class="mut">32 layers, 8 KV heads (GQA)</text><rect x="230" y="126" width="62.5" height="26" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="300.5" y="139" text-anchor="start" class="n">128 KiB per token</text><text x="650" y="139" text-anchor="end" class="h" style="fill: rgb(0,214,162);">1 GiB</text><text x="30" y="188" text-anchor="start" class="h">Llama 3 70B</text><text x="30" y="205" text-anchor="start" class="mut">80 layers, 8 KV heads (GQA)</text><rect x="230" y="182" width="156.25" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="394.25" y="195" text-anchor="start" class="n">320 KiB per token</text><text x="650" y="195" text-anchor="end" class="h" style="fill: rgb(48,148,255);">2.5 GiB</text><text x="650" y="58" text-anchor="end" class="mut">per 8K sequence</text>
<text x="340" y="248" text-anchor="middle" class="lbl">Same model size, four times less KV cache: grouped-query attention shares each K and V head.</text>
<text x="340" y="266" text-anchor="middle" class="mut">At 128K context, one Llama 3 70B sequence needs 40 GiB of KV cache on its own.</text>
</svg>
