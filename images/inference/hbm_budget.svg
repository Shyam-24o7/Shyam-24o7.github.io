<svg width="100%" viewBox="0 0 680 272" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">An 80 GB H100 serving Llama 3 8B (FP16): where the memory goes</text>
<rect x="40" y="52" width="113.9240506329114" height="34" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="96.96202531645571" y="69" text-anchor="middle" class="n">weights 15 GiB</text><rect x="153.92405063291142" y="52" width="30.379746835443036" height="34" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="169.11392405063293" y="69" text-anchor="middle" class="n"></text><rect x="184.30379746835445" y="52" width="455.6962025316456" height="34" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="412.1518987341773" y="69" text-anchor="middle" class="n">KV cache ≈ 60 GiB</text><text x="169.11392405063293" y="100" text-anchor="middle" class="mut">~4 GiB workspace</text><text x="40" y="100" text-anchor="start" class="mut">0</text><text x="640" y="100" text-anchor="end" class="mut">≈ 79 GiB usable on an “80 GB” card</text>
<text x="340" y="128" text-anchor="middle" class="h">How many sequences that KV budget holds</text>
<text x="150" y="154" text-anchor="end" class="lbl">2K tokens (0.25 GiB each)</text><rect x="160" y="145" width="330" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="498" y="154" text-anchor="start" class="n">about 240 sequences</text><text x="150" y="180" text-anchor="end" class="lbl">8K tokens (1 GiB each)</text><rect x="160" y="171" width="82.5" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="250.5" y="180" text-anchor="start" class="n">about 60 sequences</text><text x="150" y="206" text-anchor="end" class="lbl">32K tokens (4 GiB each)</text><rect x="160" y="197" width="20.625" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="188.625" y="206" text-anchor="start" class="n">about 15 sequences</text><text x="150" y="232" text-anchor="end" class="lbl">128K tokens (16 GiB each)</text><rect x="160" y="223" width="4.125" height="18" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="172.125" y="232" text-anchor="start" class="n">about 3 sequences</text>
<text x="340" y="256" text-anchor="middle" class="mut">Long contexts eat the batch: and the batch is what makes decode efficient.</text>
</svg>
