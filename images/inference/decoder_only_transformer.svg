<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<defs>
  <linearGradient id="gline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(0,214,162)"/><stop offset="0.5" stop-color="rgb(48,148,255)"/><stop offset="1" stop-color="rgb(170,130,255)"/></linearGradient>
  <linearGradient id="gcard" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(48,148,255,0.10)"/><stop offset="1" stop-color="rgba(48,148,255,0)"/></linearGradient>
  <linearGradient id="ghere" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(0,214,162,0.28)"/><stop offset="1" stop-color="rgba(0,214,162,0.02)"/></linearGradient>
  <linearGradient id="gblk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(22,52,92)"/><stop offset="1" stop-color="rgb(10,30,58)"/></linearGradient>
  <linearGradient id="gattn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(54,30,86)"/><stop offset="1" stop-color="rgb(30,16,52)"/></linearGradient>
  <linearGradient id="gmlp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(6,70,56)"/><stop offset="1" stop-color="rgb(4,40,32)"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="24" text-anchor="middle" class="title">Inside a decoder-only transformer (Llama 3 8B)</text>
<text x="150" y="70" text-anchor="middle" class="h" style="fill: rgba(200,210,230,0.7); letter-spacing: 1px;">the whole model</text><text x="150" y="88" text-anchor="middle" class="mut">8.03 billion parameters, 16 GB in BF16</text><text x="150" y="106" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">read in full for every decode step</text><rect x="50" y="130" width="200" height="36" rx="8" fill="rgba(0,214,162,0.14)" stroke="rgb(0,214,162)" stroke-width="1.2"/><text x="150" y="148" text-anchor="middle" class="n">sample: “Paris”</text><line x1="150" y1="195" x2="150.0" y2="178.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="150,170 145.5,178.0 154.5,178.0" fill="rgba(200,210,230,0.55)"/><rect x="50" y="196" width="200" height="40" rx="8" fill="rgba(255,162,0,0.10)" stroke="rgb(255,162,0)" stroke-width="1.2"/><text x="150" y="209" text-anchor="middle" class="n">final norm + LM head</text><text x="150" y="224" text-anchor="middle" class="mut">4,096 → 128K scores</text><line x1="150" y1="268" x2="150.0" y2="248.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="150,240 145.5,248.0 154.5,248.0" fill="rgba(200,210,230,0.55)"/><rect x="78" y="252" width="192" height="54" rx="8" fill="url(#gblk)" stroke="rgba(48,148,255,0.2)" stroke-width="1.2"/><rect x="72" y="258" width="192" height="54" rx="8" fill="url(#gblk)" stroke="rgba(48,148,255,0.30000000000000004)" stroke-width="1.2"/><rect x="66" y="264" width="192" height="54" rx="8" fill="url(#gblk)" stroke="rgba(48,148,255,0.4)" stroke-width="1.2"/><rect x="60" y="270" width="192" height="54" rx="8" fill="url(#gblk)" stroke="rgba(48,148,255,0.5)" stroke-width="1.2"/><rect x="54" y="276" width="192" height="54" rx="8" fill="url(#gblk)" stroke="rgb(48,148,255)" stroke-width="1.4"/><text x="150" y="295" text-anchor="middle" class="h">transformer block × 32</text><text x="150" y="313" text-anchor="middle" class="mut">same shape, different weights</text><line x1="150" y1="370" x2="150.0" y2="342.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="150,334 145.5,342.0 154.5,342.0" fill="rgba(200,210,230,0.55)"/><rect x="50" y="372" width="200" height="40" rx="8" fill="rgba(48,148,255,0.12)" stroke="rgb(48,148,255)" stroke-width="1.2"/><text x="150" y="385" text-anchor="middle" class="n">token embedding</text><text x="150" y="400" text-anchor="middle" class="mut">128K vocabulary × 4,096</text><line x1="150" y1="444" x2="150.0" y2="424.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="150,416 145.5,424.0 154.5,424.0" fill="rgba(200,210,230,0.55)"/><text x="150" y="456" text-anchor="middle" class="lbl" style="font-style: italic;">“The capital of France is”</text><path d="M250 148 Q 300 148 300 300 Q 300 456 234 456" stroke="rgba(0,214,162,0.6)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><text x="306" y="220" text-anchor="start" class="mut">append,</text><text x="306" y="233" text-anchor="start" class="mut">repeat</text><line x1="246" y1="276" x2="356" y2="54" stroke="rgba(200,210,230,0.22)" stroke-dasharray="3 4"/><line x1="246" y1="330" x2="356" y2="466" stroke="rgba(200,210,230,0.22)" stroke-dasharray="3 4"/>
<rect x="356" y="54" width="300" height="412" rx="12" fill="rgba(48,148,255,0.04)" stroke="rgba(48,148,255,0.5)" stroke-width="1.2"/><text x="372" y="72" text-anchor="start" class="mut" style="letter-spacing: 2px; font-weight: 600; fill: rgb(48,148,255);">ONE BLOCK</text><line x1="396" y1="452" x2="396" y2="88" stroke="rgba(200,210,230,0.45)" stroke-width="2"/><polygon points="391,94 396,84 401,94" fill="rgba(200,210,230,0.45)"/><text x="382" y="270" text-anchor="middle" class="mut" transform="rotate(-90 382 270)">residual stream</text><rect x="426" y="96" width="210" height="112" rx="10" fill="url(#gmlp)" stroke="rgb(0,214,162)" stroke-width="1.2"/><text x="531" y="116" text-anchor="middle" class="h">feed-forward network (MLP)</text><text x="531" y="136" text-anchor="middle" class="mut">SwiGLU: 4,096 → 14,336 → 4,096</text><text x="531" y="152" text-anchor="middle" class="mut">each token on its own</text><rect x="433" y="168" width="196" height="26" rx="13" fill="rgba(0,214,162,0.18)"/><text x="531" y="181" text-anchor="middle" class="n" style="fill: rgb(0,214,162); font-weight: 600;">176M parameters, 81% of the block</text><rect x="426" y="220" width="210" height="22" rx="6" fill="rgba(200,210,230,0.06)" stroke="rgba(200,210,230,0.3)"/><text x="531" y="231" text-anchor="middle" class="mut">RMSNorm</text><circle cx="396" cy="104" r="8" fill="#0b0c14" stroke="rgba(200,210,230,0.7)"/><text x="396" y="104" text-anchor="middle" class="n">+</text><path d="M404 104 L426 104" stroke="rgba(200,210,230,0.45)"/><path d="M396 231 L426 231" stroke="rgba(200,210,230,0.45)"/><rect x="426" y="262" width="210" height="146" rx="10" fill="url(#gattn)" stroke="rgb(170,130,255)" stroke-width="1.2"/><text x="531" y="282" text-anchor="middle" class="h">self-attention (causal)</text><text x="531" y="302" text-anchor="middle" class="mut">32 query heads, 8 key/value heads</text><text x="531" y="318" text-anchor="middle" class="mut">tokens look back at earlier tokens</text><rect x="433" y="330" width="196" height="26" rx="13" fill="rgba(170,130,255,0.18)"/><text x="531" y="343" text-anchor="middle" class="n" style="fill: rgb(170,130,255); font-weight: 600;">42M parameters, 19% of the block</text><rect x="433" y="366" width="196" height="30" rx="6" fill="rgba(255,162,0,0.14)" stroke="rgb(255,162,0)" stroke-dasharray="4 3"/><text x="531" y="381" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">writes K and V into the KV cache</text><rect x="426" y="420" width="210" height="22" rx="6" fill="rgba(200,210,230,0.06)" stroke="rgba(200,210,230,0.3)"/><text x="531" y="431" text-anchor="middle" class="mut">RMSNorm</text><circle cx="396" cy="270" r="8" fill="#0b0c14" stroke="rgba(200,210,230,0.7)"/><text x="396" y="270" text-anchor="middle" class="n">+</text><path d="M404 270 L426 270" stroke="rgba(200,210,230,0.45)"/><path d="M396 431 L426 431" stroke="rgba(200,210,230,0.45)"/>
<text x="340" y="500" text-anchor="middle" class="lbl">Most of the weights live in the MLPs. Attention is where the KV cache comes from.</text>
</svg>
