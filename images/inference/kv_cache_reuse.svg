<text x="170" y="246" text-anchor="middle" class="mut">every step recomputes keys and values</text><text x="170" y="260" text-anchor="middle" class="mut">for the whole prefix: quadratic work</text><text x="510" y="246" text-anchor="middle" class="mut">old K and V are read back from memory;</text><text x="510" y="260" text-anchor="middle" class="mut">only the new token (orange) is computed</text>
<text x="340" y="280" text-anchor="middle" class="lbl">The price of the cache: memory that grows with every token of every sequence.</text>
