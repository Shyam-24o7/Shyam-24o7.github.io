<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One request, two very different phases</text>
<text x="90" y="70" text-anchor="end" class="mut">GPU work</text><rect x="100" y="54" width="150" height="32" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="175" y="70" text-anchor="middle" class="h">prefill</text><rect x="256" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="288" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="320" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="352" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="384" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="416" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="448" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="480" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="512" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="544" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="576" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="608" y="54" width="28" height="32" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="648" y="70" text-anchor="start" class="lbl">...</text>
<text x="175" y="104" text-anchor="middle" class="mut">all 1,000 prompt tokens at once</text><text x="175" y="118" text-anchor="middle" class="mut" style="fill: rgb(48,148,255);">matrix × matrix, compute-bound</text><text x="446" y="104" text-anchor="middle" class="mut">one token per step, hundreds of steps</text><text x="446" y="118" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">matrix × vector, memory-bound</text>
<line x1="100" y1="140" x2="640" y2="140" stroke="rgba(222,220,209,0.45)"/><polygon points="636,135 644,140 636,145" fill="rgba(222,220,209,0.45)"/><text x="640" y="152" text-anchor="end" class="mut">time</text><line x1="250" y1="176" x2="250.0" y2="152.0" stroke="rgba(255,162,0,0.8)" stroke-width="1.2" /><polygon points="250,144 245.5,152.0 254.5,152.0" fill="rgba(255,162,0,0.8)"/><text x="250" y="188" text-anchor="middle" class="lbl" style="fill: rgb(255,162,0);">first token appears</text><text x="340" y="216" text-anchor="middle" class="mut">Prefill decides how long you wait for the first word. Decode decides how fast the rest streams in.</text>
</svg>
