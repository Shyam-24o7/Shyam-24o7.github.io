" /><rect x="244" y="165" width="68.2" height="6" fill="rgb(0,214,162)" opacity="0.8"/><rect x="315.2" y="142" width="70.2" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="316.2" y="165" width="68.2" height="6" fill="rgb(0,214,162)" opacity="0.8"/><rect x="387.4" y="142" width="70.2" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="388.4" y="165" width="68.2" height="6" fill="rgb(0,214,162)" opacity="0.8"/><rect x="459.59999999999997" y="142" width="70.2" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="460.59999999999997" y="165" width="68.2" height="6" fill="rgb(0,214,162)" opacity="0.8"/><rect x="531.8" y="142" width="36" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="569.8" y="142" width="36" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="607.8" y="142" width="36" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="278.1" y="154" text-anchor="middle" class="n">1K</text><text x="350.3" y="154" text-anchor="middle" class="n">1K</text><text x="422.5" y="154" text-anchor="middle" class="n">1K</text><text x="494.7" y="154" text-anchor="middle" class="n">1K</text><text x="386.4" y="187" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">each step: 1,024 prompt tokens + the 64 decode tokens, about 19 ms</text><line x1="90" y1="210" x2="650" y2="210" stroke="rgba(222,220,209,0.45)" stroke-width="1" /><polygon points="646,205 654,210 646,215" fill="rgba(222,220,209,0.45)"/><text x="90" y="222" text-anchor="middle" class="mut">0 ms</text><text x="280" y="222" text-anchor="middle" class="mut">50 ms</text><text x="470" y="222" text-anchor="middle" class="mut">100 ms</text><text x="622" y="222" text-anchor="middle" class="mut">140 ms</text><rect x="160" y="236" width="12" height="10" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="178" y="241" text-anchor="start" class="mut">decode-only step</text><rect x="310" y="236" width="12" height="10" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="328" y="241" text-anchor="start" class="mut">step with prompt tokens (green strip: decodes riding along)</text>
<text x="340" y="266" text-anchor="middle" class="lbl">Same total work, but no step is long enough to make anyone’s stream stutter.</text>
