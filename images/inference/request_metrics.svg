<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">What a user feels: TTFT, inter-token latency and end-to-end latency</text>
<text x="90" y="70" text-anchor="end" class="mut">request</text><rect x="100" y="56" width="50" height="28" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="125" y="70" text-anchor="middle" class="mut">queue</text><rect x="150" y="56" width="110" height="28" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="205" y="70" text-anchor="middle" class="n">prefill</text><rect x="262" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="276" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t1</text><rect x="302" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="316" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t2</text><rect x="336" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="350" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t3</text><rect x="374" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="388" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t4</text><rect x="406" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="420" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t5</text><rect x="448" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="462" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t6</text><rect x="482" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="496" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t7</text><rect x="518" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="532" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t8</text><rect x="554" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="568" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t9</text><rect x="592" y="56" width="28" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="606" y="70" text-anchor="middle" class="n" style="font-size: 9px;">t10</text><line x1="100" y1="98" x2="640" y2="98" stroke="rgba(222,220,209,0.45)"/>
<path d="M100 116 L100 122 L290 122 L290 116" stroke="rgb(255,162,0)" fill="none" stroke-width="1.2"/><text x="195" y="134" text-anchor="middle" class="lbl" style="fill: rgb(255,162,0);">TTFT: time to first token</text><path d="M302 154 L302 160 L336 160 L336 154" stroke="rgb(0,214,162)" fill="none" stroke-width="1.2"/><text x="319" y="172" text-anchor="middle" class="lbl" style="fill: rgb(0,214,162);">one ITL</text><path d="M290 190 L290 196 L620 196 L620 190" stroke="rgb(0,214,162)" fill="none" stroke-width="1.2"/><text x="455" y="208" text-anchor="middle" class="lbl" style="fill: rgb(0,214,162);">TPOT: average time per output token after the first</text><path d="M100 226 L100 232 L620 232 L620 226" stroke="rgb(170,130,255)" fill="none" stroke-width="1.2"/><text x="360" y="244" text-anchor="middle" class="lbl" style="fill: rgb(170,130,255);">end-to-end latency = TTFT + TPOT × (tokens − 1)</text>
<text x="340" y="258" text-anchor="middle" class="mut">Throughput counts tokens per second across all users; goodput counts only requests that met their latency targets.</text>
</svg>
