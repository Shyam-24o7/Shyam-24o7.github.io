<svg width="100%" viewBox="0 0 680 214" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Tokens at Scale: from one request to a fleet of GPUs</text>
<rect x="20" y="44" width="150" height="62" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="34" y="60" text-anchor="start" class="h" style="fill: rgb(0,214,162);">Part I</text><text x="34" y="78" text-anchor="start" class="lbl">The whole serving stack,</text><text x="34" y="93" text-anchor="start" class="lbl">one layer at a time</text>
<rect x="182" y="44" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="196" y="60" text-anchor="start" class="h">Part II</text><text x="196" y="78" text-anchor="start" class="lbl">Scheduling and</text><text x="196" y="93" text-anchor="start" class="lbl">batching in depth</text>
<rect x="344" y="44" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="358" y="60" text-anchor="start" class="h">Part III</text><text x="358" y="78" text-anchor="start" class="lbl">PagedAttention and</text><text x="358" y="93" text-anchor="start" class="lbl">prefix caching in depth</text>
<rect x="506" y="44" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="520" y="60" text-anchor="start" class="h">Part IV</text><text x="520" y="78" text-anchor="start" class="lbl">Tiered KV caching</text><text x="520" y="93" text-anchor="start" class="lbl">beyond GPU memory</text>
<rect x="20" y="118" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="34" y="134" text-anchor="start" class="h">Part V</text><text x="34" y="152" text-anchor="start" class="lbl">Inside vLLM:</text><text x="34" y="167" text-anchor="start" class="lbl">following the code</text>
<rect x="182" y="118" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="196" y="134" text-anchor="start" class="h">Part VI</text><text x="196" y="152" text-anchor="start" class="lbl">Parallelism and</text><text x="196" y="167" text-anchor="start" class="lbl">sharding in depth</text>
<rect x="344" y="118" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="358" y="134" text-anchor="start" class="h">Part VII</text><text x="358" y="152" text-anchor="start" class="lbl">Routing and</text><text x="358" y="167" text-anchor="start" class="lbl">load balancing in depth</text>
<rect x="506" y="118" width="150" height="62" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="520" y="134" text-anchor="start" class="h">Part VIII</text><text x="520" y="152" text-anchor="start" class="lbl">Disaggregated</text><text x="520" y="167" text-anchor="start" class="lbl">prefill and decode</text>
<text x="340" y="202" text-anchor="middle" class="mut">You are here: Part I, the map of the whole stack. Each later part zooms into one piece of it.</text>
</svg>
