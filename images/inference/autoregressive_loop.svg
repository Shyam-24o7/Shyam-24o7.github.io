<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Autoregressive generation: one token out, fed straight back in</text>
<rect x="30" y="66" width="39" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="49.5" y="79" text-anchor="middle" class="n">The</text><rect x="75" y="66" width="67" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="108.5" y="79" text-anchor="middle" class="n">capital</text><rect x="148" y="66" width="32" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="164" y="79" text-anchor="middle" class="n">of</text><rect x="186" y="66" width="60" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="216" y="79" text-anchor="middle" class="n">France</text><rect x="252" y="66" width="32" height="26" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="268" y="79" text-anchor="middle" class="n">is</text><text x="30" y="52" text-anchor="start" class="mut">prompt tokens</text><rect x="294" y="66" width="54" height="26" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="321" y="79" text-anchor="middle" class="n">Paris</text><rect x="354" y="66" width="26" height="26" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="367" y="79" text-anchor="middle" class="n">.</text><text x="294" y="52" text-anchor="start" class="mut">generated, one per step</text>
<rect x="250" y="140" width="180" height="44" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="340" y="156" text-anchor="middle" class="h">the model</text><text x="340" y="172" text-anchor="middle" class="mut">one full forward pass</text><line x1="200" y1="96" x2="282.7" y2="132.8" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="290,136 284.5,128.6 280.9,136.9" fill="rgba(200,210,230,0.55)"/><text x="214" y="124" text-anchor="end" class="mut">whole sequence so far</text><line x1="430" y1="162" x2="512.0" y2="162.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="520,162 512.0,157.5 512.0,166.5" fill="rgba(200,210,230,0.55)"/><rect x="524" y="148" width="126" height="28" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="587" y="162" text-anchor="middle" class="n">next token</text><path d="M587 148 L587 112 Q587 102 577 102 L462 102" stroke="rgba(0,214,162,0.7)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><polygon points="466,97 458,102 466,107" fill="rgba(0,214,162,0.7)"/><text x="600" y="128" text-anchor="start" class="mut">appended, then</text><text x="600" y="140" text-anchor="start" class="mut">loop again</text>
<text x="340" y="214" text-anchor="middle" class="lbl">Each new token depends on every token before it, so the steps cannot run in parallel.</text>
<text x="340" y="232" text-anchor="middle" class="mut">A 500-token answer means 500 trips through the whole model.</text>
</svg>
