<svg width="100%" viewBox="0 0 680 236" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One step of vLLM’s engine loop</text>
<rect x="16" y="56" width="118" height="86" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="75" y="74" text-anchor="middle" class="h">requests</text><text x="75" y="94" text-anchor="middle" class="mut">waiting queue</text><text x="75" y="108" text-anchor="middle" class="mut">+ running batch</text><line x1="135" y1="99" x2="139.0" y2="99.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="147,99 139.0,94.5 139.0,103.5" fill="rgba(200,210,230,0.55)"/><rect x="148" y="56" width="118" height="86" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="207" y="74" text-anchor="middle" class="h">scheduler</text><text x="207" y="94" text-anchor="middle" class="mut">who runs this step,</text><text x="207" y="108" text-anchor="middle" class="mut">how many tokens each</text><text x="207" y="122" text-anchor="middle" class="mut">(token budget)</text><line x1="267" y1="99" x2="271.0" y2="99.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="279,99 271.0,94.5 271.0,103.5" fill="rgba(200,210,230,0.55)"/><rect x="280" y="56" width="118" height="86" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="339" y="74" text-anchor="middle" class="h">KV cache manager</text><text x="339" y="94" text-anchor="middle" class="mut">allocate blocks,</text><text x="339" y="108" text-anchor="middle" class="mut">reuse cached prefixes,</text><text x="339" y="122" text-anchor="middle" class="mut">preempt if full</text><line x1="399" y1="99" x2="403.0" y2="99.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="411,99 403.0,94.5 403.0,103.5" fill="rgba(200,210,230,0.55)"/><rect x="412" y="56" width="118" height="86" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="471" y="74" text-anchor="middle" class="h">forward pass</text><text x="471" y="94" text-anchor="middle" class="mut">all scheduled tokens</text><text x="471" y="108" text-anchor="middle" class="mut">on every GPU worker</text><text x="471" y="122" text-anchor="middle" class="mut">as one batch</text><line x1="531" y1="99" x2="535.0" y2="99.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="543,99 535.0,94.5 535.0,103.5" fill="rgba(200,210,230,0.55)"/><rect x="544" y="56" width="118" height="86" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="603" y="74" text-anchor="middle" class="h">sample + stream</text><text x="603" y="94" text-anchor="middle" class="mut">one token for each</text><text x="603" y="108" text-anchor="middle" class="mut">decoding request,</text><text x="603" y="122" text-anchor="middle" class="mut">detokenise, send</text><path d="M603 142 L603 168 Q603 176 595 176 L83 176 Q75 176 75 168 L75 150" stroke="rgba(0,214,162,0.7)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><polygon points="70,152 75,143 80,152" fill="rgba(0,214,162,0.7)"/><text x="340" y="188" text-anchor="middle" class="mut">finished requests free their blocks; new tokens join the running batch for the next step</text>
<text x="340" y="216" text-anchor="middle" class="lbl">Every few milliseconds, again. Everything in this post is a decision made inside this loop.</text>
</svg>
