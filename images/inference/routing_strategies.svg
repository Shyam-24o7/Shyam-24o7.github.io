<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Where should turn 5 of chat #42 go? (4K tokens of history, 100 new)</text>
<rect x="12" y="38" width="212" height="202" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="118" y="56" text-anchor="middle" class="h" style="fill: rgb(255,110,110);">round robin</text><rect x="78" y="70" width="80" height="24" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="118" y="82" text-anchor="middle" class="n">router</text><rect x="22" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="52" y="142" text-anchor="middle" class="mut">replica 0</text><rect x="30" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="30" y="154" width="19.8" height="7" fill="rgb(0,214,162)"/><text x="52" y="170" text-anchor="middle" class="mut">load</text><text x="52" y="184" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">#42 cached</text><rect x="88" y="130" width="60" height="64" rx="3" fill="rgb(60,18,22)" stroke="rgb(255,110,110)" stroke-width="1" /><text x="118" y="142" text-anchor="middle" class="mut">replica 1</text><rect x="96" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="96" y="154" width="39.6" height="7" fill="rgb(255,110,110)"/><text x="118" y="170" text-anchor="middle" class="mut">load</text><line x1="118" y1="95" x2="118.0" y2="120.0" stroke="rgb(255,110,110)" stroke-width="1.2" /><polygon points="118,128 122.5,120.0 113.5,120.0" fill="rgb(255,110,110)"/><rect x="154" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="184" y="142" text-anchor="middle" class="mut">replica 2</text><rect x="162" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="162" y="154" width="6.6" height="7" fill="rgb(0,214,162)"/><text x="184" y="170" text-anchor="middle" class="mut">load</text><text x="118" y="210" text-anchor="middle" class="mut">next in line, whatever its load</text><text x="118" y="226" text-anchor="middle" class="mut" style="fill: rgb(255,110,110);">busy replica + full 4K prefill</text><rect x="236" y="38" width="212" height="202" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="342" y="56" text-anchor="middle" class="h" style="fill: rgb(255,162,0);">least loaded</text><rect x="302" y="70" width="80" height="24" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="342" y="82" text-anchor="middle" class="n">router</text><rect x="246" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="276" y="142" text-anchor="middle" class="mut">replica 0</text><rect x="254" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="254" y="154" width="19.8" height="7" fill="rgb(0,214,162)"/><text x="276" y="170" text-anchor="middle" class="mut">load</text><text x="276" y="184" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">#42 cached</text><rect x="312" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="342" y="142" text-anchor="middle" class="mut">replica 1</text><rect x="320" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="320" y="154" width="39.6" height="7" fill="rgb(255,110,110)"/><text x="342" y="170" text-anchor="middle" class="mut">load</text><rect x="378" y="130" width="60" height="64" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="408" y="142" text-anchor="middle" class="mut">replica 2</text><rect x="386" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="386" y="154" width="6.6" height="7" fill="rgb(0,214,162)"/><text x="408" y="170" text-anchor="middle" class="mut">load</text><line x1="342" y1="95" x2="400.8" y2="124.4" stroke="rgb(255,162,0)" stroke-width="1.2" /><polygon points="408,128 402.9,120.4 398.8,128.4" fill="rgb(255,162,0)"/><text x="342" y="210" text-anchor="middle" class="mut">shortest queue right now</text><text x="342" y="226" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">fast queue, but a cache miss: 4K prefill again</text><rect x="460" y="38" width="212" height="202" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="566" y="56" text-anchor="middle" class="h" style="fill: rgb(0,214,162);">cache-aware</text><rect x="526" y="70" width="80" height="24" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="566" y="82" text-anchor="middle" class="n">router</text><rect x="470" y="130" width="60" height="64" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="500" y="142" text-anchor="middle" class="mut">replica 0</text><rect x="478" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="478" y="154" width="19.8" height="7" fill="rgb(0,214,162)"/><text x="500" y="170" text-anchor="middle" class="mut">load</text><text x="500" y="184" text-anchor="middle" class="mut" style="fill: rgb(255,162,0);">#42 cached</text><line x1="566" y1="95" x2="507.2" y2="124.4" stroke="rgb(0,214,162)" stroke-width="1.2" /><polygon points="500,128 509.2,128.4 505.1,120.4" fill="rgb(0,214,162)"/><rect x="536" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="566" y="142" text-anchor="middle" class="mut">replica 1</text><rect x="544" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="544" y="154" width="39.6" height="7" fill="rgb(255,110,110)"/><text x="566" y="170" text-anchor="middle" class="mut">load</text><rect x="602" y="130" width="60" height="64" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="632" y="142" text-anchor="middle" class="mut">replica 2</text><rect x="610" y="154" width="44" height="7" fill="rgba(200,210,230,0.15)"/><rect x="610" y="154" width="6.6" height="7" fill="rgb(0,214,162)"/><text x="632" y="170" text-anchor="middle" class="mut">load</text><text x="566" y="210" text-anchor="middle" class="mut">holds chat #42’s KV blocks</text><text x="566" y="226" text-anchor="middle" class="mut" style="fill: rgb(0,214,162);">cache hit: prefill only the 100 new tokens</text><text x="340" y="262" text-anchor="middle" class="lbl">Replicas are not interchangeable: each one holds a different KV cache.</text>
<text x="340" y="280" text-anchor="middle" class="mut">Real routers score cache overlap and load together, because chasing hits alone creates hot spots.</text>
</svg>
