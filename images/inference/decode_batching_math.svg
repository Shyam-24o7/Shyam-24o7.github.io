<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Decode on an H100, Llama 3 8B in FP16, 2K-token contexts: what batching buys</text>
<text x="30" y="52" text-anchor="start" class="mut"></text><text x="120" y="52" text-anchor="start" class="mut">read per step</text><text x="220" y="52" text-anchor="start" class="mut">step time</text><text x="310" y="52" text-anchor="start" class="mut">total tokens/s</text><text x="560" y="52" text-anchor="start" class="mut">per user</text><rect x="20" y="70" width="640" height="40" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="30" y="90" text-anchor="start" class="h">batch 1</text><text x="120" y="90" text-anchor="start" class="lbl">16.3 GB</text><text x="220" y="90" text-anchor="start" class="lbl">4.9 ms</text><rect x="310" y="80" width="6.674418604651163" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="322.6744186046512" y="90" text-anchor="start" class="n">205</text><text x="560" y="90" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">205 tok/s</text>
<rect x="20" y="120" width="640" height="40" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="30" y="140" text-anchor="start" class="h">batch 8</text><text x="120" y="140" text-anchor="start" class="lbl">18.2 GB</text><text x="220" y="140" text-anchor="start" class="lbl">5.4 ms</text><rect x="310" y="130" width="47.925581395348836" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="363.92558139534884" y="140" text-anchor="start" class="n">1,472</text><text x="560" y="140" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">184 tok/s</text>
<rect x="20" y="170" width="640" height="40" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.15)" stroke-width="1" /><text x="30" y="190" text-anchor="start" class="h">batch 64</text><text x="120" y="190" text-anchor="start" class="lbl">33.2 GB</text><text x="220" y="190" text-anchor="start" class="lbl">9.9 ms</text><rect x="310" y="180" width="210" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="526" y="190" text-anchor="start" class="n">6,450</text><text x="560" y="190" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">101 tok/s</text>
<text x="340" y="236" text-anchor="middle" class="lbl">Every step reads all 16 GB of weights once, however many sequences share it, plus each sequence’s KV cache.</text>
<text x="340" y="254" text-anchor="middle" class="mut">Batch 64: 31× the throughput for each user getting half the speed. Still memory-bound (intensity ≈ 64, ridge ≈ 295).</text>
<text x="340" y="272" text-anchor="middle" class="mut">Estimates from bandwidth alone (3.35 TB/s), ignoring compute and kernel overheads.</text>
</svg>
