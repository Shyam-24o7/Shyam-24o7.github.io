<svg width="100%" viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #70829e; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Tensor parallelism: split every weight matrix, then sum the partial results</text>
<rect x="24" y="72" width="64" height="96" rx="3" fill="#161826" stroke="rgba(200,210,230,0.3)" stroke-width="1" /><text x="56" y="112" text-anchor="middle" class="n">token</text><text x="56" y="127" text-anchor="middle" class="n">vectors</text><text x="56" y="148" text-anchor="middle" class="mut">on both</text><text x="126" y="52" text-anchor="start" class="h" style="fill: rgb(48,148,255);">GPU 0</text><line x1="89" y1="78" x2="116.0" y2="78.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="124,78 116.0,73.5 116.0,82.5" fill="rgba(200,210,230,0.55)"/><rect x="126" y="60" width="140" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="196" y="72" text-anchor="middle" class="n">W_up</text><text x="196" y="86" text-anchor="middle" class="mut">columns 1 to N/2</text><line x1="267" y1="78" x2="282.0" y2="78.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="290,78 282.0,73.5 282.0,82.5" fill="rgba(200,210,230,0.55)"/><rect x="292" y="66" width="58" height="24" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="321" y="78" text-anchor="middle" class="n">act</text><line x1="351" y1="78" x2="366.0" y2="78.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="374,78 366.0,73.5 366.0,82.5" fill="rgba(200,210,230,0.55)"/><rect x="376" y="60" width="140" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="446" y="72" text-anchor="middle" class="n">W_down</text><text x="446" y="86" text-anchor="middle" class="mut">rows 1 to N/2</text><line x1="517" y1="78" x2="540.0" y2="78.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="548,78 540.0,73.5 540.0,82.5" fill="rgba(200,210,230,0.55)"/><text x="532" y="66" text-anchor="middle" class="mut">partial</text><text x="126" y="132" text-anchor="start" class="h" style="fill: rgb(48,148,255);">GPU 1</text><line x1="89" y1="158" x2="116.0" y2="158.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="124,158 116.0,153.5 116.0,162.5" fill="rgba(200,210,230,0.55)"/><rect x="126" y="140" width="140" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="196" y="152" text-anchor="middle" class="n">W_up</text><text x="196" y="166" text-anchor="middle" class="mut">columns N/2 to N</text><line x1="267" y1="158" x2="282.0" y2="158.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="290,158 282.0,153.5 282.0,162.5" fill="rgba(200,210,230,0.55)"/><rect x="292" y="146" width="58" height="24" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="321" y="158" text-anchor="middle" class="n">act</text><line x1="351" y1="158" x2="366.0" y2="158.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="374,158 366.0,153.5 366.0,162.5" fill="rgba(200,210,230,0.55)"/><rect x="376" y="140" width="140" height="36" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="446" y="152" text-anchor="middle" class="n">W_down</text><text x="446" y="166" text-anchor="middle" class="mut">rows N/2 to N</text><line x1="517" y1="158" x2="540.0" y2="158.0" stroke="rgba(200,210,230,0.55)" stroke-width="1.2" /><polygon points="548,158 540.0,153.5 540.0,162.5" fill="rgba(200,210,230,0.55)"/><text x="532" y="146" text-anchor="middle" class="mut">partial</text><rect x="550" y="60" width="100" height="116" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="600" y="104" text-anchor="middle" class="h">all-reduce</text><text x="600" y="120" text-anchor="middle" class="mut">sum over</text><text x="600" y="134" text-anchor="middle" class="mut">NVLink</text><text x="340" y="206" text-anchor="middle" class="lbl">Each GPU stores and reads half of every matrix, so a memory-bound decode step takes about half as long.</text>
<text x="340" y="226" text-anchor="middle" class="mut">The price: an all-reduce after attention and another after the MLP, in every layer, on every step.</text>
<text x="340" y="244" text-anchor="middle" class="mut">That is why tensor parallelism lives inside one NVLink-connected node.</text>
</svg>
