<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One user versus a production server</text>
<text x="120" y="56" text-anchor="end" class="h">one user</text><rect x="130" y="46" width="10" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="141" y="46" width="120" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="559" y="46" width="8" height="20" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="568" y="46" width="70" height="20" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="270" y="56" text-anchor="start" class="mut">idle while the user reads and replies</text>
<text x="120" y="100" text-anchor="end" class="h">production</text><text x="120" y="114" text-anchor="end" class="mut">12 requests</text><text x="120" y="127" text-anchor="end" class="mut">in 2 seconds</text><rect x="130" y="92" width="6" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="137" y="92" width="300" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="145.6" y="107" width="30" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="176.6" y="107" width="120" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="176.8" y="122" width="4" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="181.8" y="122" width="420" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="195" y="137" width="12" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="208" y="137" width="180" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="239.2" y="152" width="50" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="290.2" y="152" width="60" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="260" y="167" width="8" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="269" y="167" width="380" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="312" y="182" width="18" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="331" y="182" width="260" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="358.8" y="197" width="3" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="362.8" y="197" width="287.2" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="403" y="212" width="40" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="444" y="212" width="200" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="447.2" y="227" width="10" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="458.2" y="227" width="160" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="494" y="242" width="6" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="501" y="242" width="149" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><rect x="546" y="257" width="22" height="11" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><rect x="569" y="257" width="81" height="11" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><line x1="130" y1="280" x2="650" y2="280" stroke="rgba(222,220,209,0.45)" stroke-width="1" /><polygon points="646,275 654,280 646,285" fill="rgba(222,220,209,0.45)"/><text x="130" y="292" text-anchor="middle" class="mut">0 s</text><text x="260" y="292" text-anchor="middle" class="mut">0.5 s</text><text x="390" y="292" text-anchor="middle" class="mut">1 s</text><text x="520" y="292" text-anchor="middle" class="mut">1.5 s</text><text x="650" y="292" text-anchor="middle" class="mut">2 s</text><rect x="140" y="302" width="12" height="10" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="158" y="307" text-anchor="start" class="mut">prefill (prompt length varies 100×)</text><rect x="380" y="302" width="12" height="10" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="398" y="307" text-anchor="start" class="mut">decode (output length varies too)</text>
<text x="340" y="332" text-anchor="middle" class="lbl">At any instant, many requests are mid-flight on the same GPUs, all in different phases.</text>
