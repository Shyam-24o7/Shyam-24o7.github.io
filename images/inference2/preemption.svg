<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Preemption: when the KV cache fills up mid-flight</text>
<line x1="60" y1="60" x2="640" y2="60" stroke="rgba(255,110,110,0.7)" stroke-width="1" stroke-dasharray="5 4"/><text x="640" y="50" text-anchor="end" class="mut" style="fill: rgb(255,110,110);">all KV blocks in use</text><line x1="60" y1="200" x2="640" y2="200" stroke="rgba(222,220,209,0.45)" stroke-width="1" /><line x1="60" y1="60" x2="60" y2="200" stroke="rgba(222,220,209,0.45)" stroke-width="1" /><text x="34" y="130" text-anchor="middle" class="lbl" transform="rotate(-90 34 130)">KV cache used</text><text x="350" y="216" text-anchor="middle" class="mut">scheduling steps</text><path d="M60.0 123.0 L108.3 113.2 L156.7 102.0 L205.0 89.4 L253.3 76.8 L301.7 65.6 L350.0 60.0 L398.3 79.6 L446.7 74.0 L495.0 68.4 L543.3 64.2 L591.7 71.2 L640.0 67.0 " stroke="rgb(48,148,255)" stroke-width="2.2" fill="none"/><circle cx="350" cy="60" r="6" fill="rgb(255,110,110)"/><text x="398.33333333333337" y="123" text-anchor="start" class="mut" style="fill: rgb(255,110,110);">allocation fails at the red dot:</text><text x="398.33333333333337" y="138.4" text-anchor="start" class="mut" style="fill: rgb(255,110,110);">evict the newest request, E</text><text x="205" y="144" text-anchor="middle" class="mut">every running request grows by a token each step</text><rect x="20" y="232" width="310" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="32" y="243" text-anchor="start" class="h" style="font-size: 11px;">E’s blocks are freed</text><text x="32" y="257" text-anchor="start" class="mut" style="font-size: 9.5px;">but keep their contents, at the back of the eviction queue</text><rect x="350" y="232" width="310" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="362" y="243" text-anchor="start" class="h" style="font-size: 11px;">E goes to the front of waiting</text><text x="362" y="257" text-anchor="start" class="mut" style="font-size: 9.5px;">its computed-token count resets to 0</text><rect x="20" y="272" width="310" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="32" y="283" text-anchor="start" class="h" style="font-size: 11px;">no new requests are admitted</text><text x="32" y="297" text-anchor="start" class="mut" style="font-size: 9.5px;">for the rest of this step</text><rect x="350" y="272" width="310" height="34" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="362" y="283" text-anchor="start" class="h" style="font-size: 11px;">E comes back later</text><text x="362" y="297" text-anchor="start" class="mut" style="font-size: 9.5px;">cached full blocks are reused; only the rest is recomputed</text></svg>
