<svg width="100%" viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">One step, four requests, no padding: how a mixed batch is laid out</text>
<text x="30" y="52" text-anchor="start" class="mut">the flattened token list this step (9 tokens)</text><rect x="30" y="62" width="40" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="50" y="77" text-anchor="middle" class="n">A</text><rect x="82" y="62" width="40" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="102" y="77" text-anchor="middle" class="n">B</text><rect x="134" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="154" y="77" text-anchor="middle" class="n">C1</text><rect x="178" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="198" y="77" text-anchor="middle" class="n">C2</text><rect x="222" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="242" y="77" text-anchor="middle" class="n">C3</text><rect x="266" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="286" y="77" text-anchor="middle" class="n">C4</text><rect x="310" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="330" y="77" text-anchor="middle" class="n">C5</text><rect x="354" y="62" width="40" height="30" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="374" y="77" text-anchor="middle" class="n">C6</text><rect x="406" y="62" width="40" height="30" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="426" y="77" text-anchor="middle" class="n">D</text><text x="30" y="108" text-anchor="start" class="mut">A, B, D are decoding (1 new token each); C is partway through its prompt (6 tokens this step)</text><rect x="30" y="124" width="300" height="70" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="180" y="144" text-anchor="middle" class="h">linear layers (QKV, MLP, output)</text><text x="180" y="162" text-anchor="middle" class="mut">one matrix of 9 rows × 4,096</text><text x="180" y="178" text-anchor="middle" class="mut">positions don’t matter: no padding needed</text><rect x="350" y="124" width="300" height="70" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="500" y="144" text-anchor="middle" class="h">attention, per request</text><text x="500" y="162" text-anchor="middle" class="mut">query_start_loc = [0, 1, 2, 8, 9]</text><text x="500" y="178" text-anchor="middle" class="mut">each request reads only its own KV blocks</text><text x="30" y="216" text-anchor="start" class="mut">context each request attends over (tokens already in its KV cache)</text><text x="46" y="234" text-anchor="middle" class="n">A</text><rect x="62" y="226" width="107.9" height="16" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="177.93957703927492" y="234" text-anchor="start" class="mut">812 tokens</text><text x="46" y="256" text-anchor="middle" class="n">B</text><rect x="62" y="248" width="12.6" height="16" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="82.62839879154079" y="256" text-anchor="start" class="mut">95 tokens</text><text x="46" y="278" text-anchor="middle" class="n">C</text><rect x="62" y="270" width="272.2" height="16" rx="2" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="342.2416918429003" y="278" text-anchor="start" class="mut">2,048 tokens</text><text x="46" y="300" text-anchor="middle" class="n">D</text><rect x="62" y="292" width="440.0" height="16" rx="2" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><text x="510" y="300" text-anchor="start" class="mut">3,310 tokens</text><text x="340" y="330" text-anchor="middle" class="lbl">Requests at completely different positions share every weight read. That is the whole trick.</text>
</svg>
