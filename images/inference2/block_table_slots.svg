x="3" fill="#161826" stroke="rgba(200,210,230,0.25)" stroke-width="1" /><text x="500" y="198" text-anchor="middle" class="n" style="font-size: 10px;">10</text><text x="500" y="211" text-anchor="middle" class="mut" style="font-size: 8.5px;">other</text><rect x="525" y="186" width="40" height="34" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="545" y="198" text-anchor="middle" class="n" style="font-size: 10px;">11</text><text x="545" y="211" text-anchor="middle" class="mut" style="font-size: 8.5px;">X:2</text><rect x="570" y="186" width="40" height="34" rx="3" fill="#161826" stroke="rgba(200,210,230,0.25)" stroke-width="1" /><text x="590" y="198" text-anchor="middle" class="n" style="font-size: 10px;">12</text><text x="590" y="211" text-anchor="middle" class="mut" style="font-size: 8.5px;">other</text><rect x="615" y="186" width="40" height="34" rx="3" fill="#161826" stroke="rgba(200,210,230,0.25)" stroke-width="1" /><text x="635" y="198" text-anchor="middle" class="n" style="font-size: 10px;">13</text><text x="635" y="211" text-anchor="middle" class="mut" style="font-size: 8.5px;">other</text><line x1="290" y1="151" x2="357.7" y2="180.8" stroke="rgba(170,130,255,0.6)" stroke-width="1.2" /><polygon points="365,184 359.5,176.7 355.9,184.9" fill="rgba(170,130,255,0.6)"/><line x1="340" y1="151" x2="147.9" y2="182.7" stroke="rgba(170,130,255,0.6)" stroke-width="1.2" /><polygon points="140,184 148.6,187.1 147.2,178.3" fill="rgba(170,130,255,0.6)"/><line x1="390" y1="151" x2="537.2" y2="182.3" stroke="rgba(170,130,255,0.6)" stroke-width="1.2" /><polygon points="545,184 538.1,177.9 536.2,186.7" fill="rgba(170,130,255,0.6)"/><rect x="20" y="248" width="640" height="64" rx="3" fill="rgba(255,162,0,0.06)" stroke="rgba(255,162,0,0.55)" stroke-width="1" /><text x="36" y="264" text-anchor="start" class="lbl">token 37 → index 36 → logical block 36 ÷ 16 = 2, offset 36 mod 16 = 4</text><text x="36" y="282" text-anchor="start" class="lbl" style="fill: rgb(255,162,0);">block_table[2] = 11 → slot = 11 × 16 + 4 = 180</text><text x="36" y="300" text-anchor="start" class="mut">write: its K and V go to slot 180 in every layer’s cache.  read: attention walks blocks 7, 2, 11 in order.</text><text x="340" y="334" text-anchor="middle" class="mut">For Llama 3 8B, one block is 16 tokens × K and V × 8 heads × 128 dims × 2 bytes = 64 KiB per layer,</text><text x="340" y="350" text-anchor="middle" class="mut">or 2 MiB across all 32 layers. The block table is the same for every layer.</text><text x="340" y="372" text-anchor="middle" class="lbl">Contiguous inside a block, scattered between blocks: exactly like pages in virtual memory.</text>
