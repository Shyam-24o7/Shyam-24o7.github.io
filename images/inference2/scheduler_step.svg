<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Filling one step’s token budget (max_num_batched_tokens = 2,048)</text>
<rect x="31" y="56" width="17.375" height="44" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)"/><rect x="50.375" y="56" width="308" height="44" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)"/><text x="204.375" y="72" text-anchor="middle" class="n">running prefill</text><text x="204.375" y="88" text-anchor="middle" class="mut">chunk of 1,024</text><rect x="360.375" y="56" width="288.625" height="44" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)"/><text x="504.6875" y="72" text-anchor="middle" class="n">new request</text><text x="504.6875" y="88" text-anchor="middle" class="mut">960 of its 1,500 uncached tokens</text><line x1="39.6875" y1="124" x2="39.7" y2="112.0" stroke="rgba(0,214,162,0.8)" stroke-width="1.2" /><polygon points="39.6875,104 35.2,112.0 44.2,112.0" fill="rgba(0,214,162,0.8)"/><text x="45.6875" y="132" text-anchor="start" class="mut" style="fill: rgb(0,214,162);">64 decodes: first, always</text><text x="30" y="114" text-anchor="middle" class="mut">0</text><text x="185" y="114" text-anchor="middle" class="mut">512</text><text x="340" y="114" text-anchor="middle" class="mut">1,024</text><text x="495" y="114" text-anchor="middle" class="mut">1,536</text><text x="650" y="114" text-anchor="middle" class="mut">2,048</text><circle cx="44" cy="162" r="10" fill="rgba(255,162,0,0.18)" stroke="rgb(255,162,0)"/><text x="44" y="162" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">1</text><text x="64" y="162" text-anchor="start" class="h">running requests first</text><text x="260" y="162" text-anchor="start" class="mut">decodes and unfinished prompt chunks, in queue order</text><circle cx="44" cy="192" r="10" fill="rgba(255,162,0,0.18)" stroke="rgb(255,162,0)"/><text x="44" y="192" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">2</text><text x="64" y="192" text-anchor="start" class="h">allocate KV blocks</text><text x="260" y="192" text-anchor="start" class="mut">if blocks run out, preempt the newest running request</text><circle cx="44" cy="222" r="10" fill="rgba(255,162,0,0.18)" stroke="rgb(255,162,0)"/><text x="44" y="222" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">3</text><text x="64" y="222" text-anchor="start" class="h">then waiting requests</text><text x="260" y="222" text-anchor="start" class="mut">only if nobody was preempted this step</text><circle cx="44" cy="252" r="10" fill="rgba(255,162,0,0.18)" stroke="rgb(255,162,0)"/><text x="44" y="252" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">4</text><text x="64" y="252" text-anchor="start" class="h">check the prefix cache</text><text x="260" y="252" text-anchor="start" class="mut">1,500 of the new request’s tokens were cached: skipped</text><circle cx="44" cy="282" r="10" fill="rgba(255,162,0,0.18)" stroke="rgb(255,162,0)"/><text x="44" y="282" text-anchor="middle" class="n" style="fill: rgb(255,162,0);">5</text><text x="64" y="282" text-anchor="start" class="h">stop when the budget is spent</text><text x="260" y="282" text-anchor="start" class="mut">or when max_num_seqs requests are running</text><text x="340" y="316" text-anchor="middle" class="lbl">There is no prefill phase or decode phase. Every request just catches up, a few tokens at a time.</text>
</svg>
