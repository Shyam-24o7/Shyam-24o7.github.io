<text x="340" y="360" text-anchor="middle" class="lbl">Past ~600 tokens per step, TTFT barely improves while every user’s stream slows in proportion.</text>
<text x="340" y="380" text-anchor="middle" class="mut">Bandwidth and peak-FLOP estimates (real kernels run ~1.5x slower); the shape is what matters.</text>
