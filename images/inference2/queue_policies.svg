<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; dominant-baseline: central; }
  .title { fill: #e8f0ff; font-size: 14px; font-weight: 500; }
  .mut { fill: #97a6bd; font-size: 10px; }
  .lbl { fill: #c8d2e6; font-size: 11px; }
  .n { fill: #e8f0ff; font-size: 10.5px; }
  .h { fill: #e8f0ff; font-size: 11.5px; font-weight: 600; }
</style>
<rect width="100%" height="100%" fill="#0b0c14" rx="6"/>
<text x="340" y="22" text-anchor="middle" class="title">Who goes first: two queue policies in vLLM</text>
<rect x="16" y="40" width="316" height="210" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><rect x="348" y="40" width="316" height="210" rx="3" fill="#12131c" stroke="rgba(200,210,230,0.18)" stroke-width="1" /><text x="174" y="58" text-anchor="middle" class="h" style="fill: rgb(48,148,255);">FCFS (default): a deque</text><text x="506" y="58" text-anchor="middle" class="h" style="fill: rgb(170,130,255);">priority: a heap</text><rect x="36" y="76" width="64" height="40" rx="3" fill="rgb(58,38,5)" stroke="rgb(255,162,0)" stroke-width="1" /><text x="68" y="90" text-anchor="middle" class="n">R1</text><text x="68" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">8K prompt</text><rect x="108" y="76" width="64" height="40" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="140" y="90" text-anchor="middle" class="n">R2</text><text x="140" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">hi</text><rect x="180" y="76" width="64" height="40" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="212" y="90" text-anchor="middle" class="n">R3</text><text x="212" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">hi</text><rect x="252" y="76" width="64" height="40" rx="3" fill="rgb(10,34,64)" stroke="rgb(48,148,255)" stroke-width="1" /><text x="284" y="90" text-anchor="middle" class="n">R4</text><text x="284" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">hi</text><text x="36" y="132" text-anchor="start" class="mut">served strictly in arrival order</text><text x="36" y="154" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">R1’s long prompt can eat the whole budget,</text><text x="36" y="168" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">and three tiny requests wait behind it</text><text x="36" y="196" text-anchor="start" class="mut" style="fill: rgb(0,214,162);">chunking and long_prefill_token_threshold</text><text x="36" y="210" text-anchor="start" class="mut" style="fill: rgb(0,214,162);">cap how much of a step one prompt can take</text><rect x="376" y="76" width="60" height="40" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="406" y="90" text-anchor="middle" class="n">p=0</text><text x="406" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">chat</text><rect x="448" y="76" width="60" height="40" rx="3" fill="rgb(5,54,42)" stroke="rgb(0,214,162)" stroke-width="1" /><text x="478" y="90" text-anchor="middle" class="n">p=1</text><text x="478" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">agent</text><rect x="520" y="76" width="60" height="40" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="550" y="90" text-anchor="middle" class="n">p=5</text><text x="550" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">eval</text><rect x="592" y="76" width="60" height="40" rx="3" fill="rgb(40,22,64)" stroke="rgb(170,130,255)" stroke-width="1" /><text x="622" y="90" text-anchor="middle" class="n">p=9</text><text x="622" y="105" text-anchor="middle" class="mut" style="font-size: 9px;">batch</text><text x="368" y="132" text-anchor="start" class="mut">ordered by (priority, arrival time)</text><text x="368" y="154" text-anchor="start" class="mut">lower number = more important</text><text x="368" y="176" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">when memory runs out, the least important</text><text x="368" y="190" text-anchor="start" class="mut" style="fill: rgb(255,162,0);">running request is preempted, not the newest</text><text x="368" y="212" text-anchor="start" class="mut">no fairness between users: that is the</text><text x="368" y="226" text-anchor="start" class="mut">gateway’s job (llm-d flow control)</text><text x="340" y="274" text-anchor="middle" class="lbl">Neither policy knows how long an answer will be, which is why shortest-job-first is still a research problem.</text>
</svg>
